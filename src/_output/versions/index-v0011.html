  <style>
:root {
  --bg-table: #808080;
  --bg-toolbar: #333333;
  --bg-card: #f5f5f5;
  --accent-blue: #2c7dd8;
  --text-primary: #1a1a1a;
  --text-light: #ffffff;
  --text-muted: #666666;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {

  background: var(--bg-table);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

h1 {
  margin: 0;
  padding: 0.75rem 1rem;
  font-size: 1.5rem;
  background: var(--bg-toolbar);
  color: var(--text-light);
  height: 3.5rem;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  z-index: 100;
}

#mode-switcher {
  position: fixed;
  top: 0.5rem;
  right: 1rem;
  z-index: 101;
}

#mode-switcher button {
  padding: 0.5rem 1rem;
  background: var(--accent-blue);
  color: var(--text-light);
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.875rem;
}

#mode-switcher button:hover {
  opacity: 0.9;
}

#content {
  flex: 1 1 auto;
  min-height: 0;
}

.edit-toolbar {
  width: 100%;
  box-sizing: border-box;
  background: var(--bg-toolbar);
  color: var(--text-light);
  padding: 0.5rem 1rem;
  flex-shrink: 0;
  z-index: 99;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 1rem;
}

.edit-toolbar button {
  color: inherit;
  background: none;
  border: 1px solid var(--text-light);
  padding: 0.5rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.875rem;
}

.edit-toolbar button:hover {
  background: rgba(255,255,255,0.1);
}

/* Infinite table surface */
.infinite-table {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--bg-table);
  overflow: hidden;
  cursor: grab;
  user-select: none;
}

.infinite-table.grabbing {
  cursor: grabbing;
}

.infinite-table__world {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  width: 100%;
  height: 100%;
}

/* Component list (table inside the floating component panel) */
.component-list {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.component-list__empty {
  color: var(--text-muted);
  text-align: center;
  padding: 1rem;
}

.component-list th {
  padding: 0.5rem;
  text-align: left;
  font-weight: 500;
  background: #f0f0f0;
}

.component-list td {
  padding: 0.5rem;
  border-top: 1px solid #ddd;
}

.component-list__id-cell {
  max-width: 6rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.component-list__actions-cell {
  white-space: nowrap;
}

.component-list__actions-cell button {
  padding: 0.25rem 0.5rem;
  margin-right: 0.25rem;
  background: var(--accent-blue);
  color: var(--text-light);
  border: none;
  border-radius: 3px;
  cursor: pointer;
  font-size: 0.75rem;
}

.component-list__actions-cell button:hover {
  opacity: 0.9;
}

.component-list__row {
  cursor: pointer;
}

.component-list__row:hover {
  background: #f9f9f9;
}

.component-list__row.component-list__row--selected {
  background: rgba(44, 125, 216, 0.15);
}

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  background: white;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}

.modal__header {
  padding: 1rem;
  border-bottom: 1px solid #eee;
}

.modal__tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid #ddd;
}

.modal__tab {
  padding: 0.75rem 1rem;
  background: #f9f9f9;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 0.875rem;
  border-bottom: 2px solid transparent;
}

.modal__tab.active {
  background: white;
  color: var(--text-primary);
  border-bottom-color: var(--accent-blue);
}

.modal__tab:hover {
  background: white;
}

.modal__content {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
}

.modal__field {
  margin-bottom: 1rem;
}

.modal__field label {
  display: block;
  font-size: 0.875rem;
  font-weight: 500;
  margin-bottom: 0.25rem;
}

.modal__field input[type="text"],
.modal__field input[type="number"],
.modal__field input[type="color"],
.modal__field textarea {
  width: 100%;
  padding: 0.5rem;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-family: inherit;
  font-size: 0.875rem;
}

.modal__field input[type="color"] {
  height: 40px;
  cursor: pointer;
}

.modal__error {
  color: #d32f2f;
  font-size: 0.75rem;
  margin-top: 0.25rem;
}

.modal__footer {
  padding: 1rem;
  border-top: 1px solid #eee;
  display: flex;
  gap: 0.5rem;
  justify-content: flex-end;
}

.btn-cancel, .btn-accept {
  padding: 0.5rem 1.5rem;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.875rem;
}

.btn-cancel {
  background: #f0f0f0;
  color: var(--text-primary);
}

.btn-cancel:hover {
  background: #e0e0e0;
}

.btn-accept {
  background: var(--accent-blue);
  color: var(--text-light);
}

.btn-accept:hover:not(:disabled) {
  opacity: 0.9;
}

.btn-accept:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Text box component */
.text-box {
  word-wrap: break-word;
  white-space: pre-wrap;
}

.text-box--selectable {
  cursor: pointer;
}

.text-box--selectable:hover {
  outline: 2px dashed var(--accent-blue);
}

.text-box--selectable.text-box--selected {
  outline: 3px dashed var(--accent-blue);
  outline-offset: 4px;
}

/* Reusable corner resize-handle (standard resize pattern across the app) */
.resize-handle {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 16px;
  height: 16px;
  cursor: nwse-resize;
}

.resize-handle::after {
  content: '';
  position: absolute;
  right: 3px;
  bottom: 3px;
  width: 8px;
  height: 8px;
  background:
    linear-gradient(135deg, transparent 0 45%, #999 45% 55%, transparent 55% 100%),
    linear-gradient(135deg, transparent 0 65%, #999 65% 75%, transparent 75% 100%);
}

.resize-handle:hover::after,
.resize-handle--active::after {
  background:
    linear-gradient(135deg, transparent 0 45%, var(--accent-blue) 45% 55%, transparent 55% 100%),
    linear-gradient(135deg, transparent 0 65%, var(--accent-blue) 65% 75%, transparent 75% 100%);
}

/* Floating component panel (edit mode) */
.component-panel-container {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 300px;
  z-index: 15;
}

.component-panel {
  position: relative;
  width: 100%;
  background: var(--bg-card);
  border-radius: 4px;
  overflow: hidden;
}

.component-panel__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.5rem 1rem;
  background: var(--bg-toolbar);
  color: var(--text-light);
  cursor: grab;
  user-select: none;
}

.component-panel__header.grabbing {
  cursor: grabbing;
}

.component-panel__header button {
  background: none;
  border: none;
  color: inherit;
  font-size: 1rem;
  cursor: pointer;
}

.component-panel__body {
  max-height: 320px;
  overflow-y: auto;
}

.component-panel__footer {
  padding: 0.5rem 1rem;
  border-top: 1px solid #ddd;
}

.component-panel__footer button {
  width: 100%;
  padding: 0.5rem;
  background: var(--accent-blue);
  color: var(--text-light);
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.component-panel__footer button:hover {
  opacity: 0.9;
}

/* Toast (aviso breve no bloqueante) */
.toast {
  display: none;
  position: fixed;
  bottom: 1.25rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-toolbar);
  color: var(--text-light);
  padding: 0.5rem 1rem;
  border-radius: 4px;
  font-size: 0.75rem;
  z-index: 1100;
}

.toast--visible {
  display: block;
}

#app-version {
  position: fixed;
  bottom: 1rem;
  right: 1rem;
  font-size: 0.75rem;
  color: var(--text-muted);
  z-index: 10;
}

// Persistencia del estado de componentes: autoguardado en localStorage
// (un único slot por navegador/perfil) y lectura de la semilla embebida en
// el propio documento (usada cuando aún no hay nada guardado en el navegador).

const { CURRENT_VERSION } = require('data/version.js');

const STORAGE_KEY = 'errantes:state';

function parseState(raw) {
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch {
    return { error: true };
  }
  if (!parsed || parsed.version !== CURRENT_VERSION || !Array.isArray(parsed.components)) {
    return { error: true };
  }
  return { components: parsed.components };
}

function saveState(components) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: CURRENT_VERSION, components }));
  } catch {
    // Cuota excedida u otro fallo de localStorage: el autoguardado se omite
    // silenciosamente, sin interrumpir el uso normal de la aplicación.
  }
}

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw === null) return null;
  return parseState(raw);
}

function readSeedState() {
  const seedEl = document.getElementById('initial-state');
  const raw = seedEl?.textContent.trim();
  if (!raw) return null;
  const result = parseState(raw);
  return result.error ? null : result;
}

module.exports.loadState = loadState;
module.exports.readSeedState = readSeedState;
