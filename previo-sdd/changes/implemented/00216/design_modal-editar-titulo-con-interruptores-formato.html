<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar título de componente — con interruptores de formato</title>
<style>
  :root {
    --bg-card: #f5f5f5;
    --accent-blue: #2c7dd8;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
    --transition-fast: 150ms ease;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #c2c2c2;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 1rem;
  }
  .modal-overlay {
    background: rgba(0,0,0,0.5);
    padding: 2rem;
    border-radius: var(--radius-lg);
  }
  .modal {
    width: 420px;
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    display: flex;
    flex-direction: column;
    max-height: 80vh;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
    font-size: 1.125rem;
    font-weight: 500;
  }
  .modal__content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
  }
  .modal__field {
    margin-bottom: 1rem;
  }
  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .modal__field textarea {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.875rem;
    resize: vertical;
  }
  .modal__field input[type="color"] {
    height: 40px;
    width: 100%;
    padding: 0.25rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .field-row {
    display: flex;
    gap: 0.5rem;
  }
  .field-row > div {
    flex: 1;
  }
  .align-group {
    display: flex;
    gap: 0.25rem;
    margin-bottom: 0.5rem;
  }
  .align-group__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    background: var(--bg-subtle);
    color: var(--text-primary);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .align-group__btn.active {
    background: var(--accent-blue);
    color: var(--text-light);
  }
  .modal__opacity-value {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    margin-top: 0.5rem;
  }
  .modal__opacity-value input[type="text"] {
    width: 3.5rem;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.875rem;
  }
  input[type="range"] {
    width: 100%;
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }
  .btn-cancel, .btn-accept {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    cursor: pointer;
  }
  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }
  .preview-note {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: -0.5rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">Editar título de componente</div>
    <div class="modal__content">

      <div class="modal__field">
        <label>Contenido</label>
        <textarea rows="3" style="font-weight:700; text-decoration:underline;">Zona de inicio</textarea>
        <div class="align-group" title="Negrita / Cursiva / Subrayado — se aplican a todo el título, se pueden combinar" style="margin-top:0.5rem;">
          <button type="button" class="align-group__btn active" aria-label="Negrita" style="font-weight:700;">N</button>
          <button type="button" class="align-group__btn" aria-label="Cursiva" style="font-style:italic;">K</button>
          <button type="button" class="align-group__btn active" aria-label="Subrayado" style="text-decoration:underline;">S</button>
        </div>
        <div class="preview-note">Negrita y Subrayado activados en este ejemplo (se aplican a todo el texto, no a una selección) — así se vería en Modo Juego.</div>
      </div>

      <div class="modal__field field-row">
        <div>
          <label>Color del texto</label>
          <input type="color" value="#000000">
        </div>
        <div>
          <label>Color de fondo</label>
          <input type="color" value="#ffffff">
        </div>
      </div>

      <div class="modal__field">
        <label>Transparencia del fondo</label>
        <input type="range" min="0" max="100" value="20">
        <div class="modal__opacity-value">
          <input type="text" value="20" readonly>
          <span>%</span>
        </div>
      </div>

    </div>
    <div class="modal__footer">
      <button class="btn-cancel" type="button">Cancelar</button>
      <button class="btn-accept" type="button">Aceptar</button>
    </div>
  </div>
</div>
</body>
</html>
