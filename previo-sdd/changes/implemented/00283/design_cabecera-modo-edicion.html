<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mockup — Cabecera en modo edición</title>
<style>
  :root {
    --bg-toolbar: #333333;
    --accent-blue: #2c7dd8;
    --text-light: #ffffff;
    --gray-800: #3a3a3a;
    --text-lg: 1.5rem;
    --text-sm: 0.875rem;
  }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #c2c2c2;
  }
  .mockup-label {
    padding: 0.5rem 1rem;
    font-size: 0.8rem;
    color: #333;
    background: #eee;
    border-bottom: 1px solid #ccc;
  }
  h1 {
    margin: 0;
    padding: 0.75rem 1rem;
    font-size: var(--text-lg);
    color: var(--text-light);
    box-sizing: border-box;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem 0.75rem;
    position: relative;
    /* Fondo con textura sutil (trama de rayas diagonales) sobre el degradado
       existente, para diferenciar visualmente la barra en modo edición. */
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 8px),
      linear-gradient(180deg, var(--gray-800), var(--bg-toolbar));
  }
  /* Nuevo: bloque título + indicador, en columna, para que el indicador quede debajo. */
  .app-title__block {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    line-height: 1.2;
  }
  .app-title__row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  /* Nuevo elemento: indicador de modo edición, en azul de acento, con un tamaño
     notablemente más grande que un badge diminuto (--text-md en vez de --text-xs)
     para que se note como estado activo, aunque quede por debajo del título
     (--text-lg). */
  .app-title__mode-indicator {
    font-size: var(--text-md, 1.125rem);
    font-weight: 600;
    color: #7ab8f5;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  #mode-switcher {
    position: fixed;
    top: 0.75rem;
    right: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  /* Botón de modo, réplica fiel del real (editModeToggle.js, createModeButton):
     en MODO EDICIÓN (isPlay = false) es iconTextButton(mode-play, "Modo Juego")
     -> icono + texto. Aquí el texto pasa a "Ir al Modo Juego". */
  #mode-switcher .mode-switcher__mode-btn {
    background: var(--accent-blue);
    color: var(--text-light);
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    font-size: var(--text-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
  }
  #mode-switcher .mode-switcher__mode-btn:hover {
    opacity: 0.9;
  }
  .icon-frame {
    width: 16px;
    height: 16px;
    display: block;
  }
</style>
</head>
<body>
  <div class="mockup-label">Cabecera en MODO EDICIÓN — indicador bajo el título, botón fiel al real (icono + "Ir al Modo Juego"), trama en la barra</div>

  <h1>
    <div class="app-title__block">
      <div class="app-title__row">
        Mi Juego de Mesa — v0.9.7
      </div>
      <span class="app-title__mode-indicator">Modo Edición</span>
    </div>
  </h1>

  <div id="mode-switcher">
    <button type="button" class="mode-switcher__mode-btn">
      <svg class="icon-frame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Ir al Modo Juego</span>
    </button>
  </div>
</body>
</html>
