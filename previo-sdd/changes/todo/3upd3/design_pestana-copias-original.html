<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maqueta — Pestaña "Copias" (componente Original)</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --bg-toolbar: #333333;
    --bg-card: #f5f5f5;
    --accent-blue: #2c7dd8;
    --accent-blue-dark: #123a66;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --error: #d32f2f;
    --success: #2e7d32;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-1: 0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
    --transition-fast: 150ms ease;
    --section-accent: #5b5f97;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .mockup-note {
    position: fixed;
    top: 0.75rem;
    left: 0.75rem;
    background: var(--bg-toolbar);
    color: var(--text-light);
    font-size: 0.75rem;
    padding: 0.4rem 0.7rem;
    border-radius: var(--radius-sm);
    opacity: 0.85;
  }

  .modal-overlay {
    position: static;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 480px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
  }

  .modal__header-title {
    margin: 0;
    font-size: 1.125rem;
    color: var(--text-primary);
  }

  .modal__tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-neutral);
  }

  .modal__tab {
    padding: 0.75rem 1rem;
    background: var(--bg-hover);
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.875rem;
    border-bottom: 2px solid transparent;
  }

  .modal__tab.active {
    background: white;
    color: var(--text-primary);
    border-bottom-color: var(--accent-blue);
  }

  .modal__content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
  }

  .component-copies-summary__row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.25rem 0 0.75rem;
    font-size: 0.8125rem;
    color: var(--text-muted);
    gap: 1rem;
  }

  .component-copies-summary__label {
    font-weight: 500;
  }

  .btn-cancel, .btn-accept, .btn-eliminar {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    transition: background var(--transition-fast), opacity var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }

  .btn-cancel:hover {
    background: var(--bg-hover);
  }

  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }

  .btn-accept:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(44, 125, 216, 0.35);
  }

  .btn-eliminar {
    background: var(--error);
    color: var(--text-light);
  }

  .btn-eliminar:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(211, 47, 47, 0.3);
  }

  .component-copies-summary__button {
    width: 100%;
    margin-bottom: 0.75rem;
  }

  .full-action-btn {
    width: 100%;
    margin-bottom: 0.5rem;
    text-align: center;
  }

  .new-marker {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--accent-blue);
    background: var(--accent-blue-light);
    border: 1px solid rgba(44, 125, 216, 0.35);
    border-radius: var(--radius-sm);
    padding: 0.1rem 0.4rem;
    margin-left: 0.5rem;
    vertical-align: middle;
  }

  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin: 1rem 0 0;
    padding: 1rem 1.25rem;
  }

  fieldset.modal__section > *:last-child {
    margin-bottom: 0;
  }

  legend.modal__section-title {
    padding: 0 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--section-accent);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0;
  }

  .modal__field--checkbox label {
    display: inline;
    margin-bottom: 0;
  }

  .help-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-muted);
    color: var(--text-light);
    font-size: 0.7rem;
    font-weight: 600;
    cursor: help;
    user-select: none;
    flex-shrink: 0;
  }

  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }
</style>
</head>
<body>
  <div class="mockup-note">Maqueta — pestaña "Copias" del modal de un componente Original (change 00194). Bloques 1-3 ya existen hoy; el bloque marcado "NUEVO" es la propuesta.</div>

  <div class="modal-overlay">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__header-title">Propiedades del componente</h2>
      </div>
      <div class="modal__tabs">
        <button class="modal__tab">Generales</button>
        <button class="modal__tab">Específicas</button>
        <button class="modal__tab active">Copias</button>
      </div>
      <div class="modal__content">

        <!-- Bloque 1 (ya existe): resumen + ver copias vinculadas -->
        <div class="component-copies-summary">
          <div class="component-copies-summary__row">
            <span class="component-copies-summary__label">Copias: 3</span>
          </div>
          <button class="btn-cancel component-copies-summary__button" type="button">Ver copias vinculadas...</button>
        </div>

        <!-- Bloque 2 (ya existe): sincronizar todas -->
        <button class="btn-accept full-action-btn" type="button">Sincronizar todas las copias</button>

        <!-- Bloque nuevo (change 00194) -->
        <button class="btn-eliminar full-action-btn" type="button">
          Convertir copias en originales<span class="new-marker">Nuevo</span>
        </button>

        <!-- Bloque 3 (ya existe): desincronizar todas -->
        <fieldset class="modal__section">
          <legend class="modal__section-title">Desincronizar todas las copias</legend>
          <div class="modal__field--checkbox">
            <input type="checkbox">
            <label>Oculto</label>
            <span class="help-icon">?</span>
          </div>
        </fieldset>

      </div>
      <div class="modal__footer">
        <button class="btn-cancel" type="button">Cancelar</button>
        <button class="btn-accept" type="button">Aceptar</button>
      </div>
    </div>
  </div>
</body>
</html>
