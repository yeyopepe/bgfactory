<!doctype html>
<!-- Mockup estático de la pantalla de bienvenida (splash) — cambio 00245.
     Identidad visual replicada de previo-sdd/design/docs/style/ (tokens 001, patrón de modal sin botones 003).
     El JS es solo decorativo (anima una barra de ejemplo en bucle); la pantalla real no reacciona a eventos. -->
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup — Pantalla de bienvenida (splash) · logo 2 · cambio 00245</title>
<style>
  :root {
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-muted: #666666;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --progress-track: rgba(44, 125, 216, 0.15);
    /* Degradado del fondo de la ventana del splash: cubre TODA la ventana,
       de un azul claro arriba-izquierda a un lila/rosa muy suave abajo-derecha
       (misma familia de color que los logos), bien perceptible. */
    --splash-bg: linear-gradient(135deg, #e3effb 0%, #eef1fb 45%, #f7ecf6 100%);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: system-ui, sans-serif;
    color: var(--text-primary);
    background: #ffffff;
  }

  /* Capa que cubre toda la ventana del navegador y centra la ventana del splash. */
  .splash-overlay {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
    z-index: 1100; /* por encima de .modal-overlay (1000) y .context-menu (1050) */
  }

  /* Ventana del splash: degradado suave que abarca TODO el fondo de la ventana,
     esquinas redondeadas, sombra nivel 2. Sin cabecera, sin pie, sin botones.
     `overflow: hidden` para que la barra inferior respete el border-radius. */
  .splash-window {
    position: relative;
    background: var(--splash-bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
    padding: 1.75rem 1.75rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    /* El área del logo es de 800x600 px nominales; aquí se limita para caber
       en un viewport normal manteniendo la proporción 4:3. */
    width: min(90vw, 520px);
  }

  /* Área del logo: proporción 4:3 (nominal 800x600 px). La imagen se ve entera,
     centrada, sin recorte ni deformación (equivale a object-fit: contain).
     Fondo transparente: se ve el degradado de la ventana por detrás. */
  .splash-logo-area {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .splash-logo-area img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    /* Difuminado amplio de los bordes de la imagen: su fondo claro propio se
       funde con el degradado de la ventana, sin recuadro visible ni corte. */
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 48%, #000 40%, transparent 92%);
            mask-image: radial-gradient(ellipse 70% 70% at 50% 48%, #000 40%, transparent 92%);
  }

  /* Nota informativa, solo del mockup */
  .splash-logo-note {
    margin: 0;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* Nombre de la aplicación: texto de marca fijo, grande y centrado. */
  .splash-title {
    margin: 0;
    font-size: 2.25rem;
    font-weight: 700;
    text-align: center;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .splash-title sup {
    font-size: 0.5em;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: 0.15em;
    vertical-align: super;
  }

  /* Barra de progreso fina, pegada al borde inferior de la ventana, a todo el
     ancho. Carril tenue + relleno azul (--accent-blue) que crece de izquierda a
     derecha durante los 5 s. En la ventana principal se muestra en bucle. */
  .splash-progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background: var(--progress-track);
  }

  .splash-progress__fill {
    height: 100%;
    width: 0;
    background: var(--accent-blue);
  }

  /* Animación de ejemplo (solo mockup): llenado lineal de 0 a 100% en 5 s. */
  .splash-progress__fill--demo {
    animation: splash-fill 5s linear infinite;
  }

  @keyframes splash-fill {
    from { width: 0; }
    to { width: 100%; }
  }

  /* --- Panel de ejemplo de la barra de avance en distintos momentos --- */
  .progress-samples {
    width: min(90vw, 520px);
    background: #ffffff;
    border: 1px solid var(--border-neutral, #dcdcdc);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    padding: 1.25rem 1.5rem 1.5rem;
  }

  .progress-samples h2 {
    margin: 0 0 1rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .progress-sample {
    display: grid;
    grid-template-columns: 5.5rem 1fr;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  .progress-sample:first-of-type { margin-top: 0; }

  .progress-sample__label {
    font-size: 0.8125rem;
    color: var(--text-muted);
    text-align: right;
  }

  .progress-sample__track {
    height: 4px;
    background: var(--progress-track);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-sample__fill {
    height: 100%;
    background: var(--accent-blue);
  }

  /* Etiqueta auxiliar del mockup (no forma parte de la pantalla real) */
  .mockup-caption {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    margin: 0;
    padding: 0.25rem 0.75rem;
    font-size: 0.75rem;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 4px;
    z-index: 1200;
  }
</style>
</head>
