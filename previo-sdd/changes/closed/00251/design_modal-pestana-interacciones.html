<title>Maqueta — Pestaña "Interacciones" en la modal de configuración de componente</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: #e8e8ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #24242c;
  }

  .modal {
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    overflow: hidden;
  }

  .modal__header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid #dcdce2;
    font-weight: 600;
    font-size: 1.05rem;
  }

  .modal__tabs {
    display: flex;
    border-bottom: 1px solid #dcdce2;
    background: #f5f5f8;
  }

  .modal__tab {
    padding: 0.6rem 0.9rem;
    font-size: 0.85rem;
    color: #6a6a76;
    border: none;
    background: transparent;
    cursor: default;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }

  .modal__tab.active {
    color: #24242c;
    font-weight: 600;
    border-bottom-color: #4a63e0;
    background: #ffffff;
  }

  /* Resalte solo para la maqueta: marca la pestaña que introduce este cambio. */
  .modal__tab--new::after {
    content: "nueva";
    display: inline-block;
    margin-left: 0.4rem;
    padding: 0.05rem 0.4rem;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #ffffff;
    background: #4a63e0;
    border-radius: 999px;
    vertical-align: middle;
  }

  .modal__content {
    padding: 1.25rem;
    max-height: 70vh;
    overflow-y: auto;
  }

  .modal__field {
    margin-bottom: 0.9rem;
  }

  .modal__field > label {
    display: block;
    font-size: 0.78rem;
    color: #4a4a55;
    margin-bottom: 0.3rem;
  }

  .modal__field select {
    width: 100%;
    padding: 0.4rem 0.55rem;
    font-size: 0.85rem;
    border: 1px solid #c9c9d2;
    border-radius: 4px;
    background: #fff;
    color: #24242c;
  }

  .modal__section {
    border: 1px solid #dcdce2;
    border-radius: 6px;
    padding: 0.9rem 0.9rem 0.6rem;
    margin: 0 0 1rem;
  }

  .modal__section-title {
    padding: 0 0.35rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #6a6a76;
  }

  .field-label-row {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 0.3rem;
  }

  .field-label-row label {
    font-size: 0.78rem;
    color: #4a4a55;
    margin: 0;
  }

  .help-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 999px;
    border: 1px solid #a9a9b6;
    color: #6a6a76;
    font-size: 0.62rem;
    font-weight: 700;
    line-height: 1;
    cursor: help;
  }

  .modal__hint {
    font-size: 0.75rem;
    color: #8a8a96;
    margin: 0.15rem 0 0;
  }

  .modal__footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.6rem;
    padding: 0.85rem 1.25rem;
    border-top: 1px solid #dcdce2;
    background: #f5f5f8;
  }

  .btn-cancel, .btn-accept, .btn-delete {
    padding: 0.45rem 1rem;
    font-size: 0.85rem;
    border-radius: 5px;
    cursor: default;
  }

  .btn-delete {
    margin-right: auto;
    background: #ffffff;
    border: 1px solid #d9534f;
    color: #d9534f;
    font-weight: 600;
  }

  .btn-cancel {
    background: #ffffff;
    border: 1px solid #c9c9d2;
    color: #4a4a55;
  }

  .btn-accept {
    background: #4a63e0;
    border: 1px solid #4a63e0;
    color: #ffffff;
    font-weight: 600;
  }
</style>

<div class="modal">
  <div class="modal__header">Propiedades del componente</div>

  <div class="modal__tabs">
    <button class="modal__tab">Generales</button>
    <button class="modal__tab">Visuales</button>
    <button class="modal__tab">Específicas</button>
    <button class="modal__tab modal__tab--new active">Interacciones</button>
    <button class="modal__tab">Copias</button>
  </div>

  <div class="modal__content">

    <fieldset class="modal__section">
      <legend class="modal__section-title">Interacciones programadas</legend>

      <div class="modal__field">
        <div class="field-label-row">
          <label>Al hacer click</label>
          <span class="help-icon">?</span>
        </div>
        <select disabled>
          <option selected>Lanzar dado</option>
          <option>Ninguna</option>
        </select>
      </div>

      <div class="modal__field">
        <div class="field-label-row">
          <label>Click derecho</label>
          <span class="help-icon">?</span>
        </div>
        <select disabled>
          <option>Ninguno</option>
          <option selected>Abrir menú contextual</option>
        </select>
      </div>

      <p class="modal__hint">
        Los desplegables de click izquierdo dependen del tipo de componente (aquí, un dado).
        La fila «Click derecho» aparece igual para todos los tipos.
      </p>
    </fieldset>

  </div>

  <div class="modal__footer">
    <button class="btn-delete" type="button">Eliminar</button>
    <button class="btn-cancel" type="button">Cancelar</button>
    <button class="btn-accept" type="button">Aceptar</button>
  </div>
</div>
