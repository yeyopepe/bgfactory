<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maqueta — Barra modo edición (estado normal)</title>
<style>
  :root {
    --bg-toolbar: #333333;
    --text-light: #ffffff;
    --accent-blue: #2c7dd8;
    --radius-sm: 4px;
    --shadow-1: 0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
    --transition-fast: 150ms ease;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #c2c2c2;
    min-height: 100vh;
  }
  .page-note {
    padding: 1rem 1.5rem;
    color: #444;
    font-size: 0.875rem;
  }
  .edit-toolbar {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg-toolbar);
    color: var(--text-light);
    padding: 0.5rem 1rem;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.5rem;
    box-shadow: var(--shadow-1);
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .toolbar-separator {
    width: 1px;
    align-self: stretch;
    margin: 0.25rem 0.5rem;
    background: rgba(255,255,255,0.18);
  }

  .toolbar-btn {
    color: inherit;
    background: none;
    border: 1px solid var(--text-light);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: background var(--transition-fast);
    white-space: nowrap;
  }

  .toolbar-btn:hover {
    background: rgba(255,255,255,0.1);
  }

  .toolbar-btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .toolbar-btn--icon-only {
    padding: 0.5rem;
    width: 36px;
    height: 36px;
    justify-content: center;
  }

  .toolbar-btn--dropdown svg.chevron {
    width: 12px;
    height: 12px;
    margin-left: -0.15rem;
  }

  .toolbar-view-group {
    margin-left: 1rem;
    padding-left: 1rem;
    border-left: 1px solid rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
  }

  /* Mock table surface below, just for context */
  .table-mock {
    height: 320px;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 40%),
      #c2c2c2;
  }
</style>
</head>
<body>
  <div class="page-note">Maqueta — barra de modo edición, estado normal (desplegable "Exportar" cerrado)</div>

  <div class="edit-toolbar">
    <div class="toolbar-group">
      <button class="toolbar-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Salir del modo edición
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button class="toolbar-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Guardar
      </button>
      <button class="toolbar-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 9 12 4 17 9"/>
          <line x1="12" y1="4" x2="12" y2="15"/>
        </svg>
        Importar
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button class="toolbar-btn toolbar-btn--dropdown" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Exportar
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-view-group">
      <button class="toolbar-btn toolbar-btn--icon-only" type="button" title="Ajustar zoom" aria-label="Ajustar zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 9V5a1 1 0 0 1 1-1h4" stroke-linecap="round"/>
          <path d="M20 9V5a1 1 0 0 0-1-1h-4" stroke-linecap="round"/>
          <path d="M4 15v4a1 1 0 0 0 1 1h4" stroke-linecap="round"/>
          <path d="M20 15v4a1 1 0 0 1-1 1h-4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="table-mock"></div>
</body>
</html>
