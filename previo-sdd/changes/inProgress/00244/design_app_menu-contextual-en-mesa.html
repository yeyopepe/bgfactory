<!-- Mockup de parte real de la app (menú contextual de edición sobre una pieza en la mesa) con iconos Lucide — cambio 00244 -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú contextual en la mesa — iconos Lucide (00244)</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --accent-blue-dark: #123a66;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-1: 0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    font-size: 0.875rem;
    color: var(--text-primary);
    background: var(--bg-table);
  }
  .table-surface {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background:
      linear-gradient(0deg, rgba(0,0,0,0.03) 1px, transparent 1px) 0 0 / 100% 40px,
      linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px) 0 0 / 40px 100%,
      var(--bg-table);
    padding: 4rem;
  }

  .scene {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
  }

  /* Simulated card component on the table */
  .piece-card {
    position: relative;
    width: 140px;
    height: 196px;
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
    outline: 2px dashed var(--accent-blue);
    outline-offset: 2px;
    flex-shrink: 0;
  }
  .component-id-label {
    position: absolute;
    top: 4px;
    left: 4px;
    background: var(--accent-blue-dark);
    color: var(--text-light);
    font-size: 0.72rem;
    border-radius: var(--radius-sm);
    padding: 2px 6px;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
    white-space: nowrap;
  }

  /* Context menu */
  .context-menu {
    min-width: 220px;
    background: var(--accent-blue-light);
    border: 1px solid rgba(44,125,216,0.25);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-2);
    overflow: hidden;
    align-self: flex-end;
  }
  .context-menu__description {
    padding: 0.5rem 0.75rem;
    cursor: default;
  }
  .context-menu__description-main {
    font-weight: 600;
    color: var(--text-primary);
  }
  .context-menu__separator {
    border: none;
    border-top: 1px solid rgba(44,125,216,0.25);
    margin: 0;
  }
  .context-menu__item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.75rem;
    border-bottom: 1px solid rgba(44,125,216,0.18);
    color: var(--text-primary);
    cursor: pointer;
  }
  .context-menu__item:last-child { border-bottom: none; }
  .context-menu__item-icon {
    display: inline-flex;
    flex-shrink: 0;
  }
  .context-menu__item-icon svg { width: 16px; height: 16px; }
  .context-menu__item.is-hover {
    background: var(--accent-blue);
    color: var(--text-light);
  }
  .context-menu__select-row {
    padding: 0.45rem 0.75rem;
    border-bottom: 1px solid rgba(44,125,216,0.18);
    cursor: default;
  }
  .context-menu__select-row:last-child { border-bottom: none; }
  .context-menu__select-row-label {
    display: block;
    font-size: 0.8125rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
  }
  .context-menu__select-row select {
    width: 100%;
    font: inherit;
    font-size: 0.8125rem;
    padding: 0.3rem 0.4rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    background: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="table-surface">
  <div class="scene">

    <div class="piece-card" aria-hidden="true">
      <span class="component-id-label">Carta: 3fa8c1</span>
    </div>

    <div class="context-menu" role="menu" aria-label="Acciones de la carta">
      <div class="context-menu__description">
        <div class="context-menu__description-main">Carta: 3fa8c1</div>
      </div>
      <hr class="context-menu__separator">

      <div class="context-menu__item" role="menuitem">
        <span class="context-menu__item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        </span>
        <span class="context-menu__item-label">Ocultar</span>
      </div>

      <div class="context-menu__item" role="menuitem">
        <span class="context-menu__item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </span>
        <span class="context-menu__item-label">Clonar</span>
      </div>

      <div class="context-menu__item" role="menuitem">
        <span class="context-menu__item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M16 4h2a2 2 0 0 1 2 2v4"/><path d="M21 14H11"/><path d="m15 10-4 4 4 4"/></svg>
        </span>
        <span class="context-menu__item-label">Copiar estilo</span>
      </div>

      <div class="context-menu__item is-hover" role="menuitem">
        <span class="context-menu__item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        </span>
        <span class="context-menu__item-label">Eliminar</span>
      </div>

      <hr class="context-menu__separator">

      <div class="context-menu__item" role="menuitem">
        <span class="context-menu__item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </span>
        <span class="context-menu__item-label">Voltear cara</span>
      </div>

      <!-- fila sin icono: pendiente de decidir si lleva 'tag' -->
      <div class="context-menu__select-row">
        <span class="context-menu__select-row-label">Añadir a etiqueta</span>
        <select>
          <option>Elegir etiqueta…</option>
        </select>
      </div>
    </div>

  </div>
</div>
</body>
</html>
