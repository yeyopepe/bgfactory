<!-- Mockup de parte real de la app (modal Añadir componente) con iconos Lucide — cambio 00244 -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Añadir componente — iconos Lucide (00244)</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --bg-card: #f5f5f5;
    --accent-blue: #2c7dd8;
    --accent-blue-dark: #123a66;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --error: #d32f2f;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --border-neutral: #dcdcdc;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    font-size: 0.875rem;
    color: var(--text-primary);
    background: var(--bg-table);
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    max-width: 500px;
    width: 100%;
    padding: 0;
    overflow: hidden;
  }
  .modal__header {
    font-size: 1.125rem;
    font-weight: 600;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border-neutral);
  }
  .modal__content { padding: 1rem 1.5rem; }
  .modal__footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }

  .component-type-modal__list {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .component-type-modal__item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.6rem;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .component-type-modal__item:hover {
    border-color: var(--border-neutral);
  }
  .component-type-modal__item.is-checked {
    background: var(--accent-blue-light);
    border-color: var(--accent-blue);
  }
  .component-type-modal__item input[type="radio"] {
    accent-color: var(--accent-blue);
    cursor: pointer;
    margin: 0;
  }
  .component-type-modal__icon {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: color 150ms ease;
  }
  .component-type-modal__icon svg { width: 20px; height: 20px; }
  .component-type-modal__item:hover .component-type-modal__icon,
  .component-type-modal__item.is-checked .component-type-modal__icon {
    color: var(--accent-blue);
  }
  .component-type-modal__item .type-name { color: var(--text-primary); }

  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
    border: none;
    border-radius: var(--radius-sm);
    padding: 0.5rem 1rem;
    font: inherit;
    font-size: 0.875rem;
    cursor: pointer;
  }
  .btn-cancel:hover { background: var(--bg-hover); }
  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
    border: none;
    border-radius: var(--radius-sm);
    padding: 0.5rem 1rem;
    font: inherit;
    font-size: 0.875rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="modal-overlay">
  <div class="modal" role="dialog" aria-label="Añadir componente">
    <div class="modal__header">Añadir componente</div>
    <div class="modal__content">
      <div class="component-type-modal__list">

        <label class="component-type-modal__item">
          <input type="radio" name="type">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="3" y1="6" y2="6"/><line x1="15" x2="3" y1="12" y2="12"/><line x1="17" x2="3" y1="18" y2="18"/></svg>
          </span>
          <span class="type-name">Texto</span>
        </label>

        <label class="component-type-modal__item">
          <input type="radio" name="type">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
          </span>
          <span class="type-name">Tablero simple</span>
        </label>

        <label class="component-type-modal__item">
          <input type="radio" name="type">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          </span>
          <span class="type-name">Tablero personalizado</span>
        </label>

        <label class="component-type-modal__item is-checked">
          <input type="radio" name="type" checked>
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M12 12h.01"/><path d="M8 16h.01"/><path d="M8 8h.01"/><path d="M16 16h.01"/></svg>
          </span>
          <span class="type-name">Dado</span>
        </label>

        <label class="component-type-modal__item">
          <input type="radio" name="type">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          </span>
          <span class="type-name">Documento</span>
        </label>

        <label class="component-type-modal__item">
          <input type="radio" name="type">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
          </span>
          <span class="type-name">Carta / Ficha</span>
        </label>

        <label class="component-type-modal__item">
          <input type="radio" name="type">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          </span>
          <span class="type-name">Mazo</span>
        </label>

      </div>
    </div>
    <div class="modal__footer">
      <button class="btn-cancel">Cancelar</button>
      <button class="btn-accept">Aceptar</button>
    </div>
  </div>
</div>
</body>
</html>
