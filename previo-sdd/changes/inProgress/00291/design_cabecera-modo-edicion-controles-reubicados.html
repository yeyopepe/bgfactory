<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mockup — Importar/Exportar en la fila de controles (modo edición)</title>
<style>
  :root {
    --bg-toolbar: #333333;
    --accent-blue: #2c7dd8;
    --text-light: #ffffff;
    --gray-800: #3a3a3a;
    --text-lg: 1.5rem;
    --text-md: 1.125rem;
    --text-sm: 0.875rem;
    --radius-sm: 4px;
    --toolbar-hover: rgba(255, 255, 255, 0.1);
    --toolbar-divider: rgba(255, 255, 255, 0.2);
  }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #c2c2c2;
  }
  h1 {
    margin: 0;
    padding: 0.75rem 1rem;
    font-size: var(--text-lg);
    color: var(--text-light);
    min-height: 3.5rem;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background-image:
      repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 8px),
      linear-gradient(180deg, var(--gray-800), var(--bg-toolbar));
  }
  .app-title__block {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    line-height: 1.2;
  }
  .app-title__mode-indicator {
    font-size: var(--text-md);
    font-weight: 600;
    color: var(--accent-blue);
    letter-spacing: 0.02em;
    line-height: 1;
  }
  #mode-switcher {
    position: fixed;
    top: 0.5rem;
    right: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  #mode-switcher button {
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: var(--text-sm);
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    border: none;
  }
  #mode-switcher .file-btn {
    color: var(--text-light);
    background: none;
    border: 1px solid var(--text-light);
  }
  #mode-switcher .file-btn:hover {
    background: var(--toolbar-hover);
  }
  #mode-switcher .mode-switcher__mode-btn {
    background: var(--accent-blue);
    color: var(--text-light);
  }
  #mode-switcher .mode-switcher__fit-btn,
  #mode-switcher .mode-switcher__settings-btn {
    padding: 0;
    width: 36px;
    height: 36px;
    justify-content: center;
  }
  #mode-switcher .mode-switcher__fit-btn {
    background: var(--accent-blue);
    color: var(--text-light);
  }
  #mode-switcher .mode-switcher__settings-btn {
    background: none;
    color: var(--text-light);
    border: 1px solid var(--text-light);
  }
  .toolbar-divider {
    width: 1px;
    height: 1.5rem;
    background: var(--toolbar-divider);
  }
  .icon-frame {
    width: 16px;
    height: 16px;
    display: block;
  }
</style>
</head>
<body>
  <h1>
    <div class="app-title__block">
      <div>Mi Juego de Mesa — v.00337</div>
      <span class="app-title__mode-indicator">Modo Edición</span>
    </div>
  </h1>

  <div id="mode-switcher">
    <button type="button" class="file-btn">
      <svg class="icon-frame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Importar</span>
    </button>
    <button type="button" class="file-btn">
      <svg class="icon-frame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Exportar</span>
      <svg class="icon-frame" style="width:10px;height:10px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>

    <div class="toolbar-divider"></div>

    <button type="button" class="mode-switcher__mode-btn">
      <svg class="icon-frame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Ir al Modo Juego</span>
    </button>
    <button type="button" class="mode-switcher__fit-btn">
      <svg class="icon-frame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </button>
    <button type="button" class="mode-switcher__settings-btn">
      <svg class="icon-frame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
</body>
</html>
