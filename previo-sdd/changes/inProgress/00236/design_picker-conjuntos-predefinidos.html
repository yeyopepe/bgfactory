<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup 00236 — Picker de componentes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #12122a;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}

/* App shell hint */
.app-bg {
  position: fixed; inset: 0;
  background: #15152c;
}
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
}

/* Modal */
.modal {
  background: #222238;
  border-radius: 14px;
  padding: 26px 26px 28px;
  width: 510px;
  box-shadow: 0 28px 90px rgba(0,0,0,0.7);
  border: 1px solid #36365c;
  position: relative;
  z-index: 10;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 22px;
}
.modal-title {
  color: #dde0f8;
  font-size: 15.5px;
  font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.modal-close {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #333355;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #7070a0; font-size: 13px;
}

/* Section labels */
.section-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: #606090; margin-bottom: 10px;
}

/* Component grid */
.comp-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}
.comp-btn {
  background: #2c2c4c;
  border-radius: 8px;
  padding: 13px 6px 11px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: background 0.12s;
}
.comp-btn:hover { background: #383860; border-color: #5050a0; }
.comp-btn .ci { width: 24px; height: 24px; display:flex; align-items:center; justify-content:center; }
.comp-btn .cl { color: #a8a8cc; font-size: 10.5px; text-align: center; line-height: 1.3; }

/* Divider */
.divider {
  display: flex; align-items: center; gap: 10px;
  margin: 18px 0 14px;
}
.divider-line { flex: 1; height: 1px; background: #32325a; }
.divider-text { color: #48489a; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; }

/* Preset section */
.preset-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: #6888d0;
  margin-bottom: 11px;
  display: flex; align-items: center; gap: 6px;
}
.preset-label-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #6888d0;
  flex-shrink: 0;
}

/* Preset button */
.preset-btn {
  background: linear-gradient(135deg, #272f60 0%, #202048 100%);
  border: 1.5px solid #3f55a8;
  border-radius: 10px;
  padding: 15px 16px 14px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
  position: relative; overflow: hidden;
}
.preset-btn::after {
  content: '';
  position: absolute; top: -30px; right: -30px;
  width: 100px; height: 100px;
  background: radial-gradient(circle, rgba(90,130,255,0.10) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.preset-btn-icon { flex-shrink: 0; }
.preset-btn-info { flex: 1; }
.preset-btn-name {
  color: #a0b8ff;
  font-size: 13px; font-weight: 600;
  margin-bottom: 7px; line-height: 1.3;
}
.preset-btn-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag {
  background: rgba(55,80,200,0.22);
  color: #7090d8;
  font-size: 9px; border-radius: 4px;
  padding: 2px 7px;
  border: 1px solid rgba(70,100,220,0.18);
}
.preset-btn-arrow {
  color: #4858a8; font-size: 18px;
  flex-shrink: 0; font-weight: 300;
}
</style>
</head>
<body>
<div class="app-bg"></div>
<div class="overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <circle cx="8.5" cy="8.5" r="7.5" stroke="#7070c0" stroke-width="1.4"/>
          <line x1="8.5" y1="5" x2="8.5" y2="12" stroke="#7070c0" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="5" y1="8.5" x2="12" y2="8.5" stroke="#7070c0" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Añadir componente
      </div>
      <div class="modal-close">✕</div>
    </div>

    <div class="section-label">Componentes</div>
    <div class="comp-grid">

      <div class="comp-btn">
        <span class="ci"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="3" y="4" width="16" height="14" rx="2" fill="none" stroke="#8888c0" stroke-width="1.4"/><line x1="6" y1="8" x2="16" y2="8" stroke="#8888c0" stroke-width="1.2"/><line x1="6" y1="11" x2="14" y2="11" stroke="#8888c0" stroke-width="1.2"/><line x1="6" y1="14" x2="12" y2="14" stroke="#8888c0" stroke-width="1.2"/></svg></span>
        <span class="cl">Texto</span>
      </div>

      <div class="comp-btn">
        <span class="ci"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="2" y="2" width="18" height="18" rx="2" fill="#5a6aaa" opacity="0.75"/><rect x="2" y="2" width="18" height="18" rx="2" fill="none" stroke="#7888c8" stroke-width="1"/></svg></span>
        <span class="cl">Tablero simple</span>
      </div>

      <div class="comp-btn">
        <span class="ci"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="2" y="2" width="18" height="18" rx="2" fill="#5a6aaa" opacity="0.30"/><rect x="2" y="2" width="18" height="18" rx="2" fill="none" stroke="#7888c8" stroke-width="1"/><line x1="2" y1="9" x2="20" y2="9" stroke="#7888c8" stroke-width="0.8" opacity="0.7"/><line x1="2" y1="15" x2="20" y2="15" stroke="#7888c8" stroke-width="0.8" opacity="0.7"/><line x1="8" y1="2" x2="8" y2="20" stroke="#7888c8" stroke-width="0.8" opacity="0.7"/><line x1="14" y1="2" x2="14" y2="20" stroke="#7888c8" stroke-width="0.8" opacity="0.7"/></svg></span>
        <span class="cl">Tablero person.</span>
      </div>

      <div class="comp-btn">
        <span class="ci"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="3" y="3" width="16" height="16" rx="3" fill="#7070c0" opacity="0.6"/><circle cx="7.5" cy="7.5" r="1.3" fill="white"/><circle cx="14.5" cy="7.5" r="1.3" fill="white"/><circle cx="11" cy="11" r="1.3" fill="white"/><circle cx="7.5" cy="14.5" r="1.3" fill="white"/><circle cx="14.5" cy="14.5" r="1.3" fill="white"/></svg></span>
        <span class="cl">Dado</span>
      </div>

      <div class="comp-btn">
        <span class="ci"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="4" y="2" width="14" height="18" rx="2" fill="white" stroke="#8888b8" stroke-width="1.2"/><line x1="7" y1="7" x2="15" y2="7" stroke="#8888b8" stroke-width="1"/><line x1="7" y1="10" x2="15" y2="10" stroke="#8888b8" stroke-width="1"/><line x1="7" y1="13" x2="12" y2="13" stroke="#8888b8" stroke-width="1"/></svg></span>
        <span class="cl">Documento</span>
      </div>

      <div class="comp-btn">
        <span class="ci"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="4" y="2" width="14" height="19" rx="2.5" fill="white" stroke="#c0c0d8" stroke-width="1"/><text x="11" y="14" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#c00" font-weight="bold">A</text><text x="11" y="20" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#c00">♥</text></svg></span>
        <span class="cl">Carta / Ficha</span>
      </div>

      <div class="comp-btn">
        <span class="ci"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="7" y="5" width="12" height="16" rx="2" fill="#d0d0e8" stroke="#a0a0c8" stroke-width="0.8"/><rect x="4" y="3" width="12" height="16" rx="2" fill="#e0e0f4" stroke="#b0b0d0" stroke-width="0.8"/><rect x="1" y="1" width="12" height="16" rx="2" fill="white" stroke="#c0c0da" stroke-width="1"/></svg></span>
        <span class="cl">Mazo</span>
      </div>

    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">o elige un conjunto completo</span>
      <div class="divider-line"></div>
    </div>

    <div class="preset-label">
      <div class="preset-label-dot"></div>
      Conjuntos pre-definidos
    </div>

    <div class="preset-btn">
      <div class="preset-btn-icon">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <!-- Back card -->
          <rect x="10" y="7" width="24" height="32" rx="3" fill="#1e4a8a"/>
          <rect x="12" y="9" width="20" height="28" rx="2" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
          <!-- Middle card -->
          <rect x="7" y="4" width="24" height="32" rx="3" fill="#2a5599" stroke="#3a66bb" stroke-width="0.5"/>
          <!-- Front card (face) -->
          <rect x="4" y="1" width="24" height="32" rx="3" fill="white" stroke="#c0c8e8" stroke-width="0.8"/>
          <text x="8" y="12" font-family="Georgia,serif" font-size="7" fill="#1a1a1a" font-weight="bold">A</text>
          <text x="8" y="20" font-family="Georgia,serif" font-size="10" fill="#1a1a1a">♠</text>
          <text x="16" y="25" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#1a1a1a">♠</text>
        </svg>
      </div>
      <div class="preset-btn-info">
        <div class="preset-btn-name">Baraja francesa estándar (54 cartas)</div>
        <div class="preset-btn-tags">
          <span class="tag">52 cartas · 2 jokers</span>
          <span class="tag">1 mazo</span>
          <span class="tag">55 recursos SVG</span>
        </div>
      </div>
      <div class="preset-btn-arrow">›</div>
    </div>

  </div>
</div>
</body>
</html>
