<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup 00236 — Picker menú (estilo real)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* App CSS tokens */
:root {
  --bg-toolbar: #333333;
  --bg-card: #f5f5f5;
  --bg-table: #c2c2c2;
  --accent-blue: #2c7dd8;
  --accent-blue-light: #e8f0fc;
  --text-primary: #1a1a1a;
  --text-muted: #666666;
  --border-neutral: #dcdcdc;
  --radius-sm: 4px;
  --radius-lg: 8px;
  --shadow-1: 0 2px 6px rgba(0,0,0,0.15);
  --shadow-2: 0 4px 20px rgba(0,0,0,0.28);
}

body {
  background: var(--bg-table);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 0.875rem;
}

/* App header hint (top bar) */
.app-header-hint {
  position: fixed; top: 0; left: 0; right: 0;
  height: 38px;
  background: linear-gradient(to bottom, #3a3a3a, var(--bg-toolbar));
  z-index: 0;
}

/* Modal overlay */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
}

/* Modal shell */
.modal {
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-2);
  width: 440px;
  max-width: 90vw;
  max-height: 80vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Modal header */
.modal__header {
  background: var(--bg-toolbar);
  color: white;
  padding: 0.875rem 1rem;
  font-size: 0.875rem;
  font-weight: 600;
  flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
}
.modal__header svg { opacity: 0.7; }

/* Modal body */
.modal__content {
  padding: 1rem;
  overflow-y: auto;
  flex: 1;
}

/* Section label above list */
.section-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

/* Vertical list of type items */
.component-type-modal__list {
  display: flex; flex-direction: column;
  gap: 0.375rem;
}

/* Each item: label with radio + icon + text */
.component-type-modal__item {
  display: flex; align-items: center; gap: 0.625rem;
  padding: 0.5rem 0.625rem;
  border: 1px solid var(--border-neutral);
  border-radius: var(--radius-sm);
  cursor: pointer;
  background: white;
  transition: border-color 0.1s, background 0.1s;
}
.component-type-modal__item:hover {
  border-color: #a0bce8;
  background: #f8fafe;
}
.component-type-modal__item input[type="radio"] {
  accent-color: var(--accent-blue);
  flex-shrink: 0;
}
.component-type-modal__icon {
  color: var(--text-muted);
  flex-shrink: 0;
  display: flex; align-items: center;
}
.component-type-modal__item:has(input:checked) {
  border-color: var(--accent-blue);
  background: #f0f6fe;
}
.component-type-modal__item:has(input:checked) .component-type-modal__icon {
  color: var(--accent-blue);
}
.item-text { color: var(--text-primary); line-height: 1.3; }

/* Separator */
.separator {
  display: flex; align-items: center; gap: 0.75rem;
  margin: 1rem 0 0.75rem;
}
.separator-line { flex: 1; height: 1px; background: var(--border-neutral); }
.separator-text {
  color: var(--text-muted); font-size: 0.7rem;
  white-space: nowrap; font-weight: 500;
}

/* Preset section label */
.preset-section-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--accent-blue);
  margin-bottom: 0.5rem;
  display: flex; align-items: center; gap: 5px;
}
.preset-section-label::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--accent-blue);
  border-radius: 50%;
}

/* Preset item — more prominent than regular items */
.component-type-modal__item--preset {
  background: var(--accent-blue-light);
  border: 1.5px solid var(--accent-blue);
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
  padding: 0.625rem 0.75rem;
}
.component-type-modal__item--preset:hover {
  background: #deeafb;
  border-color: #1d6dc2;
}
.preset-item-main {
  display: flex; align-items: center; gap: 0.625rem;
  width: 100%;
}
.preset-item-sub {
  font-size: 0.72rem;
  color: #4a6f9e;
  margin-top: 3px;
  padding-left: calc(16px + 22px + 0.625rem); /* radio + icon + gap */
  display: flex; gap: 6px;
}
.preset-tag {
  background: rgba(44,125,216,0.12);
  color: #2c7dd8;
  border: 1px solid rgba(44,125,216,0.2);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 0.68rem;
}
.component-type-modal__item--preset .component-type-modal__icon {
  color: var(--accent-blue);
}

/* Modal footer */
.modal__footer {
  border-top: 1px solid var(--border-neutral);
  padding: 0.75rem 1rem;
  display: flex; justify-content: flex-end; gap: 0.5rem;
  flex-shrink: 0;
  background: var(--bg-card);
}
.btn-cancel {
  padding: 0.4rem 1rem;
  border: 1px solid var(--border-neutral);
  border-radius: var(--radius-sm);
  background: white;
  color: var(--text-primary);
  font-size: 0.8rem; cursor: pointer;
}
.btn-accept {
  padding: 0.4rem 1rem;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--accent-blue);
  color: white;
  font-size: 0.8rem; font-weight: 600; cursor: pointer;
}
.btn-accept:disabled { background: #a0bce8; cursor: default; }
</style>
</head>
<body>

<div class="app-header-hint"></div>

<div class="modal-overlay">
  <div class="modal">

    <!-- Header -->
    <div class="modal__header">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="7" stroke="white" stroke-width="1.5"/>
        <line x1="8" y1="4.5" x2="8" y2="11.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="4.5" y1="8" x2="11.5" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Añadir componente
    </div>

    <!-- Content -->
    <div class="modal__content">

      <div class="section-label">Componentes</div>

      <div class="component-type-modal__list">

        <!-- Texto -->
        <label class="component-type-modal__item">
          <input type="radio" name="ct" value="texto">
          <span class="component-type-modal__icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <rect x="3" y="4" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/>
              <line x1="6" y1="8" x2="16" y2="8" stroke="currentColor" stroke-width="1.2"/>
              <line x1="6" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="1.2"/>
              <line x1="6" y1="14" x2="11" y2="14" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </span>
          <span class="item-text">Texto</span>
        </label>

        <!-- Tablero simple -->
        <label class="component-type-modal__item">
          <input type="radio" name="ct" value="tableroSimple">
          <span class="component-type-modal__icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <rect x="2" y="2" width="18" height="18" rx="2" fill="currentColor" opacity="0.18"/>
              <rect x="2" y="2" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </span>
          <span class="item-text">Tablero simple</span>
        </label>

        <!-- Tablero personalizado -->
        <label class="component-type-modal__item">
          <input type="radio" name="ct" value="tableroPersonalizado">
          <span class="component-type-modal__icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <rect x="2" y="2" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.4"/>
              <line x1="2" y1="9" x2="20" y2="9" stroke="currentColor" stroke-width="0.9"/>
              <line x1="2" y1="15" x2="20" y2="15" stroke="currentColor" stroke-width="0.9"/>
              <line x1="8" y1="2" x2="8" y2="20" stroke="currentColor" stroke-width="0.9"/>
              <line x1="14" y1="2" x2="14" y2="20" stroke="currentColor" stroke-width="0.9"/>
            </svg>
          </span>
          <span class="item-text">Tablero personalizado</span>
        </label>

        <!-- Dado -->
        <label class="component-type-modal__item">
          <input type="radio" name="ct" value="dado">
          <span class="component-type-modal__icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <rect x="2.5" y="2.5" width="17" height="17" rx="3" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="7" cy="7" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="7" r="1.5" fill="currentColor"/>
              <circle cx="11" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="7" cy="15" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="15" r="1.5" fill="currentColor"/>
            </svg>
          </span>
          <span class="item-text">Dado</span>
        </label>

        <!-- Documento -->
        <label class="component-type-modal__item">
          <input type="radio" name="ct" value="documento">
          <span class="component-type-modal__icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <path d="M5 3h8l4 4v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4"/>
              <polyline points="13,3 13,7 17,7" stroke="currentColor" stroke-width="1.2"/>
              <line x1="7" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="1"/>
              <line x1="7" y1="13" x2="15" y2="13" stroke="currentColor" stroke-width="1"/>
            </svg>
          </span>
          <span class="item-text">Documento</span>
        </label>

        <!-- Carta / Ficha -->
        <label class="component-type-modal__item">
          <input type="radio" name="ct" value="carta">
          <span class="component-type-modal__icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <rect x="4" y="2" width="14" height="19" rx="2" stroke="currentColor" stroke-width="1.4"/>
              <text x="11" y="13" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="currentColor" font-weight="bold">A</text>
              <text x="11" y="19" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="currentColor">♠</text>
            </svg>
          </span>
          <span class="item-text">Carta / Ficha</span>
        </label>

        <!-- Mazo -->
        <label class="component-type-modal__item">
          <input type="radio" name="ct" value="mazo">
          <span class="component-type-modal__icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <rect x="6" y="5" width="12" height="16" rx="1.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
              <rect x="4" y="3" width="12" height="16" rx="1.5" stroke="currentColor" stroke-width="1" opacity="0.7"/>
              <rect x="2" y="1" width="12" height="16" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </span>
          <span class="item-text">Mazo</span>
        </label>

      </div>

      <!-- Separator -->
      <div class="separator">
        <div class="separator-line"></div>
        <span class="separator-text">o elige un conjunto completo</span>
        <div class="separator-line"></div>
      </div>

      <div class="preset-section-label">Conjuntos pre-definidos</div>

      <div class="component-type-modal__list">

        <!-- Baraja francesa — preset item, shown selected -->
        <label class="component-type-modal__item component-type-modal__item--preset">
          <div class="preset-item-main">
            <input type="radio" name="ct" value="baraja-francesa" checked>
            <span class="component-type-modal__icon">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <!-- Card stack -->
                <rect x="7" y="5" width="12" height="16" rx="1.5" fill="var(--accent-blue-light)" stroke="var(--accent-blue)" stroke-width="0.8" opacity="0.6"/>
                <rect x="4" y="3" width="12" height="16" rx="1.5" fill="var(--accent-blue-light)" stroke="var(--accent-blue)" stroke-width="0.8" opacity="0.8"/>
                <rect x="1" y="1" width="12" height="16" rx="1.5" fill="white" stroke="var(--accent-blue)" stroke-width="1.2"/>
                <text x="7" y="10" text-anchor="middle" font-family="Georgia,serif" font-size="6" fill="var(--accent-blue)" font-weight="bold">A</text>
                <text x="7" y="15" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="var(--accent-blue)">♠</text>
              </svg>
            </span>
            <span class="item-text" style="font-weight:600; color: #1a3a6a;">Baraja francesa estándar (54 cartas)</span>
          </div>
          <div class="preset-item-sub">
            <span class="preset-tag">52 cartas</span>
            <span class="preset-tag">2 jokers</span>
            <span class="preset-tag">1 mazo</span>
            <span class="preset-tag">55 recursos SVG</span>
          </div>
        </label>

      </div>

    </div><!-- /.modal__content -->

    <!-- Footer -->
    <div class="modal__footer">
      <button class="btn-cancel">Cancelar</button>
      <button class="btn-accept">Crear conjunto</button>
    </div>

  </div>
</div>

</body>
</html>
