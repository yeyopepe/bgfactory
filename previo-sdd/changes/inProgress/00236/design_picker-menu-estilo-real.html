<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup 00236 — Picker menú (estilo real)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ─────────────────────────────────────────────────────────────
   Tokens reales de la app (src/styles/main.css)
   ───────────────────────────────────────────────────────────── */
:root {
  --bg-table: #c2c2c2;
  --bg-toolbar: #333333;
  --bg-card: #f5f5f5;
  --accent-blue: #2c7dd8;
  --accent-blue-dark: #123a66;
  --accent-blue-light: #eaf3fc;
  --text-primary: #1a1a1a;
  --text-light: #ffffff;
  --text-muted: #666666;
  --error: #d32f2f;
  --border-neutral: #dcdcdc;
  --bg-subtle: #f0f0f0;
  --bg-hover: #e8e8e8;
  --radius-sm: 4px;
  --radius-lg: 8px;
  --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
  --transition-fast: 150ms ease;
}

body {
  background: var(--bg-table);
  min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 0.875rem;
  color: var(--text-primary);
}

/* Pista del fondo de la app: barra de herramientas superior */
.app-toolbar-hint {
  position: fixed; top: 0; left: 0; right: 0;
  height: 40px;
  background: var(--bg-toolbar);
  z-index: 0;
}

/* ─────────────────────────────────────────────────────────────
   Overlay + shell de la modal (idénticos al CSS real)
   ───────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}

.modal {
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-2);
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  display: flex; flex-direction: column;
}

.modal__header {
  padding: 1rem;
  border-bottom: 1px solid var(--border-neutral);
}
.modal__header-title {
  margin: 0;
  font-size: 1.125rem;
  color: var(--text-primary);
}

.modal__content {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
}

.modal__footer {
  padding: 1rem;
  border-top: 1px solid var(--border-neutral);
  display: flex; gap: 0.5rem; justify-content: flex-end;
}

.btn-cancel, .btn-accept {
  padding: 0.5rem 1.5rem;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.875rem;
  transition: background var(--transition-fast), opacity var(--transition-fast);
}
.btn-cancel { background: var(--bg-subtle); color: var(--text-primary); }
.btn-cancel:hover { background: var(--bg-hover); }
.btn-accept { background: var(--accent-blue); color: var(--text-light); }
.btn-accept:hover { opacity: 0.9; }

/* ─────────────────────────────────────────────────────────────
   Rótulo de sección (NUEVO en 00236: separa "Componentes" de
   "Conjuntos pre-definidos")
   ───────────────────────────────────────────────────────────── */
.section-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 0.625rem;
}

/* ─────────────────────────────────────────────────────────────
   Lista de tipos individuales (idéntica al picker real)
   ───────────────────────────────────────────────────────────── */
.component-type-modal__list {
  display: flex; flex-direction: column;
  gap: 0.5rem;
}

.component-type-modal__item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem;
  border: 1px solid var(--border-neutral);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.875rem;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.component-type-modal__item:hover {
  border-color: var(--accent-blue);
  box-shadow: 0 2px 6px rgba(44, 125, 216, 0.15);
}
.component-type-modal__item input[type="radio"] {
  accent-color: var(--accent-blue);
  flex-shrink: 0;
}

.component-type-modal__icon {
  flex-shrink: 0;
  width: 22px; height: 22px;
  color: var(--text-muted);
  transition: color var(--transition-fast);
}
.component-type-modal__icon svg { display: block; width: 100%; height: 100%; }

.component-type-modal__item:hover .component-type-modal__icon,
.component-type-modal__item:has(input:checked) .component-type-modal__icon {
  color: var(--accent-blue);
}

/* ─────────────────────────────────────────────────────────────
   Separador "o elige un conjunto completo"
   ───────────────────────────────────────────────────────────── */
.set-separator {
  display: flex; align-items: center; gap: 0.75rem;
  margin: 1.25rem 0 1rem;
}
.set-separator__line { flex: 1; height: 1px; background: var(--border-neutral); }
.set-separator__text {
  font-size: 0.7rem;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ─────────────────────────────────────────────────────────────
   Rótulo "Conjuntos pre-definidos" (NUEVO en 00236)
   ───────────────────────────────────────────────────────────── */
.preset-section-label {
  display: flex; align-items: center; gap: 0.4rem;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-blue);
  margin-bottom: 0.625rem;
}
.preset-section-label::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent-blue);
  flex-shrink: 0;
}

/* ─────────────────────────────────────────────────────────────
   Item de conjunto pre-definido: ACCIÓN INMEDIATA (sin radio).
   Clic en la fila = crea la baraja y cierra el modal.
   ───────────────────────────────────────────────────────────── */
.preset-item {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.75rem 0.875rem;
  background: var(--accent-blue-light);
  border: 1.5px solid var(--accent-blue);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
}
.preset-item:hover {
  background: #deeafb;
  border-color: var(--accent-blue-dark);
}

.preset-item__icon {
  flex-shrink: 0;
  width: 30px; height: 34px;
  color: var(--accent-blue);
}
.preset-item__icon svg { display: block; width: 100%; height: 100%; }

.preset-item__body { flex: 1; min-width: 0; }

.preset-item__title {
  font-weight: 700;
  color: var(--accent-blue-dark);
  line-height: 1.25;
  margin-bottom: 0.375rem;
}

.preset-item__tags {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.preset-tag {
  font-size: 0.68rem;
  color: var(--accent-blue);
  background: rgba(44, 125, 216, 0.12);
  border: 1px solid rgba(44, 125, 216, 0.2);
  border-radius: 3px;
  padding: 1px 6px;
}

/* Chevron de "ejecuta una acción / avanza" (no es un desplegable) */
.preset-item__go {
  flex-shrink: 0;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--accent-blue);
  opacity: 0.55;
  padding-right: 0.125rem;
}
</style>
</head>
<body>

<!-- Pista del chrome de la app detrás del overlay -->
<div class="app-toolbar-hint"></div>

<div class="modal-overlay">
  <div class="modal">

    <!-- ══ Cabecera real: sin fondo oscuro, sin icono ══ -->
    <div class="modal__header">
      <h2 class="modal__header-title">Añadir componente</h2>
    </div>

    <div class="modal__content">

      <!-- ══ Sección 1: tipos de componente individuales (picker actual) ══ -->
      <div class="section-label">Componentes</div>

      <div class="component-type-modal__list">

        <!-- Cuadro de texto -->
        <label class="component-type-modal__item">
          <input type="radio" name="component-type" value="texto" checked>
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16"/><path d="M4 10h16"/><path d="M4 14h16"/><path d="M4 18h9"/>
            </svg>
          </span>
          <span>Cuadro de texto</span>
        </label>

        <!-- Tablero simple -->
        <label class="component-type-modal__item">
          <input type="radio" name="component-type" value="tableroSimple">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="1.5"/>
              <path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/><path d="M3 15h18"/>
            </svg>
          </span>
          <span>Tablero simple</span>
        </label>

        <!-- Tablero personalizado -->
        <label class="component-type-modal__item">
          <input type="radio" name="component-type" value="tableroPersonalizado">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3h11v6"/><path d="M3 9h9"/><path d="M3 15h7"/><path d="M3 3v18h9"/><path d="M9 15v6"/>
              <path d="M18.5 12.5l3 3L16 21l-3 .5.5-3z"/>
            </svg>
          </span>
          <span>Tablero personalizado</span>
        </label>

        <!-- Dado Configurable -->
        <label class="component-type-modal__item">
          <input type="radio" name="component-type" value="dado">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="16" cy="8" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="8" cy="16" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="16" cy="16" r="1.1" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span>Dado Configurable</span>
        </label>

        <!-- Visor de documentos -->
        <label class="component-type-modal__item">
          <input type="radio" name="component-type" value="documento">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
              <path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/>
            </svg>
          </span>
          <span>Visor de documentos</span>
        </label>

        <!-- Carta/Ficha -->
        <label class="component-type-modal__item">
          <input type="radio" name="component-type" value="carta">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="2.5" width="12" height="19" rx="2.5"/>
              <path d="M9 7h6"/><path d="M9 11h4"/>
            </svg>
          </span>
          <span>Carta/Ficha</span>
        </label>

        <!-- Mazo -->
        <label class="component-type-modal__item">
          <input type="radio" name="component-type" value="mazo">
          <span class="component-type-modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="6" width="11" height="15" rx="2"/>
              <path d="M5.5 17.5V5.5a2 2 0 0 1 2-2H15"/>
            </svg>
          </span>
          <span>Mazo</span>
        </label>

      </div>

      <!-- ══ Separador entre secciones ══ -->
      <div class="set-separator">
        <span class="set-separator__line"></span>
        <span class="set-separator__text">o elige un conjunto completo</span>
        <span class="set-separator__line"></span>
      </div>

      <!-- ══ Sección 2: conjuntos pre-definidos (NUEVO en 00236) ══ -->
      <div class="preset-section-label">Conjuntos pre-definidos</div>

      <!-- Clic en esta fila = creación inmediata de la baraja + cierre del modal.
           No hay radio y NO pasa por el botón "Aceptar" del footer. -->
      <div class="preset-item" role="button" tabindex="0">
        <span class="preset-item__icon" aria-hidden="true">
          <svg viewBox="0 0 30 34" fill="none">
            <!-- Pila de cartas: tres cartas apiladas y desplazadas -->
            <rect x="9" y="6" width="17" height="24" rx="2.5" fill="#ffffff" stroke="currentColor" stroke-width="1.6"/>
            <rect x="6" y="4" width="17" height="24" rx="2.5" fill="#ffffff" stroke="currentColor" stroke-width="1.6"/>
            <rect x="3" y="2" width="17" height="24" rx="2.5" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/>
            <!-- Símbolo de palo (picas) en la carta frontal -->
            <path d="M11.5 7c1.8 1.9 3.6 3.3 3.6 5.2a1.9 1.9 0 0 1-3.1 1.5 1.9 1.9 0 0 1-3.1-1.5C8.9 10.3 10.7 8.9 12.5 7z"
                  transform="translate(-1 0)" fill="currentColor"/>
            <path d="M10.6 13.6c.2 1.4-.6 2.4-1.7 3.1h4.4c-1.1-.7-1.9-1.7-1.7-3.1z" fill="currentColor"/>
          </svg>
        </span>

        <div class="preset-item__body">
          <div class="preset-item__title">Baraja francesa estándar (54 cartas)</div>
          <div class="preset-item__tags">
            <span class="preset-tag">52 cartas</span>
            <span class="preset-tag">2 jokers</span>
            <span class="preset-tag">1 mazo</span>
            <span class="preset-tag">55 recursos SVG</span>
          </div>
        </div>

        <!-- Chevron = "ejecuta una acción / avanza", NO abre un desplegable -->
        <span class="preset-item__go" aria-hidden="true">&rsaquo;</span>
      </div>

    </div><!-- /.modal__content -->

    <!-- ══ Footer real: "Aceptar" aplica SOLO al radio marcado (componente
         individual). El conjunto pre-definido no usa este footer. ══ -->
    <div class="modal__footer">
      <button class="btn-cancel">Cancelar</button>
      <button class="btn-accept">Aceptar</button>
    </div>

  </div>
</div>

</body>
</html>
