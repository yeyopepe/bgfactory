<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maqueta — Tablero simple con patrón circular</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --text-light: #ffffff;
    --shadow-1: 0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
  }

  .caption {
    position: fixed;
    top: 1rem;
    left: 1rem;
    color: var(--text-light);
    font-size: 0.8rem;
    background: rgba(0,0,0,0.4);
    padding: 0.35rem 0.6rem;
    border-radius: 4px;
  }

  .stage {
    display: flex;
    gap: 3rem;
    align-items: flex-end;
  }

  .board-wrap {
    text-align: center;
  }

  .board-wrap p {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: #333;
  }

  /* Board component: bisel de borde de 4 colores (ver componentRenderer.js/shadeColor)
     + sombra de contacto (var(--shadow-1)), mismo lenguaje visual del resto de piezas. */
  .board {
    position: relative;
    width: 260px;
    height: 260px;
    box-shadow: var(--shadow-1);
    border-style: solid;
    border-width: 6px;
    border-top-color: #b5754a;
    border-left-color: #b5754a;
    border-bottom-color: #6e3d1e;
    border-right-color: #6e3d1e;
    background-color: #f0e6d2; /* "Color de fondo" — espacio entre círculos */
    overflow: hidden;
  }

  .board svg { position: absolute; top: 0; left: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="caption">Maqueta estática — no funcional</div>

<div class="stage">
  <div class="board-wrap">
    <div class="board" id="boardTouching"></div>
    <p>Margen = 0 (círculos tocándose) — caso por defecto</p>
  </div>
  <div class="board-wrap">
    <div class="board" id="boardMargin"></div>
    <p>Margen &gt; 0 (círculos separados)</p>
  </div>
</div>

<script>
  // Únicamente para dibujar la rejilla estática de la maqueta — sin lógica de interacción.
  function renderCircles(svgId, rows, cols, margin) {
    const size = 248; // 260 - 2*6 de borde
    const svg = document.getElementById(svgId);
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);

    const cellW = size / cols;
    const cellH = size / rows;
    const maxDiameter = Math.min(cellW, cellH) - margin;
    const radius = Math.max(0, (maxDiameter - 2) / 2); // -2 aprox. para dejar visible el grosor del borde

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cx = c * cellW + cellW / 2;
        const cy = r * cellH + cellH / 2;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', cx);
        circle.setAttribute('cy', cy);
        circle.setAttribute('r', radius);
        circle.setAttribute('fill', '#c0392b');
        circle.setAttribute('stroke', '#5b3a29');
        circle.setAttribute('stroke-width', '2');
        svg.appendChild(circle);
      }
    }
  }

  const svg1 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg1.id = 'svgTouching';
  document.getElementById('boardTouching').appendChild(svg1);
  renderCircles('svgTouching', 6, 6, 0);

  const svg2 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg2.id = 'svgMargin';
  document.getElementById('boardMargin').appendChild(svg2);
  renderCircles('svgMargin', 6, 6, 12);
</script>
</body>
</html>
