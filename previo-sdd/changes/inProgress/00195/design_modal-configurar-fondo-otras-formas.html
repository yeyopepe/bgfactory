<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maqueta — Configurar fondo, resto de formas (Cuadrada/Hexagonal)</title>
<style>
  :root {
    --bg-table:     #c2c2c2;
    --accent-blue:  #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light:   #ffffff;
    --text-muted:   #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle:    #f0f0f0;
    --radius-sm:    4px;
    --radius-lg:    8px;
    --shadow-1:     0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
    --shadow-2:     0 4px 20px rgba(0,0,0,0.15);
    --section-accent: #5b5f97;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    color: var(--text-primary);
    padding: 2.5rem;
  }

  h1 { font-size: 1.125rem; margin: 0 0 1.5rem; }

  .row {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .modal-wrap { text-align: center; }

  .modal-wrap p {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: #333;
  }

  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 320px;
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border-neutral);
  }

  .modal__header-title {
    margin: 0;
    font-size: 1rem;
    color: var(--text-primary);
  }

  .modal__content { padding: 1.1rem; }

  .modal__field { margin-bottom: 0.85rem; }

  .modal__field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .modal__field input[type="number"],
  .modal__field input[type="color"],
  .modal__field select {
    width: 100%;
    padding: 0.4rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.8rem;
  }

  .modal__field input[type="color"] { height: 34px; cursor: pointer; }
  .modal__field select { cursor: pointer; }

  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin: 0.85rem -0.35rem 0;
    padding: 0.85rem 1rem;
  }

  fieldset.modal__section > *:last-child { margin-bottom: 0; }

  legend.modal__section-title {
    padding: 0 0.4rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--section-accent);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .field-row { display: flex; gap: 0.5rem; }
  .field-row > div { flex: 1; }

  .color-with-transparent {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .color-with-transparent input[type="color"] { flex: 1; }

  .color-with-transparent label {
    margin: 0;
    font-weight: normal;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .highlight-renamed {
    outline: 2px dashed var(--accent-blue);
    outline-offset: 3px;
    border-radius: var(--radius-sm);
    position: relative;
  }

  .highlight-renamed::before {
    content: "renombrada";
    position: absolute;
    top: -0.55rem;
    right: -0.35rem;
    background: var(--accent-blue);
    color: var(--text-light);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.08rem 0.35rem;
    border-radius: var(--radius-sm);
  }

  .highlight-range {
    outline: 2px dashed var(--accent-blue);
    outline-offset: 3px;
    border-radius: var(--radius-sm);
    padding: 0.3rem;
    margin: -0.3rem -0.3rem 0.55rem;
    position: relative;
  }

  .highlight-range::before {
    content: "rango 0–20";
    position: absolute;
    top: -0.55rem;
    right: -0.15rem;
    background: var(--accent-blue);
    color: var(--text-light);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.08rem 0.35rem;
    border-radius: var(--radius-sm);
  }

  .highlight-new {
    outline: 2px dashed var(--accent-blue);
    outline-offset: 3px;
    border-radius: var(--radius-sm);
    padding: 0.3rem;
    margin: -0.3rem -0.3rem 0.55rem;
    position: relative;
  }

  .highlight-new::before {
    content: "nuevo, compartido";
    position: absolute;
    top: -0.55rem;
    right: -0.15rem;
    background: var(--accent-blue);
    color: var(--text-light);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.08rem 0.35rem;
    border-radius: var(--radius-sm);
  }

  .modal__footer {
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }

  .btn-cancel, .btn-accept {
    padding: 0.4rem 1.2rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.8rem;
  }

  .btn-cancel { background: var(--bg-subtle); color: var(--text-primary); }
  .btn-accept { background: var(--accent-blue); color: var(--text-light); }

  .caption {
    color: var(--text-light);
    font-size: 0.8rem;
    background: rgba(0,0,0,0.4);
    padding: 0.35rem 0.6rem;
    border-radius: var(--radius-sm);
    display: inline-block;
    margin-bottom: 1.5rem;
  }
</style>
</head>
<body>

<div class="caption">Maqueta estática — no funcional. Cambia la organización de secciones (Patrón/Fondo), el rango de "Grosor" y añade "Margen" (compartido con Circular) a estas tres formas.</div>
<h1>"Configurar fondo — Color y patrón": Cuadrada / Hexagonal (vértices arriba-abajo) / Hexagonal (vértices izquierda-derecha)</h1>

<div class="row" id="row"></div>

<script>
  const SHAPES = [
    { label: 'Cuadrada', selectedIndex: 0, margin: 0 },
    { label: 'Hexagonal (vértices arriba/abajo)', selectedIndex: 1, margin: 0 },
    { label: 'Hexagonal (vértices izquierda/derecha)', selectedIndex: 2, margin: 0 },
  ];

  const row = document.getElementById('row');

  SHAPES.forEach((shape) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `
      <div class="modal">
        <div class="modal__header">
          <h3 class="modal__header-title">Configurar fondo — Color y patrón</h3>
        </div>
        <div class="modal__content">

          <fieldset class="modal__section">
            <legend class="modal__section-title">Configuración</legend>
            <div class="modal__field">
              <label>Forma de casilla</label>
              <select disabled>
                <option ${shape.selectedIndex === 0 ? 'selected' : ''}>Cuadrada</option>
                <option ${shape.selectedIndex === 1 ? 'selected' : ''}>Hexagonal (vértices arriba/abajo)</option>
                <option ${shape.selectedIndex === 2 ? 'selected' : ''}>Hexagonal (vértices izquierda/derecha)</option>
                <option>Circular</option>
              </select>
            </div>
            <div class="field-row">
              <div class="modal__field">
                <label>Filas</label>
                <input type="number" value="8" disabled>
              </div>
              <div class="modal__field">
                <label>Columnas</label>
                <input type="number" value="8" disabled>
              </div>
            </div>
          </fieldset>

          <fieldset class="modal__section highlight-renamed">
            <legend class="modal__section-title">Patrón</legend>
            <div class="modal__field highlight-new">
              <label>Margen</label>
              <input type="number" value="${shape.margin}" min="0" max="50" disabled>
            </div>
            <div class="field-row highlight-range">
              <div class="modal__field" style="margin-bottom:0">
                <label>Color del patrón</label>
                <input type="color" value="#5b3a29" disabled>
              </div>
              <div class="modal__field" style="margin-bottom:0">
                <label>Grosor</label>
                <input type="number" value="2" min="0" max="20" disabled>
              </div>
            </div>
          </fieldset>

          <fieldset class="modal__section">
            <legend class="modal__section-title">Fondo</legend>
            <div class="modal__field" style="margin-bottom:0">
              <label>Color de fondo</label>
              <div class="color-with-transparent">
                <input type="color" value="#f0e6d2" disabled>
                <input type="checkbox">
                <label>Transparente</label>
              </div>
            </div>
          </fieldset>

        </div>
        <div class="modal__footer">
          <button class="btn-cancel">Cancelar</button>
          <button class="btn-accept">Aceptar</button>
        </div>
      </div>
      <p>${shape.label}</p>
    `;
    row.appendChild(wrap);
  });

  // Ejemplo del efecto de "Margen" sobre el resultado renderizado — mismo criterio
  // para Hexagonal (silueta de cada celda encogida hacia su centro), no repetido aquí
  // literalmente para no complicar la maqueta.
  const example = document.createElement('div');
  example.style.marginTop = '2.5rem';
  example.innerHTML = `
    <h1 style="margin-bottom:1rem">Efecto de "Margen" sobre el resultado — ejemplo con Cuadrada (Hexagonal se comporta igual)</h1>
    <div class="row" style="align-items:flex-end">
      <div class="modal-wrap"><div class="board" id="sqMargin0"></div><p>Margen = 0 (aspecto actual, sin cambios)</p></div>
      <div class="modal-wrap"><div class="board" id="sqMargin1"></div><p>Margen &gt; 0 (nuevo: se ve el "Color de fondo" entre celdas)</p></div>
    </div>
  `;
  document.body.appendChild(example);

  const boardStyle = `
    position: relative; width: 180px; height: 180px; box-shadow: var(--shadow-1);
    border-style: solid; border-width: 5px;
    border-top-color: #b5754a; border-left-color: #b5754a;
    border-bottom-color: #6e3d1e; border-right-color: #6e3d1e;
    background-color: #f0e6d2; overflow: hidden;
  `;
  document.getElementById('sqMargin0').setAttribute('style', boardStyle);
  document.getElementById('sqMargin1').setAttribute('style', boardStyle);

  function renderSquares(boardId, margin) {
    const rows = 5, cols = 5, size = 170;
    const board = document.getElementById(boardId);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.style.position = 'absolute';
    svg.style.top = '0';
    svg.style.left = '0';
    board.appendChild(svg);

    const cellW = size / cols;
    const cellH = size / rows;
    const squareSize = Math.max(0, Math.min(cellW, cellH) - margin);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = c * cellW + (cellW - squareSize) / 2;
        const y = r * cellH + (cellH - squareSize) / 2;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', squareSize);
        rect.setAttribute('height', squareSize);
        rect.setAttribute('fill', 'none');
        rect.setAttribute('stroke', '#5b3a29');
        rect.setAttribute('stroke-width', '2');
        svg.appendChild(rect);
      }
    }
  }

  renderSquares('sqMargin0', 0);
  renderSquares('sqMargin1', 10);
</script>

</body>
</html>
