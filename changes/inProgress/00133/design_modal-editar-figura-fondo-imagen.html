<style>
  :root {
    --bg-table:     #c2c2c2;
    --bg-toolbar:   #333333;
    --bg-card:      #f5f5f5;
    --accent-blue:  #2c7dd8;
    --accent-blue-dark: #123a66;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light:   #ffffff;
    --text-muted:   #666666;
    --error:        #d32f2f;
    --success:      #2e7d32;
    --border-neutral: #dcdcdc;
    --bg-subtle:    #f0f0f0;
    --bg-hover:     #e8e8e8;
    --radius-sm:    4px;
    --radius-lg:    8px;
    --shadow-1:     0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
    --shadow-2:     0 4px 20px rgba(0,0,0,0.15);
    --transition-fast: 150ms ease;
    --section-accent: #5b5f97;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal-overlay {
    position: static;
    background: rgba(0, 0, 0, 0.5);
    padding: 3rem;
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal {
    width: 90%;
    max-width: 500px;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }

  .modal__header {
    padding: 1rem;
    font-size: 1.125rem;
    font-weight: 500;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-neutral);
    background: #ffffff;
  }

  .modal__content {
    padding: 1rem;
    display: flex;
    flex-direction: column;
  }

  .modal__field {
    margin-bottom: 1rem;
  }

  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
  }

  .modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin-top: 1rem;
    padding: 1rem;
  }

  .modal__section-title {
    color: var(--section-accent);
    text-transform: uppercase;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0 0.35rem;
  }

  .modal__section-title--toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .modal__section--disabled {
    opacity: 0.5;
  }

  .align-group {
    display: flex;
    gap: 0.5rem;
  }

  .align-group__btn {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-subtle);
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
  }

  .align-group__btn:hover {
    background: var(--bg-hover);
  }

  .align-group__btn.active {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: var(--text-light);
  }

  .bg-type-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .bg-type-row select {
    flex: 0 1 auto;
    width: 9rem;
    padding: 0.5rem;
    font-size: 0.875rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    background: #ffffff;
    color: var(--text-primary);
    cursor: pointer;
  }

  .bg-image-preview {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
    padding: 0.5rem;
    background: #ffffff;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
  }

  .bg-image-preview__thumb {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    flex: 0 0 auto;
    background: linear-gradient(135deg, #d7c8a3 0%, #b99a63 45%, #8a6d3b 100%);
    position: relative;
  }

  .bg-image-preview__thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), transparent 55%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0 4px, transparent 4px 10px);
  }

  .bg-image-preview__name {
    font-size: 0.8125rem;
    color: var(--text-primary);
  }

  .bg-image-preview__hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.15rem;
  }

  .bg-image-buttons {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .btn-cancel {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-size: 0.875rem;
    cursor: pointer;
    transition: background var(--transition-fast);
  }

  .btn-cancel:hover { background: var(--bg-hover); }

  .btn-cancel:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .field-row {
    display: flex;
    gap: 0.5rem;
  }

  .field-row > div { flex: 1; }

  .field-row label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
  }

  .field-row input[type="color"] {
    width: 100%;
    height: 34px;
    padding: 2px;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    background: #ffffff;
    cursor: pointer;
  }

  .field-row input[type="number"] {
    width: 100%;
    padding: 0.5rem;
    font-size: 0.875rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
  }

  .modal__section-title--toggle input[type="checkbox"] {
    cursor: pointer;
  }

  .modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    background: #ffffff;
  }

  .btn-eliminar {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--error);
    color: var(--text-light);
    font-size: 0.875rem;
    cursor: pointer;
    margin-right: auto;
  }

  .btn-duplicate {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-size: 0.875rem;
    cursor: pointer;
  }

  .btn-accept {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent-blue);
    color: var(--text-light);
    font-size: 0.875rem;
    cursor: pointer;
  }

  .mockup-caption {
    position: fixed;
    top: 1rem;
    left: 1rem;
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    color: #444;
    background: #fff;
    padding: 0.4rem 0.7rem;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
</style>

<div class="mockup-caption">Maqueta estática — Modal "Editar figura", sección Fondo = Imagen (ya elegida)</div>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">Editar figura</div>

    <div class="modal__content">
      <div class="modal__field">
        <label>Tipo de figura</label>
        <div class="align-group">
          <button type="button" class="align-group__btn" title="Círculo / elipse">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="7"/></svg>
          </button>
          <button type="button" class="align-group__btn" title="Cuadrado">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="13" height="13"/></svg>
          </button>
          <button type="button" class="align-group__btn active" title="Rectángulo redondeado">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="13" height="13" rx="4"/></svg>
          </button>
        </div>
      </div>

      <fieldset class="modal__section">
        <legend class="modal__section-title">Fondo</legend>

        <div class="modal__field" style="margin-bottom: 0;">
          <label>Tipo de fondo</label>
          <div class="bg-type-row">
            <select disabled>
              <option>Color</option>
              <option selected>Imagen</option>
            </select>
          </div>
        </div>

        <div class="bg-image-preview">
          <div class="bg-image-preview__thumb"></div>
          <div>
            <div class="bg-image-preview__name">textura-madera-02.webp</div>
            <div class="bg-image-preview__hint">Recortada a la forma de la figura</div>
          </div>
        </div>

        <div class="bg-image-buttons">
          <button type="button" class="btn-cancel">Elegir imagen…</button>
          <button type="button" class="btn-cancel">Ajustar imagen…</button>
        </div>
      </fieldset>

      <fieldset class="modal__section">
        <legend class="modal__section-title modal__section-title--toggle">
          <input type="checkbox" checked>
          Borde
        </legend>
        <div class="modal__field" style="margin-bottom: 0;">
          <div class="field-row">
            <div>
              <label>Color del borde</label>
              <input type="color" value="#000000">
            </div>
            <div>
              <label>Grosor (px)</label>
              <input type="number" value="2" min="1" max="20">
            </div>
          </div>
        </div>
      </fieldset>
    </div>

    <div class="modal__footer">
      <button type="button" class="btn-eliminar">Eliminar</button>
      <button type="button" class="btn-duplicate">Duplicar</button>
      <button type="button" class="btn-cancel">Cancelar</button>
      <button type="button" class="btn-accept">Aceptar</button>
    </div>
  </div>
</div>
