<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Meeple — pestaña de configuración</title>
<style>
  :root {
    --bg-toolbar: #333333;
    --bg-card: #f5f5f5;
    --accent-blue: #2c7dd8;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --section-accent: #5b5f97;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #dedede;
    color: var(--text-primary);
    padding: 40px;
    display: flex;
    justify-content: center;
  }

  .modal {
    width: 480px;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .modal__header {
    background: var(--bg-toolbar);
    color: var(--text-light);
    padding: 16px 20px;
    font-size: 1rem;
    font-weight: 600;
  }
  .modal__tabs {
    display: flex;
    border-bottom: 1px solid var(--border-neutral);
    background: #fff;
    padding: 0 12px;
  }
  .modal__tab {
    padding: 10px 16px;
    font-size: 0.85rem;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    cursor: default;
  }
  .modal__tab--active {
    color: var(--accent-blue);
    border-bottom-color: var(--accent-blue);
    font-weight: 600;
  }

  .modal__body {
    padding: 20px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-height: 560px;
    overflow-y: auto;
  }

  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    padding: 14px 16px 16px;
    margin: 0;
  }
  fieldset.modal__section legend {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--section-accent);
    padding: 0 6px;
  }

  /* Imagen */
  .image-picker {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .image-picker__thumb {
    width: 64px;
    height: 64px;
    border-radius: var(--radius-sm);
    background: conic-gradient(from 90deg, #7fd8e8, #2c9fd8, #1c6fa8, #2c9fd8, #7fd8e8);
    border: 1px solid var(--border-neutral);
    flex-shrink: 0;
  }
  .image-picker__info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .image-picker__name {
    font-size: 0.85rem;
    color: var(--text-primary);
  }
  .btn {
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: default;
    width: fit-content;
  }
  .btn--secondary {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .btn--primary {
    background: var(--accent-blue);
    color: var(--text-light);
  }

  /* Ajuste de imagen */
  .adjust-grid {
    display: grid;
    grid-template-columns: 90px 1fr 44px;
    row-gap: 12px;
    column-gap: 10px;
    align-items: center;
  }
  .adjust-grid label {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .adjust-grid input[type="range"] {
    width: 100%;
    accent-color: var(--accent-blue);
  }
  .adjust-grid .value {
    font-size: 0.78rem;
    color: var(--text-primary);
    text-align: right;
  }

  /* Forma */
  .shape-options {
    display: flex;
    gap: 10px;
  }
  .shape-option {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-neutral);
    font-size: 0.75rem;
    color: var(--text-primary);
  }
  .shape-option--active {
    border-color: var(--accent-blue);
    background: var(--accent-blue-light);
    color: var(--accent-blue);
    font-weight: 600;
  }
  .shape-option__swatch {
    width: 30px;
    height: 30px;
    background: #9aa0a6;
  }
  .shape-option__swatch--square { border-radius: 3px; }
  .shape-option__swatch--rect { width: 24px; height: 34px; border-radius: 3px; }
  .shape-option__swatch--circle { border-radius: 50%; }

  /* Borde */
  .border-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .border-row label {
    font-size: 0.82rem;
    color: var(--text-primary);
  }
  .border-fields {
    display: flex;
    gap: 16px;
  }
  .border-fields--disabled {
    opacity: 0.45;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .field input[type="color"] {
    width: 40px;
    height: 26px;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    padding: 0;
  }
  .field input[type="number"] {
    width: 70px;
    padding: 5px 8px;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="modal">
    <div class="modal__header">Editar componente — meeple-01</div>
    <div class="modal__tabs">
      <div class="modal__tab">Generales</div>
      <div class="modal__tab modal__tab--active">Meeple</div>
      <div class="modal__tab">Grupos</div>
    </div>

    <div class="modal__body">

      <fieldset class="modal__section">
        <legend>Imagen</legend>
        <div class="image-picker">
          <div class="image-picker__thumb"></div>
          <div class="image-picker__info">
            <span class="image-picker__name">gema_azul.png</span>
            <button class="btn btn--secondary">Elegir imagen…</button>
          </div>
        </div>
      </fieldset>

      <fieldset class="modal__section">
        <legend>Ajuste de imagen</legend>
        <div class="adjust-grid">
          <label>Zoom</label>
          <input type="range" min="50" max="300" value="120" readonly>
          <span class="value">120%</span>

          <label>Posición X</label>
          <input type="range" min="0" max="100" value="50" readonly>
          <span class="value">50%</span>

          <label>Posición Y</label>
          <input type="range" min="0" max="100" value="45" readonly>
          <span class="value">45%</span>

          <label>Rotación</label>
          <input type="range" min="0" max="360" value="0" readonly>
          <span class="value">0°</span>
        </div>
      </fieldset>

      <fieldset class="modal__section">
        <legend>Forma</legend>
        <div class="shape-options">
          <div class="shape-option">
            <div class="shape-option__swatch shape-option__swatch--square"></div>
            Cuadrada
          </div>
          <div class="shape-option shape-option--active">
            <div class="shape-option__swatch shape-option__swatch--rect"></div>
            Rectangular
          </div>
          <div class="shape-option">
            <div class="shape-option__swatch shape-option__swatch--circle"></div>
            Circular
          </div>
        </div>
      </fieldset>

      <fieldset class="modal__section">
        <legend>Borde</legend>
        <div class="border-row">
          <input type="checkbox" checked readonly>
          <label>Activar borde</label>
        </div>
        <div class="border-fields">
          <div class="field">
            <label>Color</label>
            <input type="color" value="#123a66" readonly>
          </div>
          <div class="field">
            <label>Grosor (px)</label>
            <input type="number" value="4" readonly>
          </div>
        </div>
      </fieldset>

    </div>
  </div>
</body>
</html>
