<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maqueta — Bloc de notas (vista)</title>
<style>
  :root {
    --bg-table:     #c2c2c2;
    --bg-card:      #f5f5f5;
    --accent-blue:  #2c7dd8;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light:   #ffffff;
    --text-muted:   #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle:    #f0f0f0;
    --bg-hover:     #e8e8e8;
    --radius-sm:    4px;
    --radius-lg:    8px;
    --shadow-1:     0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem;
    background: var(--bg-table);
    font-family: system-ui, sans-serif;
    color: var(--text-primary);
    display: flex;
    flex-wrap: wrap;
    gap: 2.5rem;
    align-items: flex-start;
  }

  .caption {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin: 0 0 0.5rem 0;
    font-weight: 500;
  }

  .block {
    display: flex;
    flex-direction: column;
  }

  /* --- Componente Bloc de notas --- */
  .bloc-notas {
    width: 220px;
    height: 180px;
    background: #ffffff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .bloc-notas__header {
    background: #fdf3c7; /* color de fondo configurable, valor de ejemplo */
    padding: 0.4rem 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .bloc-notas__color-btn {
    width: 18px;
    height: 18px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(0,0,0,0.15);
    background: linear-gradient(135deg, #fdf3c7 50%, #e0c96a 50%);
    flex-shrink: 0;
    cursor: pointer;
  }

  .bloc-notas__title {
    flex: 1;
    font-size: 0.875rem;
    font-weight: 500;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bloc-notas__copy-btn {
    width: 20px;
    height: 20px;
    border-radius: var(--radius-sm);
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .bloc-notas__copy-btn svg { width: 14px; height: 14px; }

  .bloc-notas__body {
    flex: 1;
    padding: 0.6rem 0.65rem;
    font-size: 0.8rem;
    line-height: 1.4;
    overflow: hidden;
    color: var(--text-primary);
  }

  .bloc-notas__body--empty {
    color: var(--text-muted);
    font-style: italic;
  }

  mark.color-text {
    background: none;
    color: #b3261e;
  }
  mark.color-bg {
    background: #fff3b0;
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
  }

  .bloc-notas__resize-handle {
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 12px;
    height: 12px;
    cursor: nwse-resize;
  }
  .bloc-notas__resize-handle svg { width: 100%; height: 100%; opacity: 0.35; }
</style>
</head>
<body>

  <div class="block">
    <p class="caption">Estado: con contenido</p>
    <div class="bloc-notas">
      <div class="bloc-notas__header">
        <button class="bloc-notas__color-btn" title="Color de fondo de la cabecera"></button>
        <div class="bloc-notas__title">Notas de la partida</div>
        <button class="bloc-notas__copy-btn" title="Copiar contenido al portapapeles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="1.5"></rect>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
          </svg>
        </button>
      </div>
      <div class="bloc-notas__body">
        Recuerda <b>traer</b> el mazo de <i>eventos</i> y el <u>track</u> de turnos.
        El <span class="color-text">jugador inicial</span> reparte las cartas y
        <span class="color-bg">todos revisan sus objetivos</span> antes de empezar.
      </div>
      <div class="bloc-notas__resize-handle">
        <svg viewBox="0 0 12 12"><path d="M12 0 L12 12 L0 12 Z" fill="#000"/></svg>
      </div>
    </div>
  </div>

  <div class="block">
    <p class="caption">Estado: vacío</p>
    <div class="bloc-notas">
      <div class="bloc-notas__header">
        <button class="bloc-notas__color-btn" title="Color de fondo de la cabecera" style="background: linear-gradient(135deg, #f5f5f5 50%, #dcdcdc 50%);"></button>
        <div class="bloc-notas__title" style="color: var(--text-muted); font-weight: normal;"></div>
        <button class="bloc-notas__copy-btn" title="Copiar contenido al portapapeles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="1.5"></rect>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
          </svg>
        </button>
      </div>
      <div class="bloc-notas__body bloc-notas__body--empty"></div>
      <div class="bloc-notas__resize-handle">
        <svg viewBox="0 0 12 12"><path d="M12 0 L12 12 L0 12 Z" fill="#000"/></svg>
      </div>
    </div>
  </div>

</body>
</html>
