<title>Maqueta — Configurar color de fondo</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --transition-fast: 150ms ease;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  /* Fondo de mesa decorativo, solo para dar contexto a la maqueta */
  .table-hint {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(0,0,0,0.09) 1px, transparent 1px);
    background-size: 22px 22px;
    z-index: 0;
  }

  .modal-overlay {
    position: relative;
    z-index: 1;
    background: rgba(0,0,0,0.5);
    width: 100%;
    min-height: calc(100vh - 4rem);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-lg);
  }

  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    max-width: 420px;
    width: 90%;
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
    font-weight: 600;
  }

  .modal__content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
  }

  .modal__field {
    margin-bottom: 0;
  }

  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .color-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .color-row input[type="color"] {
    height: 40px;
    width: 64px;
    padding: 0.25rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }

  .color-row input[type="color"]:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .transparent-check {
    display: flex;
    align-items: center;
    gap: 0.375rem;
  }

  .transparent-check input[type="checkbox"] {
    cursor: pointer;
  }

  .transparent-check label {
    margin: 0;
    font-size: 0.875rem;
    font-weight: 400;
    cursor: pointer;
  }

  .field-hint {
    margin: 0.5rem 0 0;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .exclusivity-note {
    margin: 1rem 0 0;
    padding: 0.625rem 0.75rem;
    background: var(--bg-subtle);
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }

  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    transition: background var(--transition-fast), opacity var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }

  .btn-cancel:hover {
    background: var(--bg-hover);
  }

  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }

  .btn-accept:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(44, 125, 216, 0.35);
  }

  .caption {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 0.375rem 0.75rem;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
  }
</style>

<div class="table-hint"></div>
<div class="caption">Maqueta estática — sin funcionalidad real</div>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">Configurar color de fondo</div>

    <div class="modal__content">
      <div class="modal__field">
        <label>Color de fondo</label>
        <div class="color-row">
          <input type="color" value="#eaf3fc">
          <div class="transparent-check">
            <input type="checkbox" id="transparente">
            <label for="transparente">Transparente</label>
          </div>
        </div>
        <p class="field-hint">Con "Transparente" marcado, se deja ver lo que haya detrás en la mesa.</p>
      </div>

      <p class="exclusivity-note">Al aceptar, este color sustituye a la imagen de fondo de esta cara (si la hubiera) — la configuración de la imagen no se pierde, solo deja de mostrarse.</p>
    </div>

    <div class="modal__footer">
      <button class="btn-cancel" type="button">Cancelar</button>
      <button class="btn-accept" type="button">Aceptar</button>
    </div>
  </div>
</div>
