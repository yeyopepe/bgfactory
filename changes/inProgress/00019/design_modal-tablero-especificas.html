<title>Modal de componente — pestañas Generales/Específicas del Tablero</title>
<style>
  :root {
    --bg-card:      #f5f5f5;
    --accent-blue:  #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light:   #ffffff;
    --text-muted:   #666666;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #808080;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 0;
  }

  .modal-overlay {
    position: relative;
    background: rgba(0,0,0,0.5);
    width: 560px;
    padding: 3rem 2rem;
    border-radius: 4px;
  }

  .modal {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .modal__header {
    padding: 1rem;
    font-size: 1.125rem;
    font-weight: 500;
    border-bottom: 1px solid #eee;
  }

  .modal__tabs {
    display: flex;
    border-bottom: 1px solid #eee;
  }
  .modal__tab {
    flex: 1;
    padding: 0.5rem 1rem;
    border: none;
    background: none;
    font-size: 0.875rem;
    cursor: pointer;
    color: var(--text-muted);
  }
  .modal__tab.active {
    color: var(--accent-blue);
    border-bottom: 2px solid var(--accent-blue);
    font-weight: 500;
  }

  .modal__content { padding: 1rem; }

  .modal__field { margin-bottom: 1rem; }
  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .modal__field input[type="text"],
  .modal__field input[type="number"],
  .modal__field select {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 0.875rem;
    font-family: inherit;
  }
  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .modal__field--checkbox label { margin: 0; }

  .modal__field--row {
    display: flex;
    gap: 1rem;
  }
  .modal__field--row > div { flex: 1; }

  .field-inline {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .help-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-muted);
    color: var(--text-light);
    font-size: 0.7rem;
    cursor: help;
    flex-shrink: 0;
  }

  .btn-secondary {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    font-size: 0.875rem;
    background: #f0f0f0;
    color: var(--text-primary);
    cursor: pointer;
  }

  .modal__footer {
    padding: 1rem;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }
  .btn-cancel {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    font-size: 0.875rem;
    background: #f0f0f0;
    color: var(--text-primary);
    cursor: pointer;
  }
  .btn-accept {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    font-size: 0.875rem;
    background: var(--accent-blue);
    color: var(--text-light);
    cursor: pointer;
  }

  .caption {
    text-align: center;
    color: var(--text-light);
    font-size: 0.75rem;
    margin-top: 0.75rem;
  }
</style>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">Editar propiedades del componente</div>
    <div class="modal__tabs">
      <button class="modal__tab">Generales</button>
      <button class="modal__tab active">Específicas</button>
    </div>
    <div class="modal__content">

      <div class="modal__field">
        <label>Color del borde</label>
        <input type="text" value="#1A1A1A" style="max-width:140px" />
      </div>

      <div class="modal__field">
        <label>Grosor del borde (px)</label>
        <input type="number" value="2" min="1" max="20" style="max-width:140px" />
      </div>

      <div class="modal__field">
        <label>Tipo de fondo</label>
        <div class="field-inline">
          <select style="max-width:220px">
            <option selected>Color y patrón</option>
            <option>Imagen</option>
          </select>
          <button class="btn-secondary">Configurar fondo…</button>
        </div>
      </div>

    </div>
    <div class="modal__footer">
      <button class="btn-cancel">Cancelar</button>
      <button class="btn-accept">Aceptar</button>
    </div>
  </div>
</div>
<div class="caption">
  Pestaña "Específicas" del tablero. La pestaña "Generales" mantiene el desplegable "Tipo" (solo al crear) y el
  checkbox "Bloqueado" ya existente (cambio 00018), sin cambios adicionales.
</div>
