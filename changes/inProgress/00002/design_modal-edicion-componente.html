<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Maqueta — Modal de creación/edición de componente</title>
<style>
  :root {
    --bg-table: #808080;
    --bg-table-grid: #ffffff22;
    --bg-toolbar: #333333;
    --border-toolbar: #4a4a4a;
    --text-light: #e7ecf3;
    --text-muted: #9aa8bd;
    --accent-gray: #6b7280;
    --accent-gray-hover: #545b66;
    --card-bg: #f3f5f8;
    --card-border: #d7dee8;
    --card-text: #23303f;
    --danger: #d9534f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg-table);
    color: var(--text-light);
  }

  .table-surface {
    position: relative;
    min-height: 100vh;
    background-image:
      radial-gradient(circle, var(--bg-table-grid) 1.5px, transparent 1.5px);
    background-size: 32px 32px;
    background-position: -8px -8px;
  }

  /* Overlay semitransparente detrás del modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 20, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }

  .modal {
    width: 420px;
    max-width: calc(100vw - 2rem);
    background: var(--card-bg);
    color: var(--card-text);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.45);
  }

  .modal__header {
    padding: 1rem 1.25rem 0;
    background: var(--card-bg);
  }

  .modal__title {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    color: #1c2836;
  }

  /* Tabs de la modal: Generales / Específicas */
  .modal__tabs {
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid var(--card-border);
  }

  .modal__tab {
    border: none;
    background: none;
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .modal__tab.active {
    color: var(--accent-gray);
    border-bottom-color: var(--accent-gray);
  }

  .modal__body {
    padding: 1.25rem;
    min-height: 140px;
  }

  .modal__field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .modal__field label {
    font-size: 0.8rem;
    font-weight: 500;
    color: #445064;
  }

  .modal__field input {
    font: inherit;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    background: #fff;
    color: var(--card-text);
  }

  .modal__field input.invalid {
    border-color: var(--danger);
    outline-color: var(--danger);
  }

  .modal__error {
    font-size: 0.75rem;
    color: var(--danger);
  }

  .modal__empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 120px;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-align: center;
    border: 1px dashed var(--card-border);
    border-radius: 8px;
  }

  .modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    padding: 1rem 1.25rem;
    background: #eef1f5;
    border-top: 1px solid var(--card-border);
  }

  .modal__footer button {
    padding: 0.5rem 1.2rem;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--card-border);
    color: #445064;
  }

  .btn-cancel:hover {
    border-color: #9aa8bd;
  }

  .btn-accept {
    background: var(--accent-gray);
    border: none;
    color: #fff;
  }

  .btn-accept:hover {
    background: var(--accent-gray-hover);
  }

  .btn-accept:disabled {
    background: #c3c8cf;
    cursor: not-allowed;
  }

  .modal__hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }

  /* Segunda maqueta más abajo, para ilustrar la pestaña "Específicas" vacía */
  .example-label {
    position: absolute;
    color: var(--text-muted);
    font-size: 0.75rem;
    text-align: center;
    width: 420px;
  }
</style>
</head>
<body>
  <div class="table-surface">

    <!-- Ejemplo 1: pestaña "Generales" activa, con error de id duplicado -->
    <div class="modal-overlay" style="position: relative; min-height: 50vh; align-items: flex-start; padding-top: 3rem;">
      <div>
        <p class="example-label" style="position: static; margin-bottom: 0.5rem;">Pestaña "Generales" — id inválido (duplicado), botón Aceptar deshabilitado</p>
        <div class="modal">
          <div class="modal__header">
            <h2 class="modal__title">Editar componente</h2>
            <div class="modal__tabs">
              <button class="modal__tab active">Generales</button>
              <button class="modal__tab">Específicas</button>
            </div>
          </div>
          <div class="modal__body">
            <div class="modal__field">
              <label for="comp-id">Id</label>
              <input id="comp-id" type="text" value="cuadro-texto-001" class="invalid" />
              <span class="modal__error">Ya existe otro componente con este id.</span>
            </div>
          </div>
          <div class="modal__footer">
            <button class="btn-cancel">Cancelar</button>
            <button class="btn-accept" disabled>Aceptar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Ejemplo 2: pestaña "Específicas" activa, para el tipo "cuadro de texto" -->
    <div class="modal-overlay" style="position: relative; min-height: 50vh; align-items: flex-start; padding-top: 3rem;">
      <div>
        <p class="example-label" style="position: static; margin-bottom: 0.5rem;">Pestaña "Específicas" — tipo "cuadro de texto"</p>
        <div class="modal">
          <div class="modal__header">
            <h2 class="modal__title">Editar componente</h2>
            <div class="modal__tabs">
              <button class="modal__tab">Generales</button>
              <button class="modal__tab active">Específicas</button>
            </div>
          </div>
          <div class="modal__body" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="modal__field">
              <label for="comp-content">Contenido</label>
              <input id="comp-content" type="text" value="Errantes" />
            </div>
            <div class="modal__field">
              <label for="comp-font-size">Tamaño de fuente</label>
              <input id="comp-font-size" type="number" value="28" style="max-width: 120px;" />
              <span class="modal__hint">En píxeles.</span>
            </div>
            <div class="modal__field">
              <label for="comp-text-color">Color de texto</label>
              <input id="comp-text-color" type="color" value="#000000" style="max-width: 60px; padding: 0.2rem;" />
              <span class="modal__hint">Negro por defecto.</span>
            </div>
            <div class="modal__field">
              <label for="comp-bg-color">Color de fondo</label>
              <input id="comp-bg-color" type="color" value="#ffffff" style="max-width: 60px; padding: 0.2rem;" />
              <span class="modal__hint">Transparente por defecto (deja ver la mesa detrás).</span>
            </div>
          </div>
          <div class="modal__footer">
            <button class="btn-cancel">Cancelar</button>
            <button class="btn-accept">Aceptar</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
