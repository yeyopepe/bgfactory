<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maqueta — Barra modo edición (desplegable Exportar abierto)</title>
<style>
  :root {
    --bg-toolbar: #333333;
    --text-light: #ffffff;
    --text-primary: #1a1a1a;
    --text-muted: #666666;
    --accent-blue: #2c7dd8;
    --accent-blue-light: #eaf3fc;
    --bg-card: #f5f5f5;
    --border-neutral: #dcdcdc;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-1: 0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
    --transition-fast: 150ms ease;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #c2c2c2;
    min-height: 100vh;
  }
  .page-note {
    padding: 1rem 1.5rem;
    color: #444;
    font-size: 0.875rem;
  }
  .edit-toolbar {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg-toolbar);
    color: var(--text-light);
    padding: 0.5rem 1rem;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.5rem;
    box-shadow: var(--shadow-1);
    position: relative;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .toolbar-separator {
    width: 1px;
    align-self: stretch;
    margin: 0.25rem 0.5rem;
    background: rgba(255,255,255,0.18);
  }

  .toolbar-btn {
    color: inherit;
    background: none;
    border: 1px solid var(--text-light);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: background var(--transition-fast);
    white-space: nowrap;
  }

  .toolbar-btn:hover {
    background: rgba(255,255,255,0.1);
  }

  .toolbar-btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .toolbar-btn--icon-only {
    padding: 0.5rem;
    width: 36px;
    height: 36px;
    justify-content: center;
  }

  .toolbar-btn--dropdown svg.chevron {
    width: 12px;
    height: 12px;
    margin-left: -0.15rem;
    transition: transform var(--transition-fast);
  }

  /* Estado activo: el desplegable está abierto */
  .toolbar-btn--active {
    background: rgba(255,255,255,0.16);
  }
  .toolbar-btn--active svg.chevron {
    transform: rotate(180deg);
  }

  .toolbar-view-group {
    margin-left: 1rem;
    padding-left: 1rem;
    border-left: 1px solid rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
  }

  .table-mock {
    height: 320px;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 40%),
      #c2c2c2;
  }

  /* Desplegable, mismo lenguaje visual que .context-menu */
  .export-menu-anchor {
    position: relative;
  }

  .export-menu {
    position: absolute;
    top: calc(100% + 0.5rem);
    right: 0;
    min-width: 260px;
    background: var(--bg-card);
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-2);
    padding: 0.25rem;
    z-index: 10;
    color: var(--text-primary);
  }

  .export-menu__item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    transition: background var(--transition-fast);
  }

  .export-menu__item:hover {
    background: var(--accent-blue-light);
  }

  .export-menu__item svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--text-muted);
  }

  .export-menu__item--disabled {
    cursor: not-allowed;
    color: var(--text-muted);
  }

  .export-menu__item--disabled:hover {
    background: none;
  }

  .export-menu__item--disabled svg {
    color: var(--text-muted);
    opacity: 0.6;
  }

  .export-menu__label {
    flex: 1;
  }

  .export-menu__badge {
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--border-neutral);
    padding: 0.15rem 0.4rem;
    border-radius: var(--radius-sm);
    white-space: nowrap;
  }

  .export-menu__separator {
    height: 1px;
    background: var(--border-neutral);
    margin: 0.25rem 0.25rem;
  }
</style>
</head>
<body>
  <div class="page-note">Maqueta — barra de modo edición, desplegable "Exportar" abierto (filas "Próximamente" son ilustrativas, no funcionales)</div>

  <div class="edit-toolbar">
    <div class="toolbar-group">
      <button class="toolbar-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Salir del modo edición
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button class="toolbar-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Guardar
      </button>
      <button class="toolbar-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 9 12 4 17 9"/>
          <line x1="12" y1="4" x2="12" y2="15"/>
        </svg>
        Importar
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group export-menu-anchor">
      <button class="toolbar-btn toolbar-btn--dropdown toolbar-btn--active" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Exportar
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <div class="export-menu">
        <div class="export-menu__item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
            <line x1="9" y1="18" x2="13" y2="18"/>
          </svg>
          <span class="export-menu__label">Exportar juego (.json)</span>
        </div>

        <div class="export-menu__separator"></div>

        <div class="export-menu__item export-menu__item--disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2Z"/>
          </svg>
          <span class="export-menu__label">Exportar recursos (.zip)</span>
          <span class="export-menu__badge">Próximamente</span>
        </div>

        <div class="export-menu__item export-menu__item--disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="9" x2="9" y2="21"/>
            <line x1="15" y1="9" x2="15" y2="21"/>
          </svg>
          <span class="export-menu__label">Exportar hoja de producción (.csv)</span>
          <span class="export-menu__badge">Próximamente</span>
        </div>
      </div>
    </div>

    <div class="toolbar-view-group">
      <button class="toolbar-btn toolbar-btn--icon-only" type="button" title="Ajustar zoom" aria-label="Ajustar zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 9V5a1 1 0 0 1 1-1h4" stroke-linecap="round"/>
          <path d="M20 9V5a1 1 0 0 0-1-1h-4" stroke-linecap="round"/>
          <path d="M4 15v4a1 1 0 0 0 1 1h4" stroke-linecap="round"/>
          <path d="M20 15v4a1 1 0 0 1-1 1h-4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="table-mock"></div>
</body>
</html>
