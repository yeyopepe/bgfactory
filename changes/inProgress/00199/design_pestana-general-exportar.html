<title>Maqueta — Pestaña General con sección Exportar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: #e8e8ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #24242c;
  }

  .modal {
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    overflow: hidden;
  }

  .modal__header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid #dcdce2;
    font-weight: 600;
    font-size: 1.05rem;
  }

  .modal__tabs {
    display: flex;
    border-bottom: 1px solid #dcdce2;
    background: #f5f5f8;
  }

  .modal__tab {
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    color: #6a6a76;
    border: none;
    background: transparent;
    cursor: default;
    border-bottom: 2px solid transparent;
  }

  .modal__tab.active {
    color: #24242c;
    font-weight: 600;
    border-bottom-color: #4a63e0;
    background: #ffffff;
  }

  .modal__content {
    padding: 1.25rem;
    max-height: 70vh;
    overflow-y: auto;
  }

  .modal__field {
    margin-bottom: 0.9rem;
  }

  .modal__field label {
    display: block;
    font-size: 0.78rem;
    color: #4a4a55;
    margin-bottom: 0.3rem;
  }

  .modal__field input[type="text"],
  .modal__field input[type="number"],
  .modal__field select {
    width: 100%;
    padding: 0.4rem 0.55rem;
    font-size: 0.85rem;
    border: 1px solid #c9c9d2;
    border-radius: 4px;
    background: #fff;
    color: #24242c;
  }

  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    margin-bottom: 0.55rem;
  }

  .modal__field--checkbox label {
    margin-bottom: 0;
    font-size: 0.85rem;
    color: #24242c;
  }

  .modal__section {
    border: 1px solid #dcdce2;
    border-radius: 6px;
    padding: 0.9rem 0.9rem 0.6rem;
    margin: 0 0 1rem;
  }

  .modal__section-title {
    padding: 0 0.35rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #6a6a76;
  }

  .size-row {
    display: flex;
    gap: 0.6rem;
  }

  .size-row .modal__field {
    flex: 1;
  }

  .tag-list {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-bottom: 0.5rem;
  }

  .tag-create {
    font-size: 0.82rem;
    color: #4a63e0;
    cursor: default;
  }

  /* Sección nueva propuesta en este cambio */
  .modal__section--new {
    border-color: #b9c4f5;
    background: #f6f8ff;
    position: relative;
  }

  .new-badge {
    display: inline-block;
    margin-left: 0.5rem;
    padding: 0.08rem 0.45rem;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #ffffff;
    background: #4a63e0;
    border-radius: 999px;
    vertical-align: middle;
  }

  .export-hint {
    font-size: 0.78rem;
    color: #5a5a68;
    margin: 0 0 0.75rem;
  }

  .btn-export {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #4a63e0;
    background: #ffffff;
    border: 1.5px solid #4a63e0;
    border-radius: 5px;
    cursor: default;
  }

  .btn-export svg {
    width: 14px;
    height: 14px;
  }

  .modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    padding: 0.85rem 1.25rem;
    border-top: 1px solid #dcdce2;
    background: #f5f5f8;
  }

  .btn-cancel, .btn-accept {
    padding: 0.45rem 1rem;
    font-size: 0.85rem;
    border-radius: 5px;
    cursor: default;
  }

  .btn-cancel {
    background: #ffffff;
    border: 1px solid #c9c9d2;
    color: #4a4a55;
  }

  .btn-accept {
    background: #4a63e0;
    border: 1px solid #4a63e0;
    color: #ffffff;
    font-weight: 600;
  }
</style>

<div class="modal">
  <div class="modal__header">Propiedades — carta_heroe_01</div>

  <div class="modal__tabs">
    <button class="modal__tab active">Generales</button>
    <button class="modal__tab">Específicas</button>
    <button class="modal__tab">Copias</button>
  </div>

  <div class="modal__content">

    <div class="modal__field">
      <label>ID del componente</label>
      <input type="text" value="carta_heroe_01" readonly>
    </div>

    <fieldset class="modal__section">
      <legend class="modal__section-title">General</legend>

      <div class="modal__field">
        <label>Bloqueado</label>
        <select disabled>
          <option>Ninguno</option>
          <option selected>Solo modo juego</option>
          <option>Todos los modos</option>
        </select>
      </div>

      <div class="modal__field--checkbox">
        <input type="checkbox">
        <label>Oculto</label>
      </div>

      <div class="modal__field--checkbox">
        <input type="checkbox" checked>
        <label>Mostrar tooltip</label>
      </div>

      <div class="modal__field--checkbox">
        <input type="checkbox">
        <label>Subir al mover/interactuar</label>
      </div>
    </fieldset>

    <fieldset class="modal__section">
      <legend class="modal__section-title">Tamaño</legend>

      <div class="size-row">
        <div class="modal__field">
          <label>Alto (px)</label>
          <input type="number" value="252">
        </div>
        <div class="modal__field">
          <label>Ancho (px)</label>
          <input type="number" value="180">
        </div>
      </div>

      <div class="modal__field--checkbox">
        <input type="checkbox" checked>
        <label>Mantener proporción</label>
      </div>
    </fieldset>

    <fieldset class="modal__section">
      <legend class="modal__section-title">Etiquetas</legend>

      <div class="tag-list">
        <div class="modal__field--checkbox">
          <input type="checkbox" checked>
          <label>Personajes</label>
        </div>
        <div class="modal__field--checkbox">
          <input type="checkbox">
          <label>Prólogo</label>
        </div>
      </div>

      <div class="tag-create">+ Crear nueva etiqueta…</div>
    </fieldset>

    <fieldset class="modal__section">
      <legend class="modal__section-title">Interacciones programadas</legend>

      <div class="modal__field">
        <label>Al hacer click</label>
        <select disabled>
          <option selected>Voltear</option>
          <option>Ninguna</option>
        </select>
      </div>

      <div class="modal__field">
        <label>Click derecho</label>
        <select disabled>
          <option>Ninguno</option>
          <option selected>Abrir menú contextual</option>
        </select>
      </div>
    </fieldset>

    <fieldset class="modal__section modal__section--new">
      <legend class="modal__section-title">Exportar<span class="new-badge">Nuevo</span></legend>

      <p class="export-hint">Descarga una vista del elemento en formato WEBP de máxima calidad.</p>

      <button class="btn-export" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"></path>
          <path d="M7 10l5 5 5-5"></path>
          <path d="M5 21h14"></path>
        </svg>
        Exportar vista (.webp)
      </button>
    </fieldset>

  </div>

  <div class="modal__footer">
    <button class="btn-cancel" type="button">Cancelar</button>
    <button class="btn-accept" type="button">Aceptar</button>
  </div>
</div>
