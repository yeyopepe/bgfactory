<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Modal — Elegir qué copiar del estilo</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    padding: 2rem;
    display: flex;
    justify-content: center;
  }
  .modal-overlay-static {
    background: rgba(0,0,0,0.5);
    padding: 3rem;
    border-radius: var(--radius-lg);
    display: inline-block;
  }
  .modal {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 420px;
    color: var(--text-primary);
  }
  .modal__header {
    padding: 1rem;
    font-size: 1.125rem;
    font-weight: 500;
    border-bottom: 1px solid var(--border-neutral);
  }
  .modal__content { padding: 1rem; }
  .modal__hint {
    font-size: 0.8125rem;
    color: var(--text-muted);
    margin: 0 0 1rem;
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }

  /* Checklist — mismo patrón que ui/elementSelectionModal.js (element-selection-group) */
  .element-selection-group {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .element-selection-group__select-all {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    background: var(--bg-subtle);
    cursor: pointer;
    font-weight: 500;
    font-size: 0.875rem;
  }
  .element-selection-group__select-all input { cursor: pointer; }
  .element-selection-group__list { padding: 0.5rem 0.75rem 0.75rem; }
  .element-selection-group__item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.25rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
  }
  .element-selection-group__item:hover { background: var(--bg-hover); }
  .element-selection-group__item input { cursor: pointer; }
  .element-selection-group__item-hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-left: auto;
  }

  .face-swatch { display: inline-flex; align-items: center; gap: 0.5rem; }
  .face-swatch__thumb { width: 20px; height: 27px; border-radius: 3px; flex-shrink: 0; }
  .face-swatch__thumb--front { background: linear-gradient(135deg, #8fb8e8, #4d7fc4); border: 1px solid #123a66; }
  .face-swatch__thumb--back { background: linear-gradient(135deg, #d8c98f, #c4a24d); border: 1px solid #665413; }

  .btn { padding: 0.5rem 1rem; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.875rem; }
  .btn-cancel { background: var(--bg-subtle); color: var(--text-primary); }
  .btn-cancel:hover { background: var(--bg-hover); }
  .btn-accept { background: var(--accent-blue); color: var(--text-light); }

  .caption {
    text-align: center;
    color: var(--text-light);
    font-size: 0.75rem;
    margin-top: 0.75rem;
    opacity: 0.85;
    max-width: 420px;
  }
</style>
</head>
<body>
  <div>
    <div class="modal-overlay-static">
      <div class="modal">
        <div class="modal__header">Copiar estilo</div>
        <div class="modal__content">
          <p class="modal__hint">Elige qué copiar. "Cara frontal" y "Cara trasera" incluyen todo su diseño (imagen, borde, transparencia y cuadros de texto).</p>

          <div class="element-selection-group">
            <label class="element-selection-group__select-all">
              <input type="checkbox" checked />
              <span>Elementos de la carta</span>
            </label>
            <div class="element-selection-group__list">
              <label class="element-selection-group__item">
                <input type="checkbox" checked />
                <span>Generales</span>
                <span class="element-selection-group__item-hint">Bloqueado, tooltip, subir al interactuar</span>
              </label>
              <label class="element-selection-group__item">
                <input type="checkbox" checked />
                <span>Proporción</span>
                <span class="element-selection-group__item-hint">Poker vertical (5:7)</span>
              </label>
              <label class="element-selection-group__item">
                <input type="checkbox" checked />
                <span>Mazo</span>
                <span class="element-selection-group__item-hint">Cartas de Evento</span>
              </label>
              <label class="element-selection-group__item">
                <input type="checkbox" checked />
                <span class="face-swatch"><span class="face-swatch__thumb face-swatch__thumb--front"></span> Cara frontal</span>
              </label>
              <label class="element-selection-group__item">
                <input type="checkbox" checked />
                <span class="face-swatch"><span class="face-swatch__thumb face-swatch__thumb--back"></span> Cara trasera</span>
              </label>
            </div>
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn-cancel">Cancelar</button>
          <button class="btn btn-accept">Copiar</button>
        </div>
      </div>
    </div>
    <div class="caption">Maqueta: modal de selección al pulsar "Copiar estilo" — checklist con los 5 elementos copiables, todos marcados por defecto</div>
  </div>
</body>
</html>
