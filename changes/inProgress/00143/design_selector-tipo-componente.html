<title>Maqueta — Selector de tipo de componente (con Tablero personalizado)</title>
<style>
  :root {
    --bg-table:     #c2c2c2;
    --bg-toolbar:   #333333;
    --bg-card:      #f5f5f5;
    --accent-blue:  #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light:   #ffffff;
    --text-muted:   #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle:    #f0f0f0;
    --bg-hover:     #e8e8e8;
    --radius-sm:    4px;
    --radius-lg:    8px;
    --shadow-2:     0 4px 20px rgba(0,0,0,0.15);
    --transition-fast: 150ms ease;
  }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    box-sizing: border-box;
  }
  .modal-overlay {
    position: static;
    background: rgba(0,0,0,0.5);
    padding: 3rem;
    border-radius: var(--radius-lg);
  }
  .modal {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 360px;
    max-width: 90vw;
    overflow: hidden;
  }
  .modal__header {
    padding: 1rem;
    font-size: 1.125rem;
    font-weight: 500;
    border-bottom: 1px solid var(--border-neutral);
    color: var(--text-primary);
  }
  .modal__content { padding: 1rem; }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }
  .component-type-modal__list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .component-type-modal__item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    color: var(--text-primary);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
  }
  .component-type-modal__item:hover {
    border-color: var(--accent-blue);
    box-shadow: 0 2px 6px rgba(44, 125, 216, 0.15);
  }
  .component-type-modal__item input[type="radio"] { cursor: pointer; }

  /* Agrupación visual de los dos tipos de tablero: mismo nivel de indentación/
     separador sutil, sin cambiar el patrón de fila existente */
  .component-type-modal__group-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    padding: 0.25rem 0.5rem 0;
    margin-top: 0.25rem;
  }
  .component-type-modal__group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding-left: 0.5rem;
    border-left: 2px solid var(--border-neutral);
    margin-left: 0.25rem;
  }
  .component-type-modal__item--new {
    border-color: var(--accent-blue);
    background: #eaf3fc;
  }
  .component-type-modal__badge-new {
    margin-left: auto;
    font-size: 0.7rem;
    color: var(--accent-blue);
    background: #ffffff;
    border: 1px solid var(--accent-blue);
    border-radius: var(--radius-sm);
    padding: 0.1rem 0.4rem;
  }

  .btn-cancel {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    background: var(--bg-subtle);
    color: var(--text-primary);
    transition: background var(--transition-fast);
  }
  .btn-cancel:hover { background: var(--bg-hover); }
  .btn-accept {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    background: var(--accent-blue);
    color: var(--text-light);
    transition: opacity var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
  }
  .btn-accept:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 3px 8px rgba(44,125,216,.35); }

  .caption {
    max-width: 360px;
    margin: 1rem auto 0;
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: center;
  }
</style>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">Añadir componente</div>
    <div class="modal__content">
      <div class="component-type-modal__list">
        <label class="component-type-modal__item">
          <input type="radio" name="component-type" checked>
          <span>Cuadro de texto</span>
        </label>

        <div class="component-type-modal__group-label">Tableros</div>
        <div class="component-type-modal__group">
          <label class="component-type-modal__item">
            <input type="radio" name="component-type">
            <span>Tablero simple</span>
          </label>
          <label class="component-type-modal__item component-type-modal__item--new">
            <input type="radio" name="component-type">
            <span>Tablero personalizado</span>
            <span class="component-type-modal__badge-new">Nuevo</span>
          </label>
        </div>

        <label class="component-type-modal__item">
          <input type="radio" name="component-type">
          <span>Dado</span>
        </label>
        <label class="component-type-modal__item">
          <input type="radio" name="component-type">
          <span>Visor de documentos</span>
        </label>
        <label class="component-type-modal__item">
          <input type="radio" name="component-type">
          <span>Carta/Ficha</span>
        </label>
        <label class="component-type-modal__item">
          <input type="radio" name="component-type">
          <span>Mazo</span>
        </label>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn-cancel">Cancelar</button>
      <button class="btn-accept">Aceptar</button>
    </div>
  </div>
</div>
<p class="caption">Maqueta estática — "Tablero personalizado" se agrupa junto a "Tablero simple" bajo un separador visual sutil ("Tableros"). El resaltado "Nuevo" es solo para esta maqueta, no forma parte del diseño final.</p>
