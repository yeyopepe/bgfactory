<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Maqueta — Menú contextual de elemento (modo juego)</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --radius-sm: 4px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --shadow-1: 0 2px 6px rgba(0, 0, 0, 0.1), 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* --- Piezas de ejemplo sobre la mesa, solo para dar contexto visual --- */

  .demo-note {
    position: absolute;
    top: 1rem;
    left: 1rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.6);
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
  }

  .ficha-demo {
    position: absolute;
    top: 220px;
    left: 260px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #e0a94a;
    border: 2px solid #1a1a1a;
    box-shadow: var(--shadow-1), 0 0 0 3px var(--accent-blue), 0 0 0 3px var(--accent-blue);
    outline: 3px dashed var(--accent-blue);
    outline-offset: 3px;
  }

  .carta-demo {
    position: absolute;
    top: 120px;
    left: 520px;
    width: 130px;
    height: 182px;
    border-radius: 8px;
    background: #f5f5f5;
    border: 1px solid #333;
    box-shadow: var(--shadow-1);
  }

  /* --- Menú contextual --- */

  .context-menu {
    position: absolute;
    top: 260px;
    left: 380px;
    min-width: 200px;
    background: var(--accent-blue-light);
    border: 1px solid rgba(44, 125, 216, 0.25);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-2);
    overflow: hidden;
    font-size: 0.875rem;
  }

  .context-menu__section {
    display: flex;
    flex-direction: column;
  }

  .context-menu__section + .context-menu__section {
    border-top: 1px solid rgba(44, 125, 216, 0.25);
  }

  .context-menu__item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    color: var(--text-primary);
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease;
  }

  .context-menu__item:not(:last-child) {
    border-bottom: 1px solid rgba(44, 125, 216, 0.25);
  }

  .context-menu__item:hover {
    background: var(--accent-blue);
    color: var(--text-light);
  }

  .context-menu__icon {
    width: 16px;
    height: 16px;
    flex: none;
    display: inline-flex;
  }

  .context-menu__icon svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
  }

  .context-menu__label {
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="demo-note">Maqueta visual — menú contextual tras click derecho sobre la ficha (sin funcionalidad real)</div>

  <div class="ficha-demo"></div>
  <div class="carta-demo"></div>

  <div class="context-menu">
    <div class="context-menu__section">
      <div class="context-menu__item">
        <span class="context-menu__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <rect x="5" y="11" width="14" height="9" rx="1.5" />
            <path d="M8 11V7a4 4 0 0 1 8 0v1" stroke-linecap="round" />
          </svg>
        </span>
        <span class="context-menu__label">Bloquear</span>
      </div>
    </div>

    <!--
      Parte específica por tipo (sección separada por el borde superior de
      .context-menu__section): esta entrada no añade ninguna acción todavía,
      así que en la maqueta no se dibuja ninguna segunda sección. Cuando en el
      futuro haya acciones específicas, se añadiría aquí un segundo bloque
      .context-menu__section con sus propias filas .context-menu__item.
    -->
  </div>
</body>
</html>
