<style>
  :root {
    --bg-table:     #808080;
    --bg-toolbar:   #333333;
    --bg-card:      #f5f5f5;
    --accent-blue:  #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light:   #ffffff;
    --text-muted:   #666666;
    --error:        #d32f2f;
  }

  body {
    font-family: system-ui, sans-serif;
    margin: 0;
  }

  .mockup-stage {
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    box-sizing: border-box;
  }

  .modal-overlay {
    position: relative;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 560px;
    padding: 3rem 1rem;
  }

  .modal {
    background: white;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    max-width: 500px;
    width: 90%;
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid #eee;
    font-size: 1.125rem;
  }

  .modal__tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid #ddd;
  }

  .modal__tab {
    padding: 0.75rem 1rem;
    background: #f9f9f9;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.875rem;
    border-bottom: 2px solid transparent;
  }

  .modal__tab.active {
    background: white;
    color: var(--text-primary);
    border-bottom-color: var(--accent-blue);
  }

  .modal__content {
    padding: 1.5rem;
  }

  .modal__field {
    margin-bottom: 1rem;
  }

  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .modal__field input[type="text"] {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.875rem;
    box-sizing: border-box;
  }

  /* Footer: el botón de eliminar va al extremo izquierdo,
     separado del resto con margin-right: auto, mientras que
     cancelar/aceptar mantienen su agrupación a la derecha. */
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid #eee;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    justify-content: flex-end;
  }

  .btn-eliminar, .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.875rem;
  }

  .btn-eliminar {
    background: var(--error);
    color: var(--text-light);
    margin-right: auto;
  }

  .btn-eliminar:hover {
    opacity: 0.9;
  }

  .btn-cancel {
    background: #f0f0f0;
    color: var(--text-primary);
  }

  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }

  .mockup-caption {
    position: absolute;
    bottom: 0.5rem;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--text-light);
    font-size: 0.75rem;
    opacity: 0.8;
  }
</style>

<div class="mockup-stage">
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal__header">Editar componente</div>
      <div class="modal__tabs">
        <button class="modal__tab active">Generales</button>
        <button class="modal__tab">Específicas</button>
      </div>
      <div class="modal__content">
        <div class="modal__field">
          <label>ID del componente</label>
          <input type="text" value="texto-1" readonly>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn-eliminar">Eliminar</button>
        <button class="btn-cancel">Cancelar</button>
        <button class="btn-accept">Aceptar</button>
      </div>
    </div>
    <div class="mockup-caption">Maqueta ilustrativa — botón nuevo "Eliminar" en rojo, extremo izquierdo del footer</div>
  </div>
</div>
