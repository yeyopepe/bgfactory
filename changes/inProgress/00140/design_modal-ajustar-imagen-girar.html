<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --transition-fast: 150ms ease;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal-overlay {
    position: relative;
    width: 100%;
    max-width: 1000px;
    min-height: 640px;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-lg);
  }

  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: fit-content;
    max-width: min(900px, 95vw);
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
    font-size: 1.125rem;
  }

  .modal__content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    padding: 1.5rem;
  }

  .image-adjust-modal__stages {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .image-adjust-modal__stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 1rem;
    background: repeating-conic-gradient(#e8e8e8 0% 25%, #f5f5f5 0% 50%) 50% / 20px 20px;
    border: 1px dashed #ccc;
  }

  .image-adjust-modal__stage-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  .image-adjust-modal__stage--focused .image-adjust-modal__stage-title {
    color: var(--accent-blue);
  }

  .image-adjust-modal__stage--dim {
    opacity: 0.6;
  }

  .image-adjust-modal__mask {
    position: relative;
    overflow: hidden;
    width: 240px;
    height: 336px;
    cursor: move;
  }

  .image-adjust-modal__mask--active {
    border: 2px solid var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(44, 125, 216, 0.25);
  }

  .image-adjust-modal__mask--clickable {
    cursor: pointer;
  }

  .image-adjust-modal__image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .modal__controls {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
    max-width: 480px;
  }

  .modal__field {
    width: 100%;
  }

  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  /* Fila combinada: slider de Zoom + nuevo botón de girar, a petición del
     cambio 00140 (ver description.md) */
  .modal__field--zoom-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .modal__field--zoom-row input[type="range"] {
    flex: 1;
  }

  .zoom-value {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.875rem;
    color: var(--text-muted);
    min-width: 3.5rem;
    text-align: right;
    justify-content: flex-end;
  }

  /* Nuevo botón "Girar 90º" (cambio 00140) */
  .btn-rotate {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.75rem;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-size: 0.8125rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--transition-fast);
  }

  .btn-rotate:hover {
    background: var(--bg-hover);
  }

  .btn-rotate svg {
    width: 15px;
    height: 15px;
  }

  .opacity-value {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.875rem;
    color: var(--text-muted);
    min-width: 3.5rem;
    text-align: right;
    justify-content: flex-end;
  }

  .modal__field--opacity-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .modal__field--opacity-row input[type="range"] {
    flex: 1;
  }

  input[type="range"] {
    accent-color: var(--accent-blue);
  }

  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }

  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
  }

  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }

  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }

  .caption {
    position: absolute;
    top: -2.25rem;
    left: 0;
    font-size: 0.8125rem;
    color: #333;
    background: rgba(255, 255, 255, 0.85);
    padding: 0.25rem 0.6rem;
    border-radius: var(--radius-sm);
  }
</style>

<div class="modal-overlay">
  <div class="modal">
    <div class="caption">Maqueta — no funcional (cambio 00140)</div>
    <div class="modal__header">Ajustar imagen</div>

    <div class="modal__content">
      <div class="image-adjust-modal__stages">
        <div class="image-adjust-modal__stage image-adjust-modal__stage--focused">
          <span class="image-adjust-modal__stage-title">Frontal</span>
          <div class="image-adjust-modal__mask image-adjust-modal__mask--active">
            <svg class="image-adjust-modal__image" viewBox="0 0 240 336" preserveAspectRatio="xMidYMid slice">
              <rect width="240" height="336" fill="#f7c948"/>
              <circle cx="120" cy="140" r="60" fill="#e0932a"/>
              <path d="M40 336 L120 220 L200 336 Z" fill="#c9701c"/>
            </svg>
          </div>
        </div>
        <div class="image-adjust-modal__stage image-adjust-modal__stage--dim">
          <span class="image-adjust-modal__stage-title">Trasera</span>
          <div class="image-adjust-modal__mask image-adjust-modal__mask--clickable">
            <svg class="image-adjust-modal__image" viewBox="0 0 240 336" preserveAspectRatio="xMidYMid slice">
              <rect width="240" height="336" fill="#7ea6c9"/>
              <rect x="60" y="90" width="120" height="160" fill="#3f6f96"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="modal__controls">
        <div class="modal__field">
          <label>Zoom</label>
          <div class="modal__field--zoom-row">
            <input type="range" min="100" max="300" value="140" />
            <button class="btn-rotate" type="button" title="Girar 90º">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-3.2-6.9" />
                <polyline points="21 3 21 9 15 9" />
              </svg>
              Girar 90º
            </button>
            <div class="zoom-value">140%</div>
          </div>
        </div>

        <div class="modal__field">
          <label>Transparencia</label>
          <div class="modal__field--opacity-row">
            <input type="range" min="0" max="100" value="0" />
            <div class="opacity-value">0%</div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal__footer">
      <button class="btn-cancel" type="button">Cancelar</button>
      <button class="btn-accept" type="button">Aceptar</button>
    </div>
  </div>
</div>
