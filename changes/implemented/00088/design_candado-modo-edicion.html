<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Maqueta — Candado sobre elemento bloqueado (modo edición)</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-muted: #666666;
    --radius-sm: 4px;
    --shadow-1: 0 2px 6px rgba(0, 0, 0, 0.1), 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  .demo-note {
    position: absolute;
    top: 1rem;
    left: 1rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.6);
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
    max-width: 340px;
    line-height: 1.4;
  }

  .mode-badge {
    position: absolute;
    top: 1rem;
    right: 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent-blue);
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
  }

  /* --- Piezas de ejemplo sobre la mesa --- */

  .component {
    position: absolute;
    box-shadow: var(--shadow-1);
  }

  .component--locked {
    outline: 1px dashed rgba(0, 0, 0, 0.25);
    outline-offset: 2px;
  }

  .ficha {
    top: 200px;
    left: 220px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #e0a94a;
    border: 2px solid #1a1a1a;
  }

  .carta {
    top: 140px;
    left: 420px;
    width: 130px;
    height: 182px;
    border-radius: 8px;
    background: #f5f5f5;
    border: 1px solid #333;
  }

  .tablero {
    top: 340px;
    left: 620px;
    width: 220px;
    height: 150px;
    border-radius: 4px;
    background: #6f9e6f;
    border: 3px solid #2f4f2f;
  }

  /* --- Insignia de candado --- */

  .lock-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--text-primary);
    border: 2px solid #ffffff;
    box-shadow: var(--shadow-1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lock-badge svg {
    width: 14px;
    height: 14px;
    stroke: #ffffff;
  }

  .component-label {
    position: absolute;
    bottom: -1.4rem;
    left: 0;
    font-size: 0.7rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="demo-note">
    Maqueta visual — modo edición: los componentes bloqueados muestran el
    icono de candado superpuesto en una esquina; los no bloqueados (la carta,
    en este ejemplo) no muestran nada. Sin funcionalidad real.
  </div>
  <div class="mode-badge">Modo edición</div>

  <div class="component component--locked ficha">
    <span class="lock-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <rect x="5" y="11" width="14" height="9" rx="1.5" />
        <path d="M8 11V8a4 4 0 0 1 8 0" stroke-linecap="round" />
      </svg>
    </span>
    <span class="component-label">Ficha — bloqueada</span>
  </div>

  <div class="component carta">
    <span class="component-label">Carta — sin bloquear</span>
  </div>

  <div class="component component--locked tablero">
    <span class="lock-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <rect x="5" y="11" width="14" height="9" rx="1.5" />
        <path d="M8 11V8a4 4 0 0 1 8 0" stroke-linecap="round" />
      </svg>
    </span>
    <span class="component-label">Tablero — bloqueado</span>
  </div>
</body>
</html>
