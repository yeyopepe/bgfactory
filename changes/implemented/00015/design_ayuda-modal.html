<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mockup — Icono de ayuda, variante modal (texto largo/con formato)</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #2b2b2f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }

  .modal-overlay {
    background: rgba(0,0,0,0.5);
    padding: 2rem;
    border-radius: 8px;
  }

  .modal {
    width: 380px;
    background: #1e1e22;
    border-radius: 8px;
    color: #eee;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    overflow: hidden;
  }

  .modal__header {
    padding: 1rem 1.25rem;
    font-size: 1.05rem;
    font-weight: 600;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal__content {
    padding: 1.25rem;
    font-size: 0.875rem;
    line-height: 1.5;
    color: #ddd;
  }

  .modal__content p {
    margin: 0 0 0.75rem;
  }

  .modal__content ul {
    margin: 0 0 0.75rem;
    padding-left: 1.25rem;
  }

  .modal__footer {
    display: flex;
    justify-content: flex-end;
    padding: 1rem 1.25rem;
    border-top: 1px solid #333;
  }

  .modal__footer button {
    padding: 0.45rem 1rem;
    border-radius: 4px;
    border: none;
    font-size: 0.85rem;
    cursor: default;
    background: #6ab0ff;
    color: #10141c;
    font-weight: 600;
  }

  .help-icon-static {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #6ab0ff;
    color: #10141c;
    font-size: 0.7rem;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal__header">
        <span>Ayuda: Mover en Modo Juego</span>
        <span class="help-icon-static">?</span>
      </div>
      <div class="modal__content">
        <p>Cuando el texto de ayuda es largo o tiene formato, en vez de un tooltip se abre esta ventana modal con el contenido completo.</p>
        <p>Ejemplos de lo que puede incluir:</p>
        <ul>
          <li>Varios párrafos explicativos.</li>
          <li>Listas como esta.</li>
          <li>Aclaraciones adicionales sobre casos límite.</li>
        </ul>
      </div>
      <div class="modal__footer">
        <button>Cerrar</button>
      </div>
    </div>
  </div>
</body>
</html>
