<div style="font-family: system-ui, sans-serif; background:#2b2b2b; padding:40px; display:flex; justify-content:center;">
  <div style="width:520px; background:#fff; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.4); overflow:hidden;">
    <div style="padding:16px 20px; border-bottom:1px solid #e5e5e5; font-size:18px; font-weight:600; color:#222;">Ajustar imagen</div>

    <div style="padding:20px; display:flex; gap:20px; justify-content:center;">
      <!-- Cara activa -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:160px; height:160px; border-radius:8px; border:3px solid #3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.25); overflow:hidden; position:relative; cursor:grab;">
          <div style="position:absolute; inset:-20% ; background:repeating-linear-gradient(45deg,#c9a876,#c9a876 10px,#b8925e 10px,#b8925e 20px);"></div>
          <svg width="60" height="60" viewBox="0 0 24 24" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); opacity:.6;" fill="#5a3b1c"><path d="M4 6h16v12H4z" stroke="#5a3b1c" stroke-width="1.5" fill="none"/><path d="M4 6l8 6 8-6"/></svg>
        </div>
        <span style="font-size:12px; color:#3b82f6; font-weight:600;">Activa</span>
      </div>

      <!-- Otra cara (clicable) -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:160px; height:160px; border-radius:8px; border:1px solid #d8d8d8; overflow:hidden; position:relative; cursor:pointer; filter:brightness(.94);">
          <div style="position:absolute; inset:-20%; background:#e7d9c4;"></div>
          <svg width="60" height="60" viewBox="0 0 24 24" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); opacity:.5;" fill="#8a8378"><rect x="4" y="3" width="16" height="18" rx="1" stroke="#8a8378" stroke-width="1.2" fill="none"/><line x1="7" y1="8" x2="17" y2="8" stroke="#8a8378" stroke-width="1.2"/><line x1="7" y1="12" x2="17" y2="12" stroke="#8a8378" stroke-width="1.2"/><line x1="7" y1="16" x2="13" y2="16" stroke="#8a8378" stroke-width="1.2"/></svg>
          <div style="position:absolute; inset:0; background:rgba(0,0,0,0.04);"></div>
        </div>
        <span style="font-size:12px; color:#8a8a8a;">Otra cara</span>
      </div>
    </div>

    <div style="padding:0 20px 20px;">
      <div style="font-size:13px; color:#444; margin-bottom:6px;">Zoom</div>
      <div style="height:4px; background:#e2e2e2; border-radius:2px; position:relative;">
        <div style="position:absolute; left:0; top:0; height:4px; width:35%; background:#3b82f6; border-radius:2px;"></div>
        <div style="position:absolute; left:35%; top:50%; transform:translate(-50%,-50%); width:14px; height:14px; border-radius:50%; background:#3b82f6; box-shadow:0 1px 3px rgba(0,0,0,.3);"></div>
      </div>
      <div style="margin-top:10px; display:flex; align-items:center; gap:6px;">
        <input type="text" value="170" style="width:60px; padding:5px 8px; border-radius:6px; border:1px solid #ccc; font-size:13px; text-align:center;" />
        <span style="font-size:13px; color:#777;">%</span>
      </div>
    </div>

    <div style="padding:16px 20px; border-top:1px solid #e5e5e5; display:flex; justify-content:flex-end; gap:10px;">
      <button style="padding:8px 16px; border-radius:6px; border:1px solid #ccc; background:#f2f2f2; color:#333; font-size:14px;">Cancelar</button>
      <button style="padding:8px 16px; border-radius:6px; border:none; background:#3b82f6; color:#fff; font-size:14px; font-weight:600;">Aceptar</button>
    </div>
  </div>
</div>
