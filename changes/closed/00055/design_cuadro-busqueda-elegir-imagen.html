<title>Mockup — Búsqueda en "Elegir imagen"</title>
<style>
  :root {
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
  }
  body {
    font-family: system-ui, sans-serif;
    background: #f3f3f3;
    padding: 2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    align-items: flex-start;
  }
  .caption {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 0 0 0.5rem;
    text-align: center;
  }
  .block { display: flex; flex-direction: column; align-items: center; }

  /* --- Réplica fiel de las clases reales del modal (main.css) --- */
  .modal-overlay {
    position: relative;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    border-radius: 4px;
  }
  .modal {
    background: white;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    width: 380px;
    display: flex;
    flex-direction: column;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid #eee;
    font-size: 1.125rem;
    color: var(--text-primary);
  }
  .modal__content {
    padding: 1.5rem;
  }

  /* Cuadro de búsqueda nuevo: mismo aspecto que .resource-panel__filter */
  .board-image-modal__search {
    margin-bottom: 1rem;
  }
  .board-image-modal__search input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 0.5rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.875rem;
  }
  .board-image-modal__search input[type="text"]:focus {
    outline: none;
    border-color: var(--accent-blue);
  }

  .board-image-modal__gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 0.75rem;
  }
  .board-image-modal__item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    padding: 0.5rem;
    background: none;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: inherit;
  }
  .board-image-modal__item--selected {
    border-color: var(--accent-blue);
    outline: 2px solid var(--accent-blue);
  }
  .board-image-modal__thumb {
    width: 80px;
    height: 80px;
    border-radius: 3px;
    background: linear-gradient(135deg, #cfcfcf, #9a9a9a);
  }
  .board-image-modal__name {
    font-size: 0.75rem;
    color: var(--text-primary);
    text-align: center;
    word-break: break-word;
  }
  .board-image-modal__empty-filter {
    color: var(--text-muted);
    text-align: center;
    padding: 1rem;
    font-size: 0.875rem;
  }

  .modal__footer {
    padding: 1rem;
    border-top: 1px solid #eee;
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }
  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: 4px;
    font-size: 0.875rem;
  }
  .btn-cancel { background: #f0f0f0; color: var(--text-primary); }
  .btn-accept { background: var(--accent-blue); color: var(--text-light); }
</style>

<div class="block">
  <p class="caption">Con texto de búsqueda, hay coincidencias</p>
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal__header">Elegir imagen</div>
      <div class="modal__content">
        <div class="board-image-modal__search">
          <input type="text" placeholder="Buscar imagen…" value="localization">
        </div>
        <div class="board-image-modal__gallery">
          <button class="board-image-modal__item">
            <div class="board-image-modal__thumb"></div>
            <span class="board-image-modal__name">localization-main-back</span>
          </button>
          <button class="board-image-modal__item board-image-modal__item--selected">
            <div class="board-image-modal__thumb"></div>
            <span class="board-image-modal__name">localization-secondary-back</span>
          </button>
          <button class="board-image-modal__item">
            <div class="board-image-modal__thumb"></div>
            <span class="board-image-modal__name">localization-secondary-forbidden-back</span>
          </button>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn-cancel">Cancelar</button>
        <button class="btn-accept">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<div class="block">
  <p class="caption">Con texto de búsqueda, sin coincidencias</p>
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal__header">Elegir imagen</div>
      <div class="modal__content">
        <div class="board-image-modal__search">
          <input type="text" placeholder="Buscar imagen…" value="xyz">
        </div>
        <p class="board-image-modal__empty-filter">No hay imágenes que coincidan con «xyz».</p>
      </div>
      <div class="modal__footer">
        <button class="btn-cancel">Cancelar</button>
        <button class="btn-accept" disabled>Aceptar</button>
      </div>
    </div>
  </div>
</div>
