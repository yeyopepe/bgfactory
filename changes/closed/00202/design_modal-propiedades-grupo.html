<title>Maqueta — Modal de propiedades de un grupo</title>
<style>
  :root {
    --accent-blue: #2c7dd8;
    --accent-blue-dark: #123a66;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --transition-fast: 150ms ease;
    --section-accent: #5b5f97;
    --bg-table: #c2c2c2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg-table);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .caption {
    position: fixed;
    top: 1rem;
    left: 1rem;
    font-size: 0.8rem;
    color: rgba(0,0,0,0.6);
    background: rgba(255,255,255,0.8);
    padding: 0.4rem 0.6rem;
    border-radius: var(--radius-sm);
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 90%;
    max-width: 480px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
  }

  .modal__header-title {
    margin: 0;
    font-size: 1.125rem;
    color: var(--text-primary);
  }

  .modal__tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-neutral);
  }

  .modal__tab {
    padding: 0.75rem 1rem;
    background: white;
    border: none;
    cursor: default;
    color: var(--text-primary);
    font-size: 0.875rem;
    border-bottom: 2px solid var(--accent-blue);
  }

  .modal__content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
  }

  .modal__field {
    margin-bottom: 1rem;
  }

  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .modal__field input[type="text"],
  .modal__field select {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.875rem;
  }

  .modal__field select { cursor: pointer; }

  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .modal__field--checkbox label {
    display: inline;
    margin-bottom: 0;
  }

  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin: 1rem -0.75rem 0;
    padding: 1rem 1.25rem;
  }

  fieldset.modal__section > *:last-child {
    margin-bottom: 0;
  }

  legend.modal__section-title {
    padding: 0 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--section-accent);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .tag-checkbox-list__scroll {
    max-height: 6.5rem;
    overflow-y: auto;
  }

  .modal__field--checkbox.create-tag {
    cursor: pointer;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }

  .new-tag-row {
    margin-top: 0.5rem;
    display: flex;
    gap: 0.5rem;
  }

  .new-tag-row input[type="text"] {
    flex: 1;
    padding: 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.875rem;
  }

  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }

  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
  }

  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }

  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }
</style>

<div class="caption">Maqueta estática — modal "Propiedades del grupo", abierto desde el botón "Editar" de una fila de grupo en el panel de Componentes (cambio 00202)</div>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">
      <h3 class="modal__header-title">Propiedades del grupo</h3>
    </div>

    <div class="modal__tabs">
      <button type="button" class="modal__tab active">General</button>
    </div>

    <div class="modal__content">
      <div class="modal__field">
        <label>Id del grupo</label>
        <input type="text" value="grupo-2">
      </div>

      <fieldset class="modal__section">
        <legend class="modal__section-title">General</legend>

        <div class="modal__field">
          <label>Bloqueado</label>
          <select>
            <option selected>Ninguno</option>
            <option>Solo modo juego</option>
            <option>Todos los modos</option>
          </select>
        </div>

        <div class="modal__field--checkbox">
          <input type="checkbox" id="oculto">
          <label for="oculto">Oculto</label>
        </div>

        <div class="modal__field--checkbox">
          <input type="checkbox" id="tooltip">
          <label for="tooltip">Mostrar tooltip</label>
        </div>

        <div class="modal__field--checkbox">
          <input type="checkbox" id="subir">
          <label for="subir">Subir al mover/interactuar</label>
        </div>
      </fieldset>

      <fieldset class="modal__section">
        <legend class="modal__section-title">Etiquetas</legend>

        <div class="tag-checkbox-list__scroll">
          <div class="modal__field modal__field--checkbox">
            <input type="checkbox" id="tag1" checked>
            <label for="tag1">Mazo inicial</label>
          </div>
          <div class="modal__field modal__field--checkbox">
            <input type="checkbox" id="tag2">
            <label for="tag2">Escenario 1</label>
          </div>
          <div class="modal__field modal__field--checkbox">
            <input type="checkbox" id="tag3">
            <label for="tag3">Componentes de evento</label>
          </div>
        </div>

        <div class="modal__field modal__field--checkbox create-tag">
          + Crear nueva etiqueta…
        </div>

        <div class="new-tag-row">
          <input type="text" placeholder="Nombre de la etiqueta nueva">
          <button type="button" class="btn-cancel">+</button>
        </div>
      </fieldset>
    </div>

    <div class="modal__footer">
      <button type="button" class="btn-cancel">Cancelar</button>
      <button type="button" class="btn-accept">Guardar</button>
    </div>
  </div>
</div>
