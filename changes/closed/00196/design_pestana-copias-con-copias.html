<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maqueta — Pestaña Copias (con copias)</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --transition-fast: 150ms ease;
    --section-accent: #5b5f97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 520px;
    display: flex;
    flex-direction: column;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
  }
  .modal__header-title {
    margin: 0;
    font-size: 1.125rem;
    color: var(--text-primary);
  }
  .modal__tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-neutral);
  }
  .modal__tab {
    padding: 0.75rem 1rem;
    background: var(--bg-hover);
    border: none;
    cursor: default;
    color: var(--text-muted);
    font-size: 0.875rem;
    border-bottom: 2px solid transparent;
  }
  .modal__tab.active {
    background: white;
    color: var(--text-primary);
    border-bottom-color: var(--accent-blue);
    font-weight: 600;
  }
  .modal__content {
    padding: 1.5rem;
  }
  .modal__field {
    margin-bottom: 1rem;
  }
  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .copies-total {
    font-size: 1rem;
    color: var(--text-primary);
  }
  .copies-total strong {
    font-size: 1.25rem;
    color: var(--accent-blue);
  }
  .copies-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }
  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: default;
    font-size: 0.875rem;
  }
  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }
  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin: 1.5rem 0 0;
    padding: 1rem 1.25rem;
  }
  legend.modal__section-title {
    padding: 0 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--section-accent);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0;
  }
  .modal__field--checkbox label {
    display: inline;
    margin-bottom: 0;
    font-size: 0.875rem;
    font-weight: 500;
  }
  .modal__hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin: 0.5rem 0 0;
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }
</style>
</head>
<body>

  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__header-title">Editar propiedades del componente</h2>
    </div>
    <div class="modal__tabs">
      <button class="modal__tab">Generales</button>
      <button class="modal__tab">Específicas</button>
      <button class="modal__tab active">Copias</button>
    </div>
    <div class="modal__content">

      <div class="modal__field">
        <p class="copies-total">Total de copias: <strong>3</strong></p>
      </div>

      <div class="copies-actions">
        <button class="btn-cancel">Ver listado de copias</button>
        <button class="btn-accept">Sincronizar todas las copias</button>
      </div>

      <fieldset class="modal__section">
        <legend class="modal__section-title">Desincronizar todas las copias</legend>
        <div class="modal__field--checkbox">
          <input type="checkbox" id="ocultoTodas">
          <label for="ocultoTodas">Oculto</label>
        </div>
        <p class="modal__hint">Al marcar o desmarcar, todas las copias se desincronizan y su "Oculto" pasa a este valor de inmediato.</p>
      </fieldset>

    </div>
    <div class="modal__footer">
      <button class="btn-cancel">Cancelar</button>
      <button class="btn-accept">Aceptar</button>
    </div>
  </div>

</body>
</html>
