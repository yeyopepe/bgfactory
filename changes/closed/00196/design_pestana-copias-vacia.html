<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maqueta — Pestaña Copias (vacía)</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 520px;
    display: flex;
    flex-direction: column;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
  }
  .modal__header-title {
    margin: 0;
    font-size: 1.125rem;
    color: var(--text-primary);
  }
  .modal__tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-neutral);
  }
  .modal__tab {
    padding: 0.75rem 1rem;
    background: var(--bg-hover);
    border: none;
    cursor: default;
    color: var(--text-muted);
    font-size: 0.875rem;
    border-bottom: 2px solid transparent;
  }
  .modal__tab.active {
    background: white;
    color: var(--text-primary);
    border-bottom-color: var(--accent-blue);
    font-weight: 600;
  }
  .modal__content {
    padding: 2.5rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 140px;
  }
  .copies-empty {
    color: var(--text-muted);
    font-size: 0.9rem;
    text-align: center;
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }
  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: default;
    font-size: 0.875rem;
  }
  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }
</style>
</head>
<body>

  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__header-title">Editar propiedades del componente</h2>
    </div>
    <div class="modal__tabs">
      <button class="modal__tab">Generales</button>
      <button class="modal__tab">Específicas</button>
      <button class="modal__tab active">Copias</button>
    </div>
    <div class="modal__content">
      <p class="copies-empty">Este objeto no tiene copias.</p>
    </div>
    <div class="modal__footer">
      <button class="btn-cancel">Cancelar</button>
      <button class="btn-accept">Aceptar</button>
    </div>
  </div>

</body>
</html>
