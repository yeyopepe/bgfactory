<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maqueta — Listado de copias</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --success: #2e7d32;
    --text-muted-light: #999999;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 420px;
    display: flex;
    flex-direction: column;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
  }
  .modal__header-title {
    margin: 0;
    font-size: 1.125rem;
    color: var(--text-primary);
  }
  .modal__content {
    padding: 1.5rem;
  }
  table.copies-list__table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  table.copies-list__table th {
    padding: 0.5rem;
    text-align: left;
    font-weight: 500;
    background: var(--bg-subtle);
  }
  table.copies-list__table td {
    padding: 0.5rem;
    border-top: 1px solid var(--border-neutral);
  }
  .copies-list__sync {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .copies-list__sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .copies-list__sync--yes .copies-list__sync-dot {
    background: var(--success);
  }
  .copies-list__sync--no .copies-list__sync-dot {
    background: var(--text-muted-light);
  }
  .copies-list__sync--no {
    color: var(--text-muted);
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }
  .btn-cancel {
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: default;
    font-size: 0.875rem;
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
</style>
</head>
<body>

  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__header-title">Listado de copias — "cartaHechizo-01"</h2>
    </div>
    <div class="modal__content">
      <table class="copies-list__table">
        <thead>
          <tr>
            <th>Id</th>
            <th>Sincronizada</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>cartaHechizo-01-COPY-001</td>
            <td><span class="copies-list__sync copies-list__sync--yes"><span class="copies-list__sync-dot"></span>Sí</span></td>
          </tr>
          <tr>
            <td>cartaHechizo-01-COPY-002</td>
            <td><span class="copies-list__sync copies-list__sync--yes"><span class="copies-list__sync-dot"></span>Sí</span></td>
          </tr>
          <tr>
            <td>cartaHechizo-01-COPY-003</td>
            <td><span class="copies-list__sync copies-list__sync--no"><span class="copies-list__sync-dot"></span>No</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="modal__footer">
      <button class="btn-cancel">Cerrar</button>
    </div>
  </div>

</body>
</html>
