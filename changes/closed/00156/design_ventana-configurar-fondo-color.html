<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mockup — Ventana "Configurar fondo — Color"</title>
<style>
  :root {
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: rgba(0,0,0,0.5);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 360px;
    max-width: 95vw;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
    font-size: 1.125rem;
    color: var(--text-primary);
  }
  .modal__content {
    padding: 1.5rem 1.25rem;
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }

  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .color-transparent-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .color-transparent-row input[type="color"] {
    width: 100%;
    height: 40px;
    padding: 0.25rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }

  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }
  .modal__field--checkbox label { display: inline; margin-bottom: 0; }

  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
  }
  .btn-cancel { background: var(--bg-subtle); color: var(--text-primary); }
  .btn-accept { background: var(--accent-blue); color: var(--text-light); }
</style>
</head>
<body>
  <div class="modal">
    <div class="modal__header">Configurar fondo — Color</div>
    <div class="modal__content">
      <div class="modal__field">
        <label>Color</label>
        <div class="color-transparent-row">
          <input type="color" value="#ffffff">
          <div class="modal__field--checkbox">
            <input type="checkbox" id="transp1">
            <label for="transp1">Transparente</label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn-cancel">Cancelar</button>
      <button type="button" class="btn-accept">Aceptar</button>
    </div>
  </div>
</body>
</html>
