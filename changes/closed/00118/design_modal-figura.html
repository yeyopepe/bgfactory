<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Modal de configuración — Figura geométrica</title>
<style>
  :root {
    --bg-table:     #c2c2c2;
    --bg-card:      #f5f5f5;
    --accent-blue:  #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light:   #ffffff;
    --text-muted:   #666666;
    --error:        #d32f2f;
    --border-neutral: #dcdcdc;
    --bg-subtle:    #f0f0f0;
    --bg-hover:     #e8e8e8;
    --radius-sm:    4px;
    --radius-lg:    8px;
    --shadow-2:     0 4px 20px rgba(0,0,0,0.15);
    --transition-fast: 150ms ease;
    --section-accent: #5b5f97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    padding: 2rem;
    display: flex;
    justify-content: center;
  }
  .overlay {
    background: rgba(0,0,0,0.5);
    border-radius: var(--radius-lg);
    padding: 2rem;
    display: flex;
    justify-content: center;
  }
  .modal {
    width: 360px;
    max-width: 90vw;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    padding: 1.25rem;
  }
  .modal__header {
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 1rem 0;
  }
  .modal__field { margin-bottom: 1rem; }
  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 0.375rem;
  }
  .align-group { display: flex; gap: 0.25rem; }
  .align-group__btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--transition-fast);
  }
  .align-group__btn:hover { background: var(--bg-hover); }
  .align-group__btn.active { background: var(--accent-blue); color: var(--text-light); }

  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    padding: 1rem;
    margin: 0 0 1rem 0;
  }
  .modal__section-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--section-accent);
    padding: 0 0.25rem;
  }
  .row { display: flex; gap: 0.5rem; }
  .row > div { flex: 1; }
  .row label { display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem; }
  .row input[type="color"] {
    width: 100%; height: 32px; border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm); padding: 0;
  }
  .row input[type="number"] {
    width: 100%; padding: 0.4rem 0.5rem; border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm); font-size: 0.8125rem;
  }
  .field-fondo label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
  .field-fondo input[type="color"] {
    width: 100%; height: 32px; border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm); padding: 0;
  }

  .modal__footer {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    margin-top: 1.25rem;
  }
  .footer-left, .footer-right { display: flex; gap: 0.5rem; }
  button {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    cursor: pointer;
    transition: background var(--transition-fast), opacity var(--transition-fast);
  }
  .btn-eliminar { background: var(--error); color: var(--text-light); }
  .btn-cancel { background: var(--bg-subtle); color: var(--text-primary); }
  .btn-cancel:hover { background: var(--bg-hover); }
  .btn-accept { background: var(--accent-blue); color: var(--text-light); }
</style>
</head>
<body>
  <div class="overlay">
    <div class="modal">
      <p class="modal__header">Configurar figura</p>

      <div class="modal__field">
        <label>Tipo de figura</label>
        <div class="align-group">
          <button class="align-group__btn active" title="Círculo / elipse" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
          </button>
          <button class="align-group__btn" title="Cuadrado" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
          </button>
        </div>
      </div>

      <div class="modal__field field-fondo">
        <label>Color de fondo</label>
        <input type="color" value="#eaf3fc" />
      </div>

      <fieldset class="modal__section">
        <legend class="modal__section-title">Borde</legend>
        <div class="row">
          <div>
            <label>Color</label>
            <input type="color" value="#2c7dd8" />
          </div>
          <div>
            <label>Grosor (px)</label>
            <input type="number" value="2" min="0" max="20" />
          </div>
        </div>
      </fieldset>

      <div class="modal__footer">
        <div class="footer-left">
          <button class="btn-eliminar" type="button">Eliminar</button>
        </div>
        <div class="footer-right">
          <button class="btn-cancel" type="button">Duplicar</button>
          <button class="btn-cancel" type="button">Cancelar</button>
          <button class="btn-accept" type="button">Aceptar</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
