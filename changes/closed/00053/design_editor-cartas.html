<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #2b2f36;
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .overlay {
    background: rgba(0,0,0,0.5);
    width: 100%;
    max-width: 980px;
    display: flex;
    justify-content: center;
  }
  .modal {
    background: #ffffff;
    border-radius: 8px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .modal__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid #e4e7eb;
  }
  .modal__title {
    font-size: 16px;
    font-weight: 600;
    color: #1f2937;
  }
  .modal__close {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6b7280;
    font-size: 16px;
    cursor: default;
  }
  .modal__toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid #eef0f2;
    background: #fafbfc;
  }
  .modal__toolbar label {
    font-size: 12px;
    color: #4b5563;
  }
  .modal__toolbar select {
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #d1d5db;
    color: #374151;
  }
  .modal__body {
    display: flex;
    gap: 28px;
    padding: 28px;
    justify-content: center;
    background: #f4f5f7;
  }
  .face {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .face__label {
    font-size: 12px;
    font-weight: 600;
    color: #4b5563;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .canvas {
    width: 220px;
    height: 308px;
    background: repeating-linear-gradient(45deg, #ffffff, #ffffff 8px, #f0f1f3 8px, #f0f1f3 16px);
    border: 1px dashed #b8bec7;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
  }
  .canvas .art {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #8fb7e8, #4f78b8);
  }
  .canvas .textbox {
    position: absolute;
    border: 1px solid #3a6ff0;
    background: rgba(255,255,255,0.85);
    font-size: 10px;
    padding: 3px 5px;
    color: #1f2937;
    box-sizing: border-box;
    cursor: default;
  }
  .canvas .textbox::after {
    content: "";
    position: absolute;
    right: -3px;
    bottom: -3px;
    width: 6px;
    height: 6px;
    background: #3a6ff0;
    border-radius: 1px;
  }
  .tb-title {
    top: 14px;
    left: 14px;
    right: 14px;
    font-weight: 700;
    font-size: 12px;
    text-align: center;
  }
  .tb-body {
    left: 16px;
    right: 16px;
    bottom: 16px;
    height: 60px;
    font-size: 8.5px;
    line-height: 1.3;
  }
  .canvas--back {
    background: linear-gradient(135deg, #3a4a6b, #23304a);
    border-style: solid;
    border-color: #1c2740;
  }
  .canvas--back::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 6px;
  }
  .face__tools {
    display: flex;
    gap: 6px;
  }
  .chip {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 999px;
    background: #eef1f5;
    color: #374151;
    border: 1px solid #dfe3e8;
  }
  .modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid #e4e7eb;
  }
  .btn {
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    color: #374151;
    background: #ffffff;
  }
  .btn--primary {
    background: #3a6ff0;
    border-color: #3a6ff0;
    color: #ffffff;
  }
</style>

<div class="overlay">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title">Editor de cartas — Espada Élfica</div>
      <div class="modal__close">✕</div>
    </div>
    <div class="modal__toolbar">
      <label for="proporcion">Proporción</label>
      <select id="proporcion">
        <option>2:3 (vertical, estándar)</option>
      </select>
    </div>
    <div class="modal__body">
      <div class="face">
        <div class="face__label">Cara frontal</div>
        <div class="canvas">
          <div class="art"></div>
          <div class="textbox tb-title">Espada Élfica</div>
          <div class="textbox tb-body">Otorga +2 de ataque en combate cuerpo a cuerpo.</div>
        </div>
        <div class="face__tools">
          <span class="chip">Elegir imagen…</span>
          <span class="chip">+ Cuadro de texto</span>
        </div>
      </div>
      <div class="face">
        <div class="face__label">Cara trasera</div>
        <div class="canvas canvas--back"></div>
        <div class="face__tools">
          <span class="chip">Elegir imagen…</span>
          <span class="chip">+ Cuadro de texto</span>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn">Cancelar</button>
      <button class="btn btn--primary">Aceptar</button>
    </div>
  </div>
</div>
