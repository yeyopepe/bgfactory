<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Selector de imagen de fondo (ventana ampliada)</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --bg-card: #f5f5f5;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
    --transition-fast: 150ms ease;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .modal-overlay {
    position: relative;
    background: rgba(0,0,0,0.5);
    width: 100%;
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-lg);
  }
  /* Nota de maqueta: patrón "modal ancho" de STYLE_BIBLE 12.4 — clase de bloque
     propia con max-width dedicado en vez de tocar .modal base */
  .modal.board-image-modal--wide {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 90%;
    max-width: min(900px, 90vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border-neutral);
  }
  .modal__header h2 {
    margin: 0;
    font-size: 1.125rem;
    color: var(--text-primary);
  }
  .modal__close {
    background: none;
    border: none;
    font-size: 1.25rem;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
  }
  .modal__content {
    padding: 1.5rem;
    overflow-y: auto;
    flex: 1;
  }
  .board-image-modal__search {
    width: 100%;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    margin-bottom: 1rem;
  }
  .board-image-modal__gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
  }
  .board-image-modal__item {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.75rem;
    border: 2px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color var(--transition-fast), background var(--transition-fast);
  }
  .board-image-modal__item:hover {
    background: var(--bg-hover);
  }
  .board-image-modal__item--selected {
    border-color: var(--accent-blue);
  }
  .board-image-modal__thumb {
    width: 140px;
    height: 140px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    margin-bottom: 0.5rem;
  }
  .board-image-modal__name {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: center;
    word-break: break-word;
  }
  .modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-neutral);
  }
  .btn-cancel {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-size: 0.875rem;
    cursor: pointer;
  }
  .btn-accept {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent-blue);
    color: var(--text-light);
    font-size: 0.875rem;
    cursor: pointer;
  }
  .mockup-note {
    position: absolute;
    top: 0.5rem;
    left: 0.5rem;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
  <div class="modal-overlay">
    <span class="mockup-note">Maqueta estática — cambio 00169</span>
    <div class="modal board-image-modal--wide">
      <div class="modal__header">
        <h2>Elegir imagen de fondo</h2>
        <button class="modal__close" aria-hidden="true">&times;</button>
      </div>
      <div class="modal__content">
        <input class="board-image-modal__search" type="text" placeholder="Buscar imagen..." readonly>
        <div class="board-image-modal__gallery">
          <div class="board-image-modal__item board-image-modal__item--selected">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#8fc1e3"/><circle cx="70" cy="70" r="35" fill="#ffffff" opacity="0.5"/></svg>
            <div class="board-image-modal__name">bosque_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#a3d9a5"/><path d="M0 100 L40 60 L80 110 L140 40 L140 140 L0 140 Z" fill="#5fa66b"/></svg>
            <div class="board-image-modal__name">bosque_02.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#e3c48f"/><rect x="20" y="20" width="100" height="100" fill="#c8a165" opacity="0.6"/></svg>
            <div class="board-image-modal__name">bosque_04.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#d68f8f"/><circle cx="45" cy="55" r="20" fill="#b95d5d"/><circle cx="95" cy="95" r="25" fill="#b95d5d"/></svg>
            <div class="board-image-modal__name">bosque_05.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#9fa8da"/><polygon points="70,15 125,125 15,125" fill="#5c6bc0"/></svg>
            <div class="board-image-modal__name">montana_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#f5d76e"/><rect y="90" width="140" height="50" fill="#e8b93a"/></svg>
            <div class="board-image-modal__name">desierto_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#80cbc4"/><circle cx="70" cy="70" r="55" fill="none" stroke="#26a69a" stroke-width="8"/></svg>
            <div class="board-image-modal__name">agua_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#bcaaa4"/><rect x="10" y="10" width="50" height="50" fill="#8d6e63"/><rect x="80" y="80" width="50" height="50" fill="#8d6e63"/></svg>
            <div class="board-image-modal__name">piedra_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#616161"/><circle cx="40" cy="40" r="8" fill="#eeeeee"/><circle cx="90" cy="60" r="5" fill="#eeeeee"/><circle cx="60" cy="100" r="6" fill="#eeeeee"/></svg>
            <div class="board-image-modal__name">noche_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#ffab91"/><circle cx="70" cy="70" r="45" fill="#ff7043"/></svg>
            <div class="board-image-modal__name">lava_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#c5e1a5"/><path d="M0 40 Q35 10 70 40 T140 40 V140 H0 Z" fill="#9ccc65"/></svg>
            <div class="board-image-modal__name">prado_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#b39ddb"/><rect x="30" y="30" width="80" height="80" fill="#7e57c2" transform="rotate(20 70 70)"/></svg>
            <div class="board-image-modal__name">mazmorra_01.png</div>
          </div>
          <div class="board-image-modal__item">
            <svg class="board-image-modal__thumb" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"><rect width="140" height="140" fill="#fff59d"/><circle cx="70" cy="50" r="20" fill="#fdd835"/><rect y="90" width="140" height="50" fill="#dce775"/></svg>
            <div class="board-image-modal__name">playa_01.png</div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn-cancel">Cancelar</button>
        <button class="btn-accept">Aceptar</button>
      </div>
    </div>
  </div>
</body>
</html>
