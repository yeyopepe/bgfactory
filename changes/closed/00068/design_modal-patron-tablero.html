<div style="
  --accent-blue: #2c7dd8;
  --text-primary: #1a1a1a;
  --text-light: #ffffff;
  --border-neutral: #dcdcdc;
  --bg-subtle: #f0f0f0;
  --radius-sm: 4px;
  --radius-lg: 8px;
  --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2a2a2a;
  font-family: system-ui, -apple-system, sans-serif;
  padding: 2rem;
  box-sizing: border-box;
">
  <div style="
    width: 380px;
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  ">
    <div style="
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-neutral);
      font-weight: 600;
      color: var(--text-primary);
      font-size: 1rem;
    ">Configurar fondo — Color y patrón</div>

    <div style="padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;">

      <!-- Fila: color + grosor, misma fila (nuevo) -->
      <div>
        <div style="display: flex; gap: 0.5rem;">
          <div style="flex: 1;">
            <label style="display:block; font-size:0.8rem; color:var(--text-primary); margin-bottom:0.25rem;">Color del patrón</label>
            <input type="color" value="#2c7dd8" style="
              width: 100%;
              height: 2.25rem;
              padding: 0.2rem;
              border: 1px solid var(--border-neutral);
              border-radius: var(--radius-sm);
              box-sizing: border-box;
              cursor: pointer;
            " />
          </div>
          <div style="flex: 1;">
            <label style="display:block; font-size:0.8rem; color:var(--text-primary); margin-bottom:0.25rem;">Grosor</label>
            <input type="number" value="1" min="1" max="20" style="
              width: 100%;
              height: 2.25rem;
              padding: 0.4rem 0.6rem;
              border: 1px solid var(--border-neutral);
              border-radius: var(--radius-sm);
              box-sizing: border-box;
              font-size: 0.875rem;
              color: var(--text-primary);
            " />
          </div>
        </div>
      </div>

      <!-- Forma de casilla (existente) -->
      <div>
        <label style="display:block; font-size:0.8rem; color:var(--text-primary); margin-bottom:0.25rem;">Forma de casilla</label>
        <select style="
          width: 100%;
          height: 2.25rem;
          padding: 0.4rem 0.6rem;
          border: 1px solid var(--border-neutral);
          border-radius: var(--radius-sm);
          box-sizing: border-box;
          font-size: 0.875rem;
          color: var(--text-primary);
          background: #fff;
        ">
          <option selected>Cuadrada</option>
          <option>Hexagonal</option>
        </select>
      </div>

      <!-- Filas / Columnas (existente) -->
      <div>
        <label style="display:block; font-size:0.8rem; color:var(--text-primary); margin-bottom:0.25rem;">Filas</label>
        <input type="number" value="8" min="1" max="50" style="
          width: 100%;
          height: 2.25rem;
          padding: 0.4rem 0.6rem;
          border: 1px solid var(--border-neutral);
          border-radius: var(--radius-sm);
          box-sizing: border-box;
          font-size: 0.875rem;
          color: var(--text-primary);
        " />
      </div>
      <div>
        <label style="display:block; font-size:0.8rem; color:var(--text-primary); margin-bottom:0.25rem;">Columnas</label>
        <input type="number" value="8" min="1" max="50" style="
          width: 100%;
          height: 2.25rem;
          padding: 0.4rem 0.6rem;
          border: 1px solid var(--border-neutral);
          border-radius: var(--radius-sm);
          box-sizing: border-box;
          font-size: 0.875rem;
          color: var(--text-primary);
        " />
      </div>
    </div>

    <div style="
      padding: 0.75rem 1.25rem;
      border-top: 1px solid var(--border-neutral);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      background: var(--bg-subtle);
    ">
      <button style="
        padding: 0.5rem 1rem;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--bg-subtle);
        color: var(--text-primary);
        font-size: 0.875rem;
        cursor: pointer;
      ">Cancelar</button>
      <button style="
        padding: 0.5rem 1rem;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent-blue);
        color: var(--text-light);
        font-size: 0.875rem;
        cursor: pointer;
      ">Aceptar</button>
    </div>
  </div>
</div>
