<title>Mockup — Espaciado compacto del editor de cartas</title>
<style>
  :root {
    --accent-blue: #2c7dd8;
    --accent-blue-dark: #123a66;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
  }
  body {
    margin: 0;
    padding: 2.5rem;
    font-family: system-ui, sans-serif;
    background: #f2f2f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }
  .caption {
    max-width: 720px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .caption b { color: #222; }

  /* --- Modal --- */
  .card-editor-modal {
    max-width: 760px;
    width: 100%;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    overflow: hidden;
  }
  .modal__header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-neutral);
    font-size: 1.1rem;
    font-weight: 600;
  }
  .modal__content {
    padding: 1.5rem;
  }
  .modal__field { margin-bottom: 1.25rem; }
  .modal__field label {
    display: block;
    font-weight: 500;
    margin-bottom: 0.4rem;
  }
  .modal__field select {
    width: 100%;
    max-width: 16rem;
    padding: 0.45rem 0.6rem;
    border: 1px solid var(--border-neutral);
    border-radius: 4px;
    font-family: inherit;
  }

  /* --- Bloque de caras compacto (propuesta) --- */
  .card-editor-modal__faces {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 0.75rem;
    margin: 1.5rem 0;
  }
  .card-editor-modal__face {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }
  .card-editor-modal__face-label {
    font-weight: 500;
    font-size: 0.875rem;
  }
  .card-editor-modal__canvas {
    width: 150px;
    height: 210px;
    border: 1px solid var(--border-neutral);
    border-radius: 8px;
    background: #ffffff;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-editor-modal__canvas--frontal {
    background:
      radial-gradient(circle at 50% 45%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 35%, transparent 55%),
      repeating-radial-gradient(circle at 30% 70%, rgba(0,0,0,0.08) 0 3px, transparent 3px 14px),
      #efe9df;
  }
  .card-editor-modal__canvas--frontal::after {
    content: "";
    width: 40px;
    height: 40px;
    background: #2a2a2a;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .card-editor-modal__canvas--trasera {
    background: #ffffff;
  }
  .card-editor-modal__face-actions {
    display: flex;
    gap: 0.5rem;
  }
  .btn-cancel {
    background: #ffffff;
    border: 1px solid var(--border-neutral);
    border-radius: 4px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-cancel:hover { background: #f5f5f5; }

  .card-editor-modal__adjust-image {
    align-self: center;
    margin-top: 5.75rem; /* alinea visualmente con el centro del bloque canvas+label de las caras */
    padding: 0.5rem 0.85rem;
  }

  .modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-neutral);
  }
  .btn-accept {
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 0.5rem 1.1rem;
    font-size: 0.9rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-accept:hover { background: var(--accent-blue-dark); }

  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent-blue);
    background: #eaf3fc;
    border-radius: 3px;
    padding: 0.15rem 0.4rem;
    margin-bottom: 0.5rem;
  }
</style>

<p class="caption">
  <span class="badge">Propuesta — antes tenía max-width: 1100px y las caras quedaban pegadas a los bordes</span><br>
  Las dos caras se acercan entre sí y el botón <b>«Ajustar imagen…»</b> queda encajado justo en el hueco central, sin espacio sobrante a los lados.
</p>

<div class="card-editor-modal">
  <div class="modal__header">Editor de cartas</div>
  <div class="modal__content">
    <div class="modal__field">
      <label>Proporción</label>
      <select disabled>
        <option>Poker estándar vertical (5:7)</option>
      </select>
    </div>

    <div class="card-editor-modal__faces">
      <div class="card-editor-modal__face">
        <div class="card-editor-modal__face-label">Cara frontal</div>
        <div class="card-editor-modal__canvas card-editor-modal__canvas--frontal"></div>
        <div class="card-editor-modal__face-actions">
          <button class="btn-cancel" type="button">Elegir imagen…</button>
        </div>
      </div>

      <button class="btn-cancel card-editor-modal__adjust-image" type="button">Ajustar imagen…</button>

      <div class="card-editor-modal__face">
        <div class="card-editor-modal__face-label">Cara trasera</div>
        <div class="card-editor-modal__canvas card-editor-modal__canvas--trasera"></div>
        <div class="card-editor-modal__face-actions">
          <button class="btn-cancel" type="button">Elegir imagen…</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal__footer">
    <button class="btn-cancel" type="button">Cancelar</button>
    <button class="btn-accept" type="button">Aceptar</button>
  </div>
</div>
