<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista de tareas (checkboxes) — propuesta visual</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #e8e8e8;
    font-family: system-ui, sans-serif;
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .caption {
    font-size: 13px;
    color: #555;
    margin: 8px 0 0;
    text-align: center;
  }

  figure {
    margin: 0;
  }

  .document-viewer {
    width: 260px;
    height: 320px;
    background: #ffffff;
    border: 1px solid #999999;
    box-sizing: border-box;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .document-viewer__margin {
    width: 100%;
    height: 6px;
    background: repeating-linear-gradient(
      to right,
      #999999 0,
      #999999 2px,
      transparent 2px,
      transparent 10px
    );
    flex-shrink: 0;
  }

  .document-viewer__content {
    flex: 1;
    padding: 16px 18px;
    overflow-y: auto;
    overflow-x: hidden;
    font-size: 14px;
    line-height: 1.5;
    color: #222;
  }

  .document-viewer__content h1 {
    font-size: 18px;
    margin: 0 0 8px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 6px;
  }

  .document-viewer__content ul {
    margin: 0 0 10px;
    padding-left: 20px;
  }

  /* Ítem de lista de tareas: sin viñeta, casilla deshabilitada alineada
     con el texto. */
  .document-viewer__content ul.task-list,
  .document-viewer__content li.task-list-item {
    list-style: none;
  }

  .document-viewer__content ul.task-list {
    padding-left: 4px;
  }

  .document-viewer__content li.task-list-item {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin: 4px 0;
  }

  .document-viewer__content li.task-list-item input[type="checkbox"] {
    margin: 3px 0 0;
  }

  .document-viewer__content ul.task-list ul.task-list {
    margin-top: 4px;
    padding-left: 22px;
  }
</style>
</head>
<body>

<figure>
  <div class="document-viewer">
    <div class="document-viewer__margin"></div>
    <div class="document-viewer__content">
      <h1>Elementos</h1>
      <ul class="task-list">
        <li class="task-list-item"><input type="checkbox" disabled> Tablero principal</li>
        <li class="task-list-item">
          <input type="checkbox" disabled checked> Cartas
          <ul class="task-list">
            <li class="task-list-item"><input type="checkbox" disabled checked> Eventos</li>
            <li class="task-list-item"><input type="checkbox" disabled> Misiones personales</li>
          </ul>
        </li>
        <li class="task-list-item"><input type="checkbox" disabled> Bolsa de saqueo</li>
      </ul>
    </div>
  </div>
  <p class="caption">Lista de tareas: casilla deshabilitada, sin viñeta, anidable a cualquier profundidad</p>
</figure>

</body>
</html>
