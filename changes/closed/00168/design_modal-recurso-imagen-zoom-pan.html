<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maqueta — Modal recurso Imagen con zoom/pan</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --error: #d32f2f;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --transition-fast: 150ms ease;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: system-ui, sans-serif;
    color: var(--text-primary);
  }
  body {
    background: var(--bg-table);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Modal ancha (equivalente a .image-adjust-modal--large), sustituye al
     max-width: 500px genérico de .modal para el caso de recurso Imagen */
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: fit-content;
    max-width: min(1000px, 95vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-neutral);
    font-weight: 600;
  }

  .modal__content {
    padding: 1.25rem;
    overflow-y: auto;
    width: 640px;
    max-width: 100%;
  }

  .modal__field {
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    margin-bottom: 1.25rem;
  }

  .modal__field label {
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  .modal__field input[type="text"] {
    padding: 0.5rem 0.625rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.9375rem;
  }

  /* Vista previa ampliada, con marco más grande que el actual (180px de alto) */
  .resource-modal__image-preview {
    position: relative;
    width: 100%;
    height: 420px;
    padding: 0;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    background: repeating-conic-gradient(#fafafa 0% 25%, #f0f0f0 0% 50%) 0 0 / 24px 24px;
    overflow: hidden;
  }

  /* Placeholder de imagen ampliada y desplazada (zoom > 100%, pan aplicado):
     el gradiente/patrón simula que solo se ve una porción de la imagen */
  .resource-modal__image-preview__image {
    position: absolute;
    top: -18%;
    left: -30%;
    width: 170%;
    height: 170%;
    cursor: grab;
    background:
      radial-gradient(circle at 30% 30%, #7fb87f 0%, #4c8c4c 35%, transparent 36%),
      radial-gradient(circle at 68% 55%, #6fae6f 0%, #3f7a3f 30%, transparent 31%),
      radial-gradient(circle at 45% 75%, #86bd86 0%, #4c8c4c 28%, transparent 29%),
      linear-gradient(160deg, #dfe9c4 0%, #b7d19a 45%, #6fa06f 100%);
    background-repeat: no-repeat;
  }

  /* Controles de zoom, overlay discreto en la esquina */
  .resource-modal__zoom-controls {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
  }

  .resource-modal__zoom-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: var(--radius-sm);
    background: rgba(0, 0, 0, 0.55);
    color: var(--text-light);
    cursor: pointer;
    transition: background var(--transition-fast);
  }

  .resource-modal__zoom-btn:hover {
    background: rgba(0, 0, 0, 0.72);
  }

  .resource-modal__zoom-btn svg {
    width: 16px;
    height: 16px;
  }

  .resource-modal__zoom-level {
    position: absolute;
    bottom: 0.75rem;
    left: 0.75rem;
    padding: 0.25rem 0.5rem;
    border-radius: var(--radius-sm);
    background: rgba(0, 0, 0, 0.55);
    color: var(--text-light);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }

  .resource-modal__hint {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .modal__footer {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border-neutral);
  }

  .btn-cancel, .btn-accept, .btn-eliminar {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
  }

  .btn-cancel { background: var(--bg-subtle); color: var(--text-primary); }
  .btn-accept { background: var(--accent-blue); color: var(--text-light); }
  .btn-eliminar { background: var(--error); color: var(--text-light); margin-right: auto; }
</style>
</head>
<body>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">Recurso: Imagen — localization_bosque_03</div>

    <div class="modal__content">
      <div class="modal__field">
        <label>Nombre del recurso</label>
        <input type="text" value="localization_bosque_03">
      </div>

      <div class="modal__field">
        <label>Vista previa</label>
        <div class="resource-modal__image-preview">
          <div class="resource-modal__image-preview__image"></div>

          <div class="resource-modal__zoom-controls">
            <button class="resource-modal__zoom-btn" title="Ampliar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
            </button>
            <button class="resource-modal__zoom-btn" title="Reducir">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
            </button>
            <button class="resource-modal__zoom-btn" title="Restablecer vista">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-3.2-6.9"></path>
                <polyline points="21 3 21 9 15 9"></polyline>
              </svg>
            </button>
          </div>

          <div class="resource-modal__zoom-level">170%</div>
        </div>
        <div class="resource-modal__hint">Rueda del ratón para hacer zoom · arrastrar para mover la imagen</div>
      </div>

      <button type="button" class="btn-cancel">Cambiar imagen...</button>
    </div>

    <div class="modal__footer">
      <button class="btn-eliminar">Eliminar</button>
      <button class="btn-cancel">Cancelar</button>
      <button class="btn-accept">Aceptar cambios</button>
    </div>
  </div>
</div>

</body>
</html>
