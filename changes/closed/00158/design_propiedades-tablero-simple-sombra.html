<title>Maqueta — Tablero simple: sección "Visual" con "Sombra de contacto"</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --section-accent: #5b5f97;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal-overlay {
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    border-radius: var(--radius-lg);
  }

  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 420px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-neutral);
  }

  .modal__header-title {
    margin: 0;
    font-size: 1.125rem;
  }

  .modal__subtitle {
    margin: 0.25rem 0 0;
    font-size: 0.8125rem;
    color: var(--text-muted);
  }

  .modal__content {
    padding: 1.5rem 1.5rem 0.5rem;
    overflow-y: auto;
  }

  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin: 0 0 1.25rem;
    padding: 1rem 1.25rem;
    position: relative;
  }

  fieldset.modal__section--new {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(44, 125, 216, 0.12);
  }

  legend.modal__section-title {
    padding: 0 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--section-accent);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .modal__field--checkbox + .modal__field--checkbox {
    margin-top: 0.6rem;
  }

  .modal__field--checkbox input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--accent-blue);
  }

  .modal__field--checkbox label {
    display: inline;
    margin: 0;
    font-size: 0.875rem;
    font-weight: 500;
  }

  .annotation {
    position: absolute;
    top: -0.6rem;
    right: -0.6rem;
    background: #fff3cd;
    border: 1px solid #e0c060;
    color: #6b5300;
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .new-row-marker {
    display: inline-block;
    margin-left: 0.4rem;
    padding: 0.05rem 0.4rem;
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: var(--accent-blue);
    color: var(--text-light);
    border-radius: 999px;
    vertical-align: middle;
  }

  .section-preview {
    opacity: 0.45;
    pointer-events: none;
    position: relative;
  }

  .section-preview::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent, white 90%);
  }

  .border-row {
    display: flex;
    gap: 0.75rem;
  }

  .border-row > div { flex: 1; }

  .border-row label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  input[type="color"] {
    width: 100%;
    height: 40px;
    padding: 0.25rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
  }

  input[type="number"] {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.875rem;
  }

  .modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-neutral);
  }

  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.25rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn-cancel {
    background: var(--bg-subtle);
    border-color: var(--border-neutral);
    color: var(--text-primary);
  }

  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }
</style>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__header-title">Propiedades: Tablero simple</h2>
      <p class="modal__subtitle">Pestaña "Específicas"</p>
    </div>

    <div class="modal__content">
      <fieldset class="modal__section modal__section--new">
        <span class="annotation">Nuevo checkbox añadido</span>
        <legend class="modal__section-title">Visual</legend>
        <div class="modal__field--checkbox">
          <input type="checkbox" id="biselado" checked readonly>
          <label for="biselado">Biselado en el borde</label>
        </div>
        <div class="modal__field--checkbox">
          <input type="checkbox" id="sombra" checked readonly>
          <label for="sombra">Sombra<span class="new-row-marker">NUEVO</span></label>
        </div>
      </fieldset>

      <fieldset class="modal__section">
        <legend class="modal__section-title">Borde</legend>
        <div class="border-row">
          <div>
            <label>Color del borde</label>
            <input type="color" value="#8a5a2b" readonly>
          </div>
          <div>
            <label>Grosor</label>
            <input type="number" value="4" readonly>
          </div>
        </div>
      </fieldset>

      <div class="section-preview">
        <fieldset class="modal__section modal__section--untitled">
          <div>
            <label style="display:block; font-size:0.875rem; font-weight:500; margin-bottom:0.25rem;">Fondo</label>
            <div style="display:flex; gap:0.5rem;">
              <select style="flex:1; padding:0.5rem; border:1px solid var(--border-neutral); border-radius:var(--radius-sm);">
                <option>Color y patrón</option>
              </select>
              <button class="btn-cancel" type="button">Configurar fondo</button>
            </div>
          </div>
        </fieldset>
      </div>
    </div>

    <div class="modal__footer">
      <button class="btn-cancel" type="button">Cancelar</button>
      <button class="btn-accept" type="button">Aceptar</button>
    </div>
  </div>
</div>
