<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maqueta — Modal Ajustar imagen con slider de rotación</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --accent-blue-dark: #123a66;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --transition-fast: 150ms ease;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: fit-content;
    max-width: min(1500px, 95vw);
    display: flex;
    flex-direction: column;
  }
  .modal__header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-neutral);
    font-weight: 600;
    font-size: 1rem;
  }
  .modal__content {
    padding: 1.5rem;
  }
  .image-adjust-modal__content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }
  .image-adjust-modal__stages {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .image-adjust-modal__stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 1rem;
    background: repeating-conic-gradient(#e8e8e8 0% 25%, #f5f5f5 0% 50%) 50% / 20px 20px;
    border: 1px dashed #ccc;
  }
  .image-adjust-modal__stage-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .image-adjust-modal__stage--focused .image-adjust-modal__stage-title {
    color: var(--accent-blue);
  }
  .image-adjust-modal__mask {
    position: relative;
    overflow: hidden;
    width: 220px;
    height: 160px;
    cursor: move;
  }
  .image-adjust-modal__mask--active {
    border: 2px solid var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(44, 125, 216, 0.25);
  }
  .image-adjust-modal__image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  /* --- Zona de controles: zoom, transparencia y la nueva rotación --- */
  .image-adjust-modal__controls {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.4rem;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .slider-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent-blue);
  }

  .value-box {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    flex-shrink: 0;
  }

  .value-box input[type="text"] {
    width: 3.4rem;
    text-align: center;
    padding: 0.4rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.875rem;
  }

  .value-box span {
    color: var(--text-muted);
    font-size: 0.875rem;
  }

  /* --- Nuevo control de rotación: slider 0-360 con marcas imantadas --- */
  .rotation-field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .rotation-slider-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .rotation-slider-track {
    position: relative;
    flex: 1;
    height: 28px;
    display: flex;
    align-items: center;
  }

  .rotation-slider-track input[type="range"] {
    width: 100%;
    margin: 0;
    accent-color: var(--accent-blue);
    position: relative;
    z-index: 2;
  }

  .rotation-marks {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 1;
    padding: 0 1px; /* alinear aproximadamente con los extremos del thumb */
  }

  .rotation-mark {
    width: 3px;
    height: 10px;
    border-radius: 2px;
    background: var(--accent-blue-dark);
    opacity: 0.55;
  }

  .rotation-mark--active {
    opacity: 1;
    background: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(44, 125, 216, 0.2);
  }

  .rotation-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 0.15rem;
  }

  .rotation-labels span:first-child,
  .rotation-labels span:last-child {
    /* centrar visualmente 0º y 360º respecto a sus marcas en el extremo del slider */
    width: 1.5em;
  }
  .rotation-labels span:first-child { text-align: left; }
  .rotation-labels span:last-child { text-align: right; }

  .field-note {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .removed-note {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    padding: 0.5rem 0.75rem;
    border: 1px dashed var(--border-neutral);
    border-radius: var(--radius-sm);
    background: #fafafa;
  }

  .removed-note svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: #b23b3b;
  }
</style>
</head>
<body>

  <div class="modal">
    <div class="modal__header">Ajustar imagen</div>
    <div class="modal__content">
      <div class="image-adjust-modal__content">

        <div class="image-adjust-modal__stages">
          <div class="image-adjust-modal__stage image-adjust-modal__stage--focused">
            <div class="image-adjust-modal__stage-title">ANVERSO</div>
            <div class="image-adjust-modal__mask image-adjust-modal__mask--active">
              <img class="image-adjust-modal__image" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='160'%3E%3Crect width='220' height='160' fill='%23a8c8e8'/%3E%3Ccircle cx='110' cy='70' r='40' fill='%23f0a860'/%3E%3Cpath d='M0 160 L70 90 L140 160 Z' fill='%236fa86f'/%3E%3C/svg%3E" alt="">
            </div>
          </div>
          <div class="image-adjust-modal__stage image-adjust-modal__stage--dim">
            <div class="image-adjust-modal__stage-title">REVERSO</div>
            <div class="image-adjust-modal__mask">
              <img class="image-adjust-modal__image" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='160'%3E%3Crect width='220' height='160' fill='%23d8c8a8'/%3E%3Ccircle cx='110' cy='70' r='40' fill='%23c07850'/%3E%3C/svg%3E" alt="">
            </div>
          </div>
        </div>

        <!-- El botón "Girar 90º" ya no existe. Nota solo informativa de la maqueta,
             no forma parte del diseño final. -->
        <div class="removed-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
          El botón "Girar 90º" se elimina — sustituido por el control de rotación de abajo
        </div>

        <div class="image-adjust-modal__controls">

          <div class="modal__field">
            <label>Zoom</label>
            <div class="slider-row">
              <input type="range" min="100" max="300" value="140">
              <div class="value-box"><input type="text" value="140"><span>%</span></div>
            </div>
          </div>

          <div class="modal__field">
            <label>Transparencia</label>
            <div class="slider-row">
              <input type="range" min="0" max="100" value="100">
              <div class="value-box"><input type="text" value="100"><span>%</span></div>
            </div>
          </div>

          <!-- Nuevo control: rotación 0-360º con marcas imantadas cada 90º -->
          <div class="modal__field rotation-field">
            <label>Rotación</label>
            <div class="rotation-slider-wrap">
              <div class="rotation-slider-track">
                <div class="rotation-marks">
                  <div class="rotation-mark"></div>
                  <div class="rotation-mark"></div>
                  <div class="rotation-mark rotation-mark--active"></div>
                  <div class="rotation-mark"></div>
                  <div class="rotation-mark"></div>
                </div>
                <input type="range" min="0" max="360" value="180">
              </div>
              <div class="value-box"><input type="text" value="180"><span>º</span></div>
            </div>
            <div class="rotation-labels">
              <span>0º</span><span>90º</span><span>180º</span><span>270º</span><span>360º</span>
            </div>
            <div class="field-note">El slider se ajusta automáticamente al pasar cerca de una marca</div>
          </div>

        </div>

      </div>
    </div>
  </div>

</body>
</html>
