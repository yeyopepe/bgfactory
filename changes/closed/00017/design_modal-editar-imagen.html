<div style="height:100%; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); font-family: system-ui, sans-serif;">
  <div style="width:420px; background:#f5f5f5; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.15); overflow:hidden;">

    <div style="padding:1rem; font-size:1.125rem; font-weight:500; border-bottom:1px solid #eee; background:#f5f5f5;">
      Editar recurso: Imagen
    </div>

    <div style="padding:1rem; display:flex; flex-direction:column; gap:1rem;">

      <div style="display:flex; flex-direction:column; gap:0.25rem;">
        <label style="font-size:0.875rem; font-weight:500;">Nombre del recurso</label>
        <input type="text" value="token_lobo" style="padding:0.5rem; font-size:0.875rem; border:1px solid #ddd; border-radius:4px;" />
      </div>

      <div style="display:flex; flex-direction:column; gap:0.5rem;">
        <label style="font-size:0.875rem; font-weight:500;">Vista previa</label>
        <div style="width:100%; height:160px; border:1px solid #ddd; border-radius:4px; background:#e0e0e0; display:flex; align-items:center; justify-content:center;">
          <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
        <button style="align-self:flex-start; padding:0.5rem 1rem; border:none; border-radius:4px; background:#f0f0f0; color:#1a1a1a; font-size:0.875rem; cursor:pointer;">Cambiar imagen...</button>
      </div>

    </div>

    <div style="padding:1rem; display:flex; justify-content:space-between; border-top:1px solid #eee;">
      <button style="padding:0.5rem 1rem; border:none; border-radius:4px; background:#d32f2f; color:#fff; font-size:0.875rem; cursor:pointer;">Eliminar</button>
      <div style="display:flex; gap:0.5rem;">
        <button style="padding:0.5rem 1rem; border:none; border-radius:4px; background:#f0f0f0; color:#1a1a1a; font-size:0.875rem; cursor:pointer;">Cancelar</button>
        <button style="padding:0.5rem 1rem; border:none; border-radius:4px; background:#2c7dd8; color:#fff; font-size:0.875rem; cursor:pointer;">Aceptar cambios</button>
      </div>
    </div>

  </div>
</div>
