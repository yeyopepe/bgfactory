<title>Maqueta — Tablero personalizado: sección "Visual"</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --section-accent: #5b5f97;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg-table);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal-overlay {
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    border-radius: var(--radius-lg);
  }

  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 420px;
    display: flex;
    flex-direction: column;
  }

  .modal__header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-neutral);
  }

  .modal__header-title {
    margin: 0;
    font-size: 1.125rem;
  }

  .modal__subtitle {
    margin: 0.25rem 0 0;
    font-size: 0.8125rem;
    color: var(--text-muted);
  }

  .modal__content {
    padding: 1.5rem;
  }

  .modal__field {
    margin-bottom: 1.25rem;
  }

  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin: 0;
    padding: 1rem 1.25rem;
    position: relative;
  }

  fieldset.modal__section--new {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(44, 125, 216, 0.12);
  }

  legend.modal__section-title {
    padding: 0 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--section-accent);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .btn-cancel {
    width: 100%;
    padding: 0.65rem 1.25rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    background: var(--bg-subtle);
    border: 1px solid var(--border-neutral);
    color: var(--text-primary);
  }

  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .modal__field--checkbox input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--accent-blue);
  }

  .modal__field--checkbox label {
    display: inline;
    margin: 0;
    font-size: 0.875rem;
    font-weight: 500;
  }

  .hint {
    margin: 0.5rem 0 0;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .annotation {
    position: absolute;
    top: -0.6rem;
    right: -0.6rem;
    background: #fff3cd;
    border: 1px solid #e0c060;
    color: #6b5300;
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-neutral);
  }

  .btn-accept {
    padding: 0.5rem 1.25rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    background: var(--accent-blue);
    color: var(--text-light);
  }

  .btn-footer-cancel {
    padding: 0.5rem 1.25rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    background: var(--bg-subtle);
    border: 1px solid var(--border-neutral);
    color: var(--text-primary);
  }
</style>

<div class="modal-overlay">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__header-title">Propiedades: Tablero personalizado</h2>
      <p class="modal__subtitle">Pestaña "Específicas"</p>
    </div>

    <div class="modal__content">
      <fieldset class="modal__section modal__section--new">
        <span class="annotation">Nueva sección — ahora la primera</span>
        <legend class="modal__section-title">Visual</legend>
        <div class="modal__field--checkbox">
          <input type="checkbox" id="biselado-personalizado" checked readonly>
          <label for="biselado-personalizado">Biselado en el borde</label>
        </div>
      </fieldset>

      <div class="modal__field" style="margin-top: 1.25rem;">
        <button class="btn-cancel" type="button">Editar diseño del tablero</button>
        <p class="hint">Color y grosor del borde se configuran dentro del Editor visual.</p>
      </div>
    </div>

    <div class="modal__footer">
      <button class="btn-footer-cancel" type="button">Cancelar</button>
      <button class="btn-accept" type="button">Aceptar</button>
    </div>
  </div>
</div>
