<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maqueta — Fila de componente agrupado en el panel</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
  }

  .panel {
    width: 560px;
    background: #f5f5f5;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .panel__header {
    background: #333333;
    color: #ffffff;
    padding: 10px 14px;
    font-weight: bold;
    font-size: 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    text-align: left;
    background: #f0f0f0;
    padding: 8px 10px;
    border-bottom: 1px solid #dcdcdc;
    font-weight: 600;
    color: #1a1a1a;
  }

  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid #dcdcdc;
    color: #1a1a1a;
    vertical-align: middle;
  }

  .col-orden { width: 60px; }
  .col-id { width: 150px; }
  .col-tipo { width: 90px; }
  .col-copia { width: 60px; text-align: center; }
  .col-acciones { white-space: nowrap; }

  .action-btn {
    display: inline-block;
    padding: 5px 10px;
    margin-right: 6px;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    color: #ffffff;
    background: #2c7dd8;
  }

  .action-btn:last-child {
    margin-right: 0;
  }

  .action-btn--danger {
    background: #d32f2f;
  }

  .action-btn[disabled] {
    background: #e8e8e8;
    color: #999999;
    cursor: not-allowed;
  }

  .note {
    max-width: 560px;
    margin-top: 18px;
    padding: 14px 18px;
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    font-size: 14px;
    color: #1a1a1a;
  }

  .note h2 {
    margin: 0 0 8px;
    font-size: 15px;
  }

  .note p {
    margin: 0;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="panel">
    <div class="panel__header">Componentes (1)</div>
    <table>
      <thead>
        <tr>
          <th class="col-orden">Orden</th>
          <th class="col-id">Id</th>
          <th class="col-tipo">Tipo</th>
          <th class="col-copia">Copia</th>
          <th class="col-acciones">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-orden">1</td>
          <td class="col-id">texto-7c02</td>
          <td class="col-tipo">texto</td>
          <td class="col-copia"></td>
          <td class="col-acciones">
            <button type="button" class="action-btn">Editar</button>
            <button type="button" class="action-btn" disabled>Clonar</button>
            <button type="button" class="action-btn" disabled>Copiar</button>
            <button type="button" class="action-btn action-btn--danger">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="note">
    <h2>Componente que pertenece a un grupo</h2>
    <p>"Editar" y "Eliminar" quedan habilitados: se pueden usar de forma individual aunque el componente siga en el grupo. "Clonar" y "Copiar" quedan deshabilitados mientras dure la agrupación.</p>
  </div>

</body>
</html>
