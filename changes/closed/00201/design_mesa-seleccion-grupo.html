<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maqueta — Mesa con grupo seleccionado</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
  }

  .table {
    position: relative;
    width: 780px;
    height: 420px;
    background-color: #c2c2c2;
    background-image: radial-gradient(circle, #aaaaaa 1px, transparent 1px);
    background-size: 24px 24px;
    border-radius: 8px;
    overflow: hidden;
  }

  .text-box {
    position: absolute;
    width: 200px;
    height: 90px;
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.08);
    padding: 10px;
    box-sizing: border-box;
    font-size: 13px;
    color: #1a1a1a;
    line-height: 1.4;
  }

  .text-box--clicked {
    outline: 3px dashed #2c7dd8;
    outline-offset: 4px;
  }

  .text-box--group-member {
    outline: 3px dashed #666666;
    outline-offset: 4px;
  }

  .component-id-label {
    position: absolute;
    top: -22px;
    left: 0;
    background: #123a66;
    color: #ffffff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .text-box--group-member .component-id-label {
    background: #666666;
  }

  .box-1 { left: 60px; top: 60px; }
  .box-2 { left: 340px; top: 40px; }
  .box-3 { left: 480px; top: 220px; }

  .legend {
    max-width: 780px;
    margin-top: 18px;
    padding: 14px 18px;
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    font-size: 14px;
    color: #1a1a1a;
  }

  .legend h2 {
    margin: 0 0 10px;
    font-size: 15px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .legend-item:last-child {
    margin-bottom: 0;
  }

  .swatch {
    width: 28px;
    height: 18px;
    border-radius: 3px;
    flex: none;
  }

  .swatch--clicked {
    outline: 3px dashed #2c7dd8;
    outline-offset: 2px;
    background: #ffffff;
  }

  .swatch--group {
    outline: 3px dashed #666666;
    outline-offset: 2px;
    background: #ffffff;
  }
</style>
</head>
<body>

  <div class="table">
    <div class="text-box text-box--clicked box-1">
      <span class="component-id-label">texto-a3f1</span>
      Lorem ipsum dolor sit amet, consectetur.
    </div>
    <div class="text-box text-box--group-member box-2">
      <span class="component-id-label">texto-7c02</span>
      Lorem ipsum dolor sit amet.
    </div>
    <div class="text-box text-box--group-member box-3">
      <span class="component-id-label">texto-9be4</span>
      Sit amet, consectetur adipiscing.
    </div>
  </div>

  <div class="legend">
    <h2>Leyenda del contorno de selección</h2>
    <div class="legend-item">
      <div class="swatch swatch--clicked"></div>
      <span>Azul — elemento clicado directamente</span>
    </div>
    <div class="legend-item">
      <div class="swatch swatch--group"></div>
      <span>Gris oscuro — resto del grupo, seleccionado junto con él</span>
    </div>
  </div>

</body>
</html>
