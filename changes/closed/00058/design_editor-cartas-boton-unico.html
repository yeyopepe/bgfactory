<div style="font-family: system-ui, sans-serif; background:#2b2b2b; padding:40px; display:flex; justify-content:center;">
  <div style="width:640px; background:#fff; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.4); overflow:hidden;">
    <div style="padding:16px 20px; border-bottom:1px solid #e5e5e5; font-size:18px; font-weight:600; color:#222;">Editor de cartas</div>

    <div style="padding:16px 20px 0; display:flex; gap:10px; align-items:center;">
      <label style="font-size:13px; color:#444;">Proporción</label>
      <select style="padding:4px 8px; border-radius:6px; border:1px solid #ccc; font-size:13px;"><option>5:7 (Poker vertical)</option></select>
    </div>

    <div style="padding:20px; display:flex; gap:24px; justify-content:center;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="font-size:13px; color:#555; font-weight:600;">Cara frontal</div>
        <div style="width:150px; height:210px; border-radius:8px; background:#e7d9c4; border:1px solid #d8d8d8;"></div>
        <div style="display:flex; gap:6px;">
          <button style="padding:6px 10px; border-radius:6px; border:1px solid #ccc; background:#f2f2f2; font-size:12px;">Elegir imagen…</button>
          <button style="padding:6px 10px; border-radius:6px; border:1px solid #ccc; background:#f0f0f0; font-size:12px; color:#333;">+ Cuadro de texto</button>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="font-size:13px; color:#555; font-weight:600;">Cara trasera</div>
        <div style="width:150px; height:210px; border-radius:8px; background:#c9a876; border:1px solid #d8d8d8;"></div>
        <div style="display:flex; gap:6px;">
          <button style="padding:6px 10px; border-radius:6px; border:1px solid #ccc; background:#f2f2f2; font-size:12px;">Elegir imagen…</button>
          <button style="padding:6px 10px; border-radius:6px; border:1px solid #ccc; background:#f0f0f0; font-size:12px; color:#333;">+ Cuadro de texto</button>
        </div>
      </div>
    </div>

    <div style="padding:0 20px 20px; display:flex; justify-content:center;">
      <button style="padding:8px 18px; border-radius:6px; border:1px solid #3b82f6; background:#eef4ff; color:#3b82f6; font-size:13px; font-weight:600;">Ajustar imagen…</button>
    </div>

    <div style="padding:16px 20px; border-top:1px solid #e5e5e5; display:flex; justify-content:flex-end; gap:10px;">
      <button style="padding:8px 16px; border-radius:6px; border:1px solid #ccc; background:#f2f2f2; color:#333; font-size:14px;">Cancelar</button>
      <button style="padding:8px 16px; border-radius:6px; border:none; background:#3b82f6; color:#fff; font-size:14px; font-weight:600;">Aceptar</button>
    </div>
  </div>
</div>
