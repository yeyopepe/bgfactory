<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de cartas — tamaño normal</title>
<style>
  :root {
    --bg-table: #c2c2c2;
    --bg-table-dot: rgba(0, 0, 0, 0.09);
    --accent-blue: #2c7dd8;
    --accent-blue-light: #eaf3fc;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --transition-fast: 150ms ease;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; color: var(--text-primary); }
  body {
    background-color: var(--bg-table);
    background-image: radial-gradient(circle, var(--bg-table-dot) 1.5px, transparent 1.5px);
    background-size: 18px 18px;
  }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }

  /* --- .modal / .card-editor-modal, tal cual main.css hoy --- */
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    display: flex;
    flex-direction: column;
  }
  .card-editor-modal {
    width: fit-content;
    max-width: min(1500px, 95vw);
    max-height: 80vh;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .modal__content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    gap: 1.5rem;
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }
  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
  }
  .btn-cancel { background: var(--bg-subtle); color: var(--text-primary); }
  .btn-cancel:hover { background: var(--bg-hover); }
  .btn-accept { background: var(--accent-blue); color: var(--text-light); }

  .modal__field { margin-bottom: 1rem; }
  .modal__field label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
  .modal__field select {
    width: 100%; padding: 0.5rem; border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm); font-family: inherit; font-size: 0.875rem;
  }
  .modal__field--checkbox { display: flex; align-items: center; gap: 0.5rem; }
  .modal__field--checkbox label { display: inline; margin-bottom: 0; }

  /* --- Icono de ayuda (ui/helpIcon.js) --- */
  .help-icon {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--text-muted); color: var(--text-light);
    font-size: 0.7rem; font-weight: 600; cursor: help; flex-shrink: 0;
  }

  /* --- Botón nuevo propuesto: maximizar/restaurar --- */
  .card-editor-maximize-btn {
    width: 26px; height: 26px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-neutral);
    background: var(--bg-subtle);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-primary);
    cursor: pointer;
    flex-shrink: 0;
  }
  .card-editor-maximize-btn:hover { background: var(--bg-hover); }

  .modal__header span.title { font-weight: 600; flex: 1; }

  /* --- Card editor modal, sección específica (main.css bloque 00053) --- */
  .card-editor-modal__toolbar { max-width: 16rem; }
  .card-editor-modal__faces { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
  .card-editor-modal__face { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .card-editor-modal__face-label { font-weight: 500; font-size: 0.875rem; }
  .card-editor-modal__canvas {
    position: relative; overflow: hidden; background: #ffffff;
    border: 1px solid var(--border-neutral);
  }
  .card-editor-modal__face-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
  .card-editor-modal__adjust-image { align-self: flex-start; margin-top: 8.75rem; padding: 0.5rem 0.75rem; }
  .card-editor-modal__border-title {
    font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.02em; margin: 0.25rem 0 0 0; width: 100%;
  }
  .card-editor-modal__textbox {
    position: absolute; cursor: move; overflow: hidden; word-break: break-word;
    white-space: pre-wrap; user-select: none; box-sizing: border-box;
    border: 1px dashed rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center;
    padding: 2px; font-family: system-ui, sans-serif;
  }
  .card-editor-modal__shape { position: absolute; box-sizing: border-box; }

  /* --- Botón "Añadir elemento ▾" (mismo patrón que resourceList.js) --- */
  .resource-add { position: relative; width: 100%; }
  .resource-add__button {
    width: 100%; padding: 0.5rem; background: var(--accent-blue); color: var(--text-light);
    border: none; border-radius: var(--radius-sm); cursor: pointer;
  }

  /* --- Fila "Borde": color + grosor --- */
  .border-field-row { display: flex; gap: 0.5rem; width: 100%; }
  .border-field-row > div { flex: 1; }
  .border-field-row input[type="color"] { width: 100%; height: 32px; padding: 0; border: 1px solid var(--border-neutral); border-radius: var(--radius-sm); cursor: pointer; }
  .border-field-row input[type="number"] { width: 100%; padding: 0.5rem; border: 1px solid var(--border-neutral); border-radius: var(--radius-sm); }
</style>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal card-editor-modal">
      <div class="modal__header">
        <span class="title">Editor de cartas</span>
        <span class="card-editor-maximize-btn" title="Maximizar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="help-icon">?</span>
      </div>
      <div class="modal__content">
        <div class="card-editor-modal__toolbar">
          <div class="modal__field">
            <label>Proporción</label>
            <select>
              <option>Estándar (5:7)</option>
              <option>Cuadrada (1:1)</option>
              <option>Circular</option>
            </select>
          </div>
          <div class="modal__field modal__field--checkbox">
            <input type="checkbox" id="esquinas" checked>
            <label for="esquinas">Esquinas redondeadas</label>
          </div>
        </div>

        <div class="card-editor-modal__faces">
          <div class="card-editor-modal__face" style="width: 190px;">
            <div class="card-editor-modal__face-label">Cara frontal</div>
            <div class="card-editor-modal__canvas" style="width: 190px; height: 266px; border-radius: 8px;">
              <div class="card-editor-modal__textbox" style="left:14px; top:14px; width:162px; height:32px; font-size:12px; font-weight:700; background:rgba(255,255,255,0.85); text-align:center;">Guardián del Bosque</div>
              <div class="card-editor-modal__shape" style="left:55px; top:110px; width:80px; height:80px; border-radius:50%; background:rgba(44,125,216,0.25); border:2px solid #123a66;"></div>
              <div class="card-editor-modal__textbox" style="left:14px; top:210px; width:162px; height:42px; font-size:9px; background:rgba(255,255,255,0.85);">Al entrar en juego, gana +1 de escudo por cada aliado adyacente.</div>
            </div>
            <div class="card-editor-modal__face-actions">
              <div class="resource-add">
                <button class="resource-add__button" type="button">Añadir elemento ▾</button>
              </div>
              <p class="card-editor-modal__border-title">Borde</p>
              <div class="modal__field" style="width: 100%; margin-bottom: 0;">
                <div class="border-field-row">
                  <div>
                    <label style="font-size:0.75rem;">Color</label>
                    <input type="color" value="#000000">
                  </div>
                  <div>
                    <label style="font-size:0.75rem;">Grosor (px)</label>
                    <input type="number" value="0" min="0" max="20">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <button type="button" class="btn-cancel card-editor-modal__adjust-image">Ajustar imagen…</button>

          <div class="card-editor-modal__face" style="width: 190px;">
            <div class="card-editor-modal__face-label">Cara trasera</div>
            <div class="card-editor-modal__canvas" style="width: 190px; height: 266px; border-radius: 8px;">
              <div class="card-editor-modal__textbox" style="left:14px; top:110px; width:162px; height:32px; font-size:14px; font-weight:700; background:rgba(255,255,255,0.85); text-align:center;">Errantes</div>
            </div>
            <div class="card-editor-modal__face-actions">
              <div class="resource-add">
                <button class="resource-add__button" type="button">Añadir elemento ▾</button>
              </div>
              <p class="card-editor-modal__border-title">Borde</p>
              <div class="modal__field" style="width: 100%; margin-bottom: 0;">
                <div class="border-field-row">
                  <div>
                    <label style="font-size:0.75rem;">Color</label>
                    <input type="color" value="#000000">
                  </div>
                  <div>
                    <label style="font-size:0.75rem;">Grosor (px)</label>
                    <input type="number" value="0" min="0" max="20">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn-cancel">Cancelar</button>
        <button class="btn-accept">Aceptar</button>
      </div>
    </div>
  </div>
</body>
</html>
