<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mockup — Ventana "Configurar fondo" reorganizada en secciones</title>
<style>
  :root {
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0,0,0,0.15);
    --transition-fast: 150ms ease;
    --section-accent: #5b5f97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: rgba(0,0,0,0.5);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal {
    background: #fff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 420px;
    max-width: 95vw;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
    font-size: 1.125rem;
    color: var(--text-primary);
  }
  .modal__content {
    padding: 1.5rem 1.25rem;
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }

  .modal__field { margin-bottom: 1rem; }
  .modal__field:last-child { margin-bottom: 0; }
  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .modal__field select,
  .modal__field input[type="number"],
  .modal__field input[type="color"] {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.875rem;
  }
  .modal__field input[type="color"] { height: 40px; cursor: pointer; }
  .modal__field select { cursor: pointer; }

  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .modal__field--checkbox label { display: inline; margin-bottom: 0; }

  .field-row {
    display: flex;
    gap: 0.5rem;
  }
  .field-row > div { flex: 1; }

  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin: 0 0 1.25rem;
    padding: 1rem 1.25rem;
  }
  fieldset.modal__section:last-of-type { margin-bottom: 0; }
  fieldset.modal__section > *:last-child { margin-bottom: 0; }

  legend.modal__section-title {
    padding: 0 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--section-accent);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
  }
  .btn-cancel { background: var(--bg-subtle); color: var(--text-primary); }
  .btn-accept { background: var(--accent-blue); color: var(--text-light); }

  .color-transparent-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .color-transparent-row input[type="color"] { flex: 0 0 auto; width: 60px; }
</style>
</head>
<body>
  <div class="modal">
    <div class="modal__header">Configurar fondo — Color y patrón</div>
    <div class="modal__content">

      <fieldset class="modal__section">
        <legend class="modal__section-title">Configuración</legend>

        <div class="modal__field">
          <label>Forma de casilla</label>
          <select>
            <option selected>Cuadrada</option>
            <option>Hexagonal (vértices arriba/abajo)</option>
            <option>Hexagonal (vértices izquierda/derecha)</option>
          </select>
        </div>

        <div class="field-row">
          <div class="modal__field">
            <label>Filas</label>
            <input type="number" value="8" min="1" max="50">
          </div>
          <div class="modal__field">
            <label>Columnas</label>
            <input type="number" value="8" min="1" max="50">
          </div>
        </div>
      </fieldset>

      <fieldset class="modal__section">
        <legend class="modal__section-title">Color</legend>

        <div class="modal__field">
          <label>Color de fondo</label>
          <div class="color-transparent-row">
            <input type="color" value="#ffffff">
            <div class="modal__field--checkbox" style="margin-top:0;">
              <input type="checkbox" id="transp1">
              <label for="transp1">Transparente</label>
            </div>
          </div>
        </div>

        <div class="field-row">
          <div class="modal__field">
            <label>Color del patrón</label>
            <input type="color" value="#000000">
          </div>
          <div class="modal__field">
            <label>Grosor</label>
            <input type="number" value="1" min="1" max="20">
          </div>
        </div>
      </fieldset>

    </div>
    <div class="modal__footer">
      <button type="button" class="btn-cancel">Cancelar</button>
      <button type="button" class="btn-accept">Aceptar</button>
    </div>
  </div>
</body>
</html>
