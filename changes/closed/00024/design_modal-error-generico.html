<div style="font-family: system-ui, sans-serif; height: 100%; min-height: 480px; background: #808080; position: relative;">

  <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #f5f5f5; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 420px; max-width: 90vw;">

      <div style="padding: 1rem; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 0.5rem;">
        <span style="display:inline-flex; align-items:center; justify-content:center; width: 20px; height: 20px; border-radius: 50%; background: #d32f2f; color: #fff; font-size: 0.75rem; flex-shrink: 0;">!</span>
        <h2 style="margin: 0; font-size: 1.125rem; color: #1a1a1a;">Error</h2>
      </div>

      <div style="padding: 1rem; font-size: 0.875rem; color: #1a1a1a; line-height: 1.5;">
        <p style="margin: 0;">El recurso "escudo-madera.png" está en uso y no se puede eliminar.</p>
      </div>

      <div style="padding: 1rem; border-top: 1px solid #ddd; display: flex; justify-content: flex-end;">
        <button style="padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem; background: #f0f0f0; color: #1a1a1a;">Cerrar</button>
      </div>

    </div>
  </div>

  <p style="position: absolute; bottom: 1rem; left: 1rem; right: 1rem; font-size: 0.75rem; color: #333; text-align: center;">
    Mismo elemento común (icono "!" rojo + título "Error" + mensaje) para cualquier error de la app —
    con o sin detalle técnico adicional, según el caso (ver <code>design_modal-error-importacion.html</code>).
  </p>

</div>
